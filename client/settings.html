<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Cài đặt</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=8aabd3f8" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=ba363fa2" />
  <link rel="stylesheet" href="css/platform.css?v=ae47d7cf" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=b452e3a9"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp pset" role="main">
  <div class="pintro">
    <h1 data-i18n="settings.page_title">Cài đặt</h1>
    <p id="st-status" class="pnote" role="status"></p>
  </div>

  <div class="ptabs pset__tabs" role="tablist" id="st-tabs">
    <button type="button" class="ptab" role="tab" id="tab-profile" data-p="profile" aria-controls="p-profile" aria-selected="true"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-user-circle"></use></svg><span data-i18n="settings.tab_profile">Hồ sơ</span></button>
    <button type="button" class="ptab" role="tab" id="tab-look" data-p="look" aria-controls="p-look" aria-selected="false"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-paint-brush"></use></svg><span data-i18n="settings.tab_look">Giao diện</span></button>
    <button type="button" class="ptab" role="tab" id="tab-game" data-p="game" aria-controls="p-game" aria-selected="false"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-sliders-horizontal"></use></svg><span data-i18n="settings.tab_game">Cài đặt</span></button>
    <button type="button" class="ptab" role="tab" id="tab-account" data-p="account" aria-controls="p-account" aria-selected="false"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-user-gear"></use></svg><span data-i18n="settings.tab_account">Tài khoản</span></button>
  </div>

  <section class="ppanel pset__panel" role="tabpanel" id="p-profile" aria-labelledby="tab-profile">
    <div id="st-content" hidden>
      <form id="st-form" class="pform pbento">
        <div class="ptile ptile--avatar">
          <h2 class="ptile__h"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-camera"></use></svg><span data-i18n="settings.tile_avatar">Ảnh đại diện</span></h2>
          <span id="st-avatar"></span>
          <div class="pbento__btns">
            <label class="pbtn pbtn--primary" for="st-file"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-camera"></use></svg><span data-i18n="profile.avatar_upload">Đổi ảnh đại diện</span></label>
            <input type="file" id="st-file" accept="image/jpeg,image/png,image/webp" hidden />
            <button type="button" class="pbtn pbtn--ghost" id="st-avatar-remove"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-trash"></use></svg><span data-i18n="profile.avatar_remove">Xoá ảnh</span></button>
          </div>
          <p class="pnote" data-i18n="profile.avatar_hint">JPEG, PNG hoặc WebP, tối đa 2 MB. Ảnh được thu nhỏ còn 256×256.</p>
        </div>
        <div class="ptile ptile--bio">
          <h2 class="ptile__h"><label for="st-bio"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-quotes"></use></svg><span data-i18n="profile.bio_label">Giới thiệu</span></label></label><span class="pcount" id="st-bio-count" aria-hidden="true">0/280</span></h2>
          <textarea id="st-bio" maxlength="280" rows="3" placeholder="Tối đa 280 ký tự" data-i18n-placeholder="common.max_280"></textarea>
        </div>
        <div class="ptile ptile--place">
          <h2 class="ptile__h"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-map-pin"></use></svg><span data-i18n="settings.tile_place">Nơi ở</span></h2>
          <div class="ptile__two">
            <div class="pfield"><label for="st-country"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-globe"></use></svg><span data-i18n="settings.country">Quốc gia</span></label><select id="st-country"></select></div>
            <div class="pfield"><label for="st-city"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-map-pin"></use></svg><span data-i18n="settings.city">Thành phố</span></label><input id="st-city" maxlength="40" autocomplete="off" /></div>
          </div>
        </div>
        <div class="ptile ptile--priv">
          <h2 class="ptile__h"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-lock"></use></svg><span data-i18n="settings.privacy">Riêng tư</span></h2>
        <label class="pcheck"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-clock-counter-clockwise"></use></svg><span data-i18n="profile.hide_history">Ẩn lịch sử ván đấu với người khác</span><input type="checkbox" id="st-hide-history" /></label>
        <label class="pcheck"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-quotes"></use></svg><span data-i18n="profile.hide_bio">Ẩn giới thiệu với người khác</span><input type="checkbox" id="st-hide-bio" /></label>
        <label class="pcheck"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-user-circle-dashed"></use></svg><span data-i18n="settings.hide_online">Ẩn trạng thái trực tuyến</span><input type="checkbox" id="st-hide-online" /></label>
        </div>
        <div class="ptile ptile--contact">
          <h2 class="ptile__h"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-users-three"></use></svg><span data-i18n="settings.tile_contact">Ai được liên hệ</span></h2>
        <div class="paud"><span class="paud__lab" id="st-dm-lab"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-chat-circle"></use></svg><span data-i18n="settings.who_dm">Ai được nhắn tin</span></span><div class="paudseg" role="radiogroup" id="st-dm" data-aud="whoCanDm" aria-labelledby="st-dm-lab"></div></div>
        <div class="paud"><span class="paud__lab" id="st-challenge-lab"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-boxing-glove"></use></svg><span data-i18n="settings.who_challenge">Ai được thách đấu</span></span><div class="paudseg" role="radiogroup" id="st-challenge" data-aud="whoCanChallenge" aria-labelledby="st-challenge-lab"></div></div>
        <div class="paud"><span class="paud__lab" id="st-friend-lab"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-user-plus"></use></svg><span data-i18n="settings.who_friend">Ai được kết bạn</span></span><div class="paudseg" role="radiogroup" id="st-friend" data-aud="whoCanFriend" aria-labelledby="st-friend-lab"></div></div>
        </div>
        <div class="pform__row pset__save">
          <button type="submit" class="pbtn pbtn--primary"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-check"></use></svg><span data-i18n="profile.save">Lưu</span></button>
          <button type="button" class="pbtn pbtn--ghost" id="st-cancel"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-arrow-counter-clockwise"></use></svg><span data-i18n="settings.cancel">Huỷ</span></button>
          <a id="st-profile-link" class="pbtn pbtn--ghost" href="/"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-eye"></use></svg><span data-i18n="settings.view_profile">Xem hồ sơ</span></a>
          <span id="st-saved" class="pnote" role="status"></span>
        </div>
      </form>
    </div>
  </section>

  <section class="ppanel pset__panel" role="tabpanel" id="p-look" aria-labelledby="tab-look" hidden></section>
  <section class="ppanel pset__panel" role="tabpanel" id="p-game" aria-labelledby="tab-game" hidden></section>
  <section class="ppanel pset__panel" role="tabpanel" id="p-account" aria-labelledby="tab-account" hidden></section>
</main>

<script src="js/i18n.js?v=e03aff66"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=349e6629"></script>
<script src="js/platform-shell.js?v=7b801850"></script>
<script src="js/countries.js?v=60e0b5b7"></script>
<script src="js/avatar-crop.js?v=2f613ebf"></script>
<script src="js/settings.js?v=31a1b31d"></script>
<script src="js/board.js?v=f68e69fd"></script>
<script src="js/settings-board.js?v=0ab3ed19"></script>
<script src="js/settings-page.js?v=ce919122"></script>
</body>
</html>
