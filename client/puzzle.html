<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Served at /puzzle/<id>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Puzzle</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=93220240" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=174b5103" />
  <link rel="stylesheet" href="css/platform.css?v=f4b4f520" />
  <link rel="stylesheet" href="css/puzzles.css?v=1c0bf42e" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="pl pz-page">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <p class="pz-back"><a href="/puzzles" class="pz-backbtn"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-arrow-left"></use></svg><span data-i18n="puzzles.back">Tất cả puzzle</span></a></p>
  <div id="pz-error" class="pnote" hidden></div>

  <div id="pz-view" class="pz-solve" hidden>
    <div class="pz-solve__board ppanel">
      <canvas id="pz-canvas"></canvas>
    </div>

    <div class="pz-solve__side ppanel">
      <h1 id="pz-title" class="pz-title"></h1>
      <div id="pz-meta" class="pz-meta"></div>
      <p id="pz-prompt" class="pz-prompt"></p>
      <p id="pz-turn" class="pz-turn"></p>

      <div id="pz-moves" class="pz-moves" aria-live="polite"></div>
      <form id="pz-form" class="pz-form" autocomplete="off">
        <label class="muted small" for="pz-input" id="pz-input-label"></label>
        <input id="pz-input" type="text" maxlength="200" spellcheck="false" data-i18n-placeholder="puzzles.input_ph" placeholder="H8, J9" />
        <div class="pactions">
          <button type="submit" id="pz-submit" class="pz-btn pz-btn--primary" data-i18n="puzzles.check">Kiểm tra</button>
          <button type="button" id="pz-clear" class="pz-tbtn pz-tbtn--danger" data-i18n="puzzles.clear">Xoá hết</button>
        </div>
      </form>
      <p id="pz-attempts" class="muted small" hidden></p>
      <p id="pz-explore-note" class="muted small" hidden data-i18n="puzzles.explore_note">Bàn cờ đã mở: đặt quân tự do để nghiên cứu, không tính là lượt thử.</p>
      <div class="pactions"><button type="button" id="pz-reset" class="pz-tbtn" hidden><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-arrow-counter-clockwise"></use></svg><span data-i18n="puzzles.reset_board">Về thế ban đầu</span></button></div>
      <p id="pz-result" class="pz-result" role="status" hidden></p>
      <p id="pz-login" class="pnote" hidden></p>
      <div id="pz-next" class="pactions" hidden>
        <a id="pz-next-link" class="pz-btn pz-btn--primary" href="/puzzles" data-i18n="puzzles.more">Puzzle khác</a>
      </div>
      <section id="pz-history" hidden>
        <h2 class="small" data-i18n="puzzles.my_attempts">Lượt thử của bạn</h2>
        <div id="pz-history-list" class="pz-moves"></div>
      </section>
      <section id="pz-solvers" hidden>
        <h2 class="small" id="pz-solvers-h"></h2>
        <div id="pz-solvers-list"></div>
      </section>
    </div>
  </div>
</main>

<script src="js/i18n.js?v=a24964df"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=4f7ecd46"></script>
<script src="js/platform-shell.js?v=ee86dad9"></script>
<script src="js/coords.js?v=f2d4e6d0"></script>
<script src="js/board.js?v=91667397"></script>
<script src="js/puzzle-board.js?v=8bf7b792"></script>
<script src="js/puzzle.js?v=c4503a5e"></script>
</body>
</html>
