<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Xem lại ván</title>
  <meta name="description" content="Xem lại và phát lại một ván Caro trên Play3CR." id="meta-description" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=93220240" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=174b5103" />
  <link rel="stylesheet" href="css/platform.css?v=f4b4f520" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="css/replay.css?v=9f3a13c4" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="pl rp-page">

<!-- ── Top Nav: Arena shell, built by js/platform-shell.js (B193) ───────── -->
<div id="pl-shell"></div>

<!-- ── Replay (#502, mockup A) ─────────────────────────────────────────────
     DOM order = phone reading order: players → board → timeline + transport → move strip → info → options
     → move list → delete + report. The desktop places the same children with grid areas (board | panel);
     the two aria-hidden divs only paint the panel and the player card behind them. -->
<main id="view-replay" class="rp" role="main" aria-labelledby="rp-title">
  <div class="rp-bg rp-bg--panel" aria-hidden="true"></div>
  <div class="rp-bg rp-bg--card" aria-hidden="true"></div>
  <h1 id="rp-title" class="rp-sr" data-i18n="replay.info">Thông tin ván</h1>

  <div class="rp-back">
    <button id="replay-back" class="rp-backbtn" type="button">
      <svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-arrow-left"></use></svg>
      <span data-i18n="replay.back">Quay lại</span>
    </button>
  </div>

  <div class="rp-players">
    <div id="replay-black" class="rp-player"></div>
    <div id="replay-white" class="rp-player"></div>
  </div>

  <div id="rp-board" class="rp-board"><canvas id="replay-canvas"></canvas></div>

  <div class="rp-ctrl">
    <div class="rp-range">
      <div class="rp-track">
        <input id="rp-slider" type="range" min="0" max="0" value="0" step="1" data-i18n-aria="replay.timeline" aria-label="Dòng thời gian ván" />
        <div id="rp-ticks" class="rp-ticks" aria-hidden="true"></div>
      </div>
      <span id="move-counter" class="rp-counter">0 / 0</span>
    </div>
    <div class="rp-dock" role="group" data-i18n-aria="replay.transport" aria-label="Điều khiển phát lại">
      <button id="btn-first" class="rp-ib" type="button" data-i18n-aria="replay.first" aria-label="Nước đầu (Home)"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-skip-back"></use></svg></button>
      <button id="btn-prev" class="rp-ib" type="button" data-i18n-aria="replay.prev" aria-label="Lùi 1 nước (←)"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-caret-left"></use></svg></button>
      <button id="btn-play" class="rp-ib rp-ib--play" type="button" aria-label="Tự động phát (Space)"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-play"></use></svg></button>
      <button id="btn-next" class="rp-ib" type="button" data-i18n-aria="replay.next" aria-label="Tiến 1 nước (→)"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-caret-right"></use></svg></button>
      <button id="btn-last" class="rp-ib" type="button" data-i18n-aria="replay.last" aria-label="Nước cuối (End)"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-skip-forward"></use></svg></button>
    </div>
  </div>

  <div id="rp-strip" class="rp-strip" role="group" data-i18n-aria="replay.moves" aria-label="Nước đi"></div>

  <div class="rp-info">
    <p id="replay-result" class="rp-result"></p>
    <div id="replay-meta" class="rp-meta"></div>
  </div>

  <div class="rp-opts">
    <div id="rp-speed" class="pseg rp-speed" role="group" data-i18n-aria="replay.speed" aria-label="Tốc độ phát">
      <button type="button" class="pseg__opt" data-speed="1200" aria-pressed="false">0.5×</button>
      <button type="button" class="pseg__opt is-active" data-speed="600" aria-pressed="true">1×</button>
      <button type="button" class="pseg__opt" data-speed="300" aria-pressed="false">2×</button>
    </div>
    <button id="rp-share" type="button" class="rp-tbtn" data-i18n-title="replay.share_title" title="Sao chép liên kết tới nước đang xem">
      <svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-link"></use></svg>
      <span data-i18n="replay.share">Chia sẻ</span>
    </button>
  </div>

  <div class="rp-listhead">
    <h2 class="rp-h" data-i18n="replay.moves">Nước đi</h2>
    <button id="btn-analysis" type="button" class="rp-switch" role="switch" aria-checked="false" data-i18n-title="replay.analysis_title" title="Phân tích: bấm lên bàn để thử nước (A)">
      <span class="rp-switch__track" aria-hidden="true"><span class="rp-switch__thumb"></span></span>
      <span data-i18n="replay.analysis">Phân tích</span>
    </button>
  </div>

  <div id="rp-moves" class="rp-moves" role="group" data-i18n-aria="replay.moves_list" aria-label="Danh sách nước đi"></div>

  <div class="rp-foot">
    <button id="btn-delete-branch" type="button" class="rp-tbtn rp-tbtn--danger" data-i18n-title="replay.delete_branch_title" title="Xoá nhánh đang xem (Delete)" disabled>
      <svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-trash"></use></svg>
      <span data-i18n="replay.delete_branch">Xoá nhánh</span>
    </button>
    <div id="replay-report" class="rp-report" hidden>
      <button type="button" id="rr-open" class="rp-tbtn rp-tbtn--quiet">
        <svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-flag"></use></svg>
        <span data-i18n="replay.report_open">Báo gian lận</span>
      </button>
      <form id="rr-form" class="pform" hidden>
        <label for="rr-side" data-i18n="replay.report_who">Người chơi bị báo cáo</label>
        <select id="rr-side"><option id="rr-black" value="BLACK"></option><option id="rr-white" value="WHITE"></option></select>
        <label for="rr-reason" data-i18n="replay.report_reason">Lý do</label>
        <input id="rr-reason" type="text" maxlength="200" required />
        <p id="rr-msg" class="pnote" role="status" hidden></p>
        <div class="pactions"><button type="submit" id="rr-submit" class="pbtn pbtn--primary pbtn--sm" data-i18n="replay.report_send">Gửi báo cáo</button></div>
      </form>
    </div>
  </div>

  <p id="rp-error" class="pnote rp-error" role="alert" hidden></p>
</main>
<p id="rp-toast" class="rp-toast" role="status" aria-live="polite" hidden></p>

<!-- Scripts -->
<script src="js/i18n.js?v=268d5e8a"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=4f7ecd46"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/platform-shell.js?v=ee86dad9"></script>
<script src="js/board.js?v=91667397"></script>
<script src="js/move-tree.js?v=494ba165"></script>
<script src="js/replay-core.js?v=9a09d8cb"></script>
<script src="js/replay.js?v=5a17916a"></script>
<script src="js/replay-report.js?v=9224829f"></script>
</body>
</html>
