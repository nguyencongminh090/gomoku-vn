<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Xem lại ván</title>
  <meta name="description" content="Xem lại và phát lại một ván Caro trên Play3CR." id="meta-description" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=246" />
  <link rel="stylesheet" href="css/tokens.css?v=246" />
  <link rel="stylesheet" href="css/history.css?v=246" />
  <link rel="stylesheet" href="css/shell.css?v=246" />
  <link rel="stylesheet" href="css/platform-shell.css?v=246" />
  <link rel="stylesheet" href="css/settings-panel.css?v=246" />
  <!-- Manrope (self-hosted, TODO.md #69) -->
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=246">

  <script src="js/ui-mode-preload.js?v=246"></script>

  <script src="js/skin-preload.js?v=246"></script>
  <!-- Phosphor Icons -->

</head>
<body>

<!-- ── Top Nav: Arena shell, built by js/platform-shell.js (B193) ───────── -->
<div id="pl-shell"></div>

<!-- ── Main Content ────────────────────────────────────────────────────── -->
<main class="history" role="main">

  <!-- Replay View (hidden by default) -->
  <div id="view-replay" class="replay" style="display:none;">
    <div class="replay__top-bar">
      <button id="replay-back" class="replay__back-btn" type="button">
        <svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-arrow-left"></use></svg>
        <span data-i18n="history.btn_back">Quay lại</span>
      </button>
      <button id="btn-analysis" class="replay__analysis-btn" type="button" data-i18n-title="history.btn_analysis_title" title="Bật/tắt chế độ phân tích">
        <svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-flow-arrow"></use></svg>
        <span data-i18n="history.btn_analysis">Phân tích</span>
      </button>
    </div>

    <div class="replay__info">
      <div class="replay__players">
        <span id="replay-black" class="replay__player replay__player--black"></span>
        <span class="replay__vs">vs</span>
        <span id="replay-white" class="replay__player replay__player--white"></span>
      </div>
      <div id="replay-result" class="replay__result"></div>
      <div id="replay-meta" class="replay__meta"></div>
      <div id="replay-report" class="replay__report" hidden>
        <button type="button" id="rr-open" class="pbtn pbtn--ghost pbtn--sm" data-i18n="replay.report_open">Báo gian lận</button>
        <form id="rr-form" class="pform" hidden>
          <label for="rr-side" data-i18n="replay.report_who">Người chơi bị báo cáo</label>
          <select id="rr-side"><option id="rr-black" value="BLACK"></option><option id="rr-white" value="WHITE"></option></select>
          <label for="rr-reason" data-i18n="replay.report_reason">Lý do</label>
          <input id="rr-reason" type="text" maxlength="200" required />
          <p id="rr-msg" class="pnote" role="status" hidden></p>
          <div class="pactions"><button type="submit" id="rr-submit" class="pbtn pbtn--primary pbtn--sm" data-i18n="replay.report_send">Gửi báo cáo</button></div>
        </form>
      </div>
    </div>

    <div class="replay__body">
      <!-- Board column -->
      <div class="replay__board-col">
        <div class="replay__board-area">
          <canvas id="replay-canvas"></canvas>
        </div>
        <div class="replay__controls">
          <button id="btn-first" class="replay__btn" type="button" data-i18n-title="history.btn_first_title" title="Đầu tiên"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-skip-back"></use></svg></button>
          <button id="btn-prev" class="replay__btn" type="button" data-i18n-title="history.btn_prev_title" title="Lùi 1 nước"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-caret-left"></use></svg></button>
          <span id="move-counter" class="replay__counter">0 / 0</span>
          <button id="btn-next" class="replay__btn" type="button" data-i18n-title="history.btn_next_title" title="Tiến 1 nước"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-caret-right"></use></svg></button>
          <button id="btn-last" class="replay__btn" type="button" data-i18n-title="history.btn_last_title" title="Cuối cùng"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-skip-forward"></use></svg></button>
          <button id="btn-play" class="replay__btn" type="button" data-i18n-title="history.btn_play_title" title="Tự động phát"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-play"></use></svg></button>
        </div>
      </div>

      <!-- Tree panel (visible in analysis mode) -->
      <div id="tree-panel" class="replay__tree-panel" style="display:none;">
        <div class="tree-panel__header">
          <span class="tree-panel__title" data-i18n="history.tree_title">Cây nước đi</span>
          <button id="btn-delete-branch" class="tree-panel__action" type="button" data-i18n-title="history.btn_delete_branch_title" title="Xoá nhánh hiện tại"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=246#ph-bold-trash"></use></svg></button>
        </div>
        <div id="tree-container" class="tree-panel__body"></div>
      </div>
    </div>
  </div>

</main>

<!-- Scripts -->
<script src="js/i18n.js?v=246"></script>
<script src="js/ui-mode.js?v=246"></script>
<script src="js/audio-manager.js?v=246"></script>
<script src="js/settings-panel.js?v=246"></script>
<script src="js/session.js?v=246"></script>
<script src="js/platform-shell.js?v=246"></script>
<script src="js/board.js?v=246"></script>
<script src="js/move-tree.js?v=246"></script>
<script src="js/escape-utils.js?v=246"></script>
<script src="js/tree-view.js?v=246"></script>
<script src="js/replay.js?v=246"></script>
<script src="js/replay-report.js?v=246"></script>
</body>
</html>
