<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Hội nhóm</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=8aabd3f8" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=174b5103" />
  <link rel="stylesheet" href="css/platform.css?v=a7da945b" />
  <link rel="stylesheet" href="css/club.css?v=d1cecbdf" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="pl cl-body">
<div id="pl-shell"></div>

<main class="cl-hq cl-hq--dir" id="cl-app" role="main">
  <nav class="cl-rail" id="cb-rail" aria-label="Nhóm của tôi" data-i18n-aria="clubs.rail"></nav>
  <section class="cl-mid">
    <div class="cl-dir"><div class="cl-dir__in">
      <h1 class="cl-dir__title" data-i18n="clubs.dir_title">Tìm một hội quán</h1>
      <p class="cl-lead" data-i18n="clubs.dir_lead">Nhóm đông nhất trước, rồi tất cả các nhóm.</p>

      <section class="ppanel" id="cl-create-panel" hidden>
        <h2 class="ph2" data-i18n="clubs.create">Tạo nhóm</h2>
        <form id="cl-form" class="pform">
          <label for="cl-name" data-i18n="clubs.name">Tên nhóm</label>
          <input id="cl-name" maxlength="30" required />
          <label for="cl-desc" data-i18n="clubs.desc">Mô tả</label>
          <textarea id="cl-desc" maxlength="280" rows="2" placeholder="Tối đa 280 ký tự" data-i18n-placeholder="common.max_280"></textarea>
          <label for="cl-policy" data-i18n="clubs.policy">Chính sách tham gia</label>
          <select id="cl-policy">
            <option value="open" data-i18n="clubs.policy_open">Công khai — ai cũng vào được</option>
            <option value="invite" data-i18n="clubs.policy_invite">Theo lời mời — cần duyệt</option>
          </select>
          <div class="pform__row">
            <button type="submit" class="pbtn pbtn--primary" data-i18n="clubs.create_btn">Tạo nhóm</button>
            <span id="cl-form-msg" class="pnote pnote--error" role="alert"></span>
          </div>
        </form>
      </section>

      <label class="psearch"><svg class="icon psearch__icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d5b63760#ph-regular-magnifying-glass"></use></svg>
        <input type="search" id="cl-q" maxlength="30" data-i18n-placeholder="clubs.search_ph" placeholder="Tìm nhóm" aria-label="Tìm nhóm" data-i18n-aria="clubs.search_ph" /></label>
      <div class="cl-dir__bar">
        <div class="cl-chips" id="cl-tabs" role="tablist" aria-label="Lọc nhóm" data-i18n-aria="clubs.chip_filter"></div>
        <button type="button" class="pbtn" id="cl-create-toggle" aria-expanded="false" hidden><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d5b63760#ph-regular-plus-circle"></use></svg><span data-i18n="clubs.create_open">Tạo nhóm</span></button>
      </div>
      <p id="cl-status" class="pnote" role="status"></p>
      <div class="cl-feat" id="cl-feat" role="list" aria-label="Nhóm nổi bật" data-i18n-aria="clubs.featured" hidden></div>
      <div id="cl-list" class="cl-list"></div>
      <div id="cl-mine" class="cl-list" hidden></div>
      <div id="cl-pager" class="ppager"></div>
    </div></div>
  </section>
</main>

<script src="js/i18n.js?v=52e2e1bc"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=c8c81c60"></script>
<script src="js/platform-shell.js?v=71e3d3cb"></script>
<script src="js/club-kit.js?v=4cccc3ae"></script>
<script src="js/clubs.js?v=679992ed"></script>
</body>
</html>
