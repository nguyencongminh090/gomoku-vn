<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Câu lạc bộ</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=228" />
  <link rel="stylesheet" href="css/tokens.css?v=228" />
  <link rel="stylesheet" href="css/platform-shell.css?v=228" />
  <link rel="stylesheet" href="css/platform.css?v=228" />
  <link rel="stylesheet" href="css/settings-panel.css?v=228" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=228">

  <script src="js/ui-mode-preload.js?v=228"></script>
  <script src="js/skin-preload.js?v=228"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <div class="pintro"><h1 data-i18n="clubs.h1">Câu lạc bộ</h1></div>

  <div class="pbar">
    <div class="ptabs" id="cl-tabs" role="tablist"></div>
    <div class="pactions" style="margin:0">
      <label class="psearch"><span class="muted small" aria-hidden="true">⌕</span>
        <input type="search" id="cl-q" maxlength="30" data-i18n-placeholder="clubs.search_ph" placeholder="Tìm CLB" aria-label="Tìm CLB" /></label>
      <button type="button" class="pbtn pbtn--primary" id="cl-create-toggle" data-i18n="clubs.create_open" hidden>Tạo CLB</button>
    </div>
  </div>
  <p id="cl-status" class="pnote" role="status"></p>

  <section class="ppanel" id="cl-create-panel" hidden style="margin-bottom:20px">
    <h2 class="ph2" data-i18n="clubs.create">Tạo CLB</h2>
    <form id="cl-form" class="pform">
      <label for="cl-name" data-i18n="clubs.name">Tên CLB</label>
      <input id="cl-name" maxlength="30" required />
      <label for="cl-desc" data-i18n="clubs.desc">Mô tả (tối đa 280 ký tự)</label>
      <textarea id="cl-desc" maxlength="280" rows="2"></textarea>
      <label for="cl-policy" data-i18n="clubs.policy">Chính sách tham gia</label>
      <select id="cl-policy">
        <option value="open" data-i18n="clubs.policy_open">Công khai — ai cũng vào được</option>
        <option value="invite" data-i18n="clubs.policy_invite">Theo lời mời — cần duyệt</option>
      </select>
      <div class="pform__row">
        <button type="submit" class="pbtn pbtn--primary" data-i18n="clubs.create_btn">Tạo CLB</button>
        <span id="cl-form-msg" class="pnote" role="status"></span>
      </div>
    </form>
  </section>

  <section class="ppanel">
    <div id="cl-list" class="prows"></div>
    <div id="cl-mine" class="prows" hidden></div>
    <div id="cl-pager" class="ppager"></div>
  </section>
</main>

<script src="js/i18n.js?v=228"></script>
<script src="js/ui-mode.js?v=228"></script>
<script src="js/session.js?v=228"></script>
<script src="js/audio-manager.js?v=228"></script>
<script src="js/settings-panel.js?v=228"></script>
<script src="js/platform-shell.js?v=228"></script>
<script src="js/clubs.js?v=228"></script>
</body>
</html>
