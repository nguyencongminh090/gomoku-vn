<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <base href="/" />

<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <div class="pintro"><h1 data-i18n="clubs.h1">Hội nhóm</h1></div>

  <div class="pbar">
    <div class="ptabs" id="cl-tabs" role="tablist"></div>
    <div class="pactions" style="margin:0">
      <label class="psearch"><svg class="icon psearch__icon" width="16" height="16" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-magnifying-glass"></use></svg>
        <input type="search" id="cl-q" maxlength="30" data-i18n-placeholder="clubs.search_ph" placeholder="Tìm nhÃ³m" aria-label="Tìm nhÃ³m" /></label>
      <button type="button" class="pbtn pbtn--primary" id="cl-create-toggle" hidden><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-plus-circle"></use></svg><span data-i18n="clubs.create_open">Tạo nhÃ³m</span></button>
    </div>
  </div>
  <p id="cl-status" class="pnote" role="status"></p>

  <section class="ppanel" id="cl-create-panel" hidden style="margin-bottom:20px">
    <h2 class="ph2" data-i18n="clubs.create">Tạo nhÃ³m</h2>
    <form id="cl-form" class="pform">
      <label for="cl-name" data-i18n="clubs.name">Tên nhÃ³m</label>
      <input id="cl-name" maxlength="30" required />
      <label for="cl-desc" data-i18n="clubs.desc">Mô tả</label>
      <textarea id="cl-desc" maxlength="280" rows="2" placeholder="Tối đa 280 ký tự" data-i18n-placeholder="common.max_280"></textarea>
      <label for="cl-policy" data-i18n="clubs.policy">Chính sách tham gia</label>
      <select id="cl-policy">
        <option value="open" data-i18n="clubs.policy_open">Công khai — ai cũng vào được</option>
        <option value="invite" data-i18n="clubs.policy_invite">Theo lời mời — cần duyệt</option>
      </select>
      <div class="pform__row">
        <button type="submit" class="pbtn pbtn--primary" data-i18n="clubs.create_btn">Tạo nhÃ³m</button>
        <span id="cl-form-msg" class="pnote pnote--error" role="alert"></span>
      </div>
    </form>
  </section>

  <section class="ppanel">
    <div id="cl-list" class="prows prows--tickets"></div>
    <div id="cl-mine" class="prows prows--tickets" hidden></div>
    <div id="cl-pager" class="ppager"></div>
  </section>
</main>

<script src="js/i18n.js?v=29da0521"></script>

<script src="js/platform-shell.js?v=fa29a6d7"></script>
<script src="js/clubs.js?v=0526039e"></script>
</body>
</html>
