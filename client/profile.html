<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Served at /u/<username>: root-relative base so css/js/assets resolve from any depth. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Hồ sơ</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=181" />
  <link rel="stylesheet" href="css/tokens.css?v=181" />
  <link rel="stylesheet" href="css/profile.css?v=181" />
  <link rel="stylesheet" href="css/shell.css?v=181" />
  <link rel="stylesheet" href="css/settings-panel.css?v=181" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=181">

  <script src="js/ui-mode-preload.js?v=181"></script>
  <script src="js/skin-preload.js?v=181"></script>
</head>
<body>

<nav class="topnav" aria-label="Main navigation">
  <a href="index.html" class="topnav__brand" aria-label="Play3CR">
    <img src="assets/brand/logo-mark.svg" alt="" width="28" height="28" class="topnav__logo" />
    <span class="topnav__title">Play3CR</span>
  </a>
  <div class="topnav__right">
    <a href="rankings.html" class="topnav__btn" style="text-decoration:none;" data-i18n-title="lobby.rankings" title="Xếp hạng">
      <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=181#ph-bold-trophy"></use></svg>
      <span class="hide-on-mobile" data-i18n="lobby.rankings">Xếp hạng</span>
    </a>
    <a href="index.html" class="topnav__btn" style="text-decoration:none;" data-i18n-title="nav.lobby" title="Sảnh">
      <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=181#ph-bold-house"></use></svg>
      <span class="hide-on-mobile" data-i18n="nav.lobby">Sảnh</span>
    </a>
  </div>
</nav>

<main class="profile" role="main">
  <p id="pf-status" class="profile__note" role="status"></p>

  <div id="pf-content" hidden>
    <header class="profile__head">
      <div class="profile__avatar" id="pf-avatar" aria-hidden="true"></div>
      <div class="profile__who">
        <h1 id="pf-name"></h1>
        <p class="profile__note" id="pf-joined"></p>
        <p class="profile__bio" id="pf-bio"></p>
      </div>
      <dl class="profile__stats" id="pf-stats"></dl>
    </header>

    <section id="pf-edit" class="profile__panel" hidden>
      <h2 data-i18n="profile.edit">Chỉnh sửa hồ sơ</h2>
      <div class="profile__avatar-actions">
        <label class="profile__btn" for="pf-file" data-i18n="profile.avatar_upload">Đổi ảnh đại diện</label>
        <input type="file" id="pf-file" accept="image/jpeg,image/png,image/webp" hidden />
        <button type="button" class="profile__btn" id="pf-avatar-remove" data-i18n="profile.avatar_remove">Xoá ảnh</button>
      </div>
      <p class="profile__note" data-i18n="profile.avatar_hint">JPEG, PNG hoặc WebP, tối đa 2 MB. Ảnh được thu nhỏ còn 256×256.</p>
      <form id="pf-form">
        <label for="pf-bio-input" data-i18n="profile.bio_label">Giới thiệu (tối đa 280 ký tự)</label>
        <textarea id="pf-bio-input" maxlength="280" rows="3"></textarea>
        <label class="profile__check"><input type="checkbox" id="pf-hide-history" /> <span data-i18n="profile.hide_history">Ẩn lịch sử ván đấu với người khác</span></label>
        <label class="profile__check"><input type="checkbox" id="pf-hide-bio" /> <span data-i18n="profile.hide_bio">Ẩn giới thiệu với người khác</span></label>
        <button type="submit" class="profile__btn profile__btn--primary" data-i18n="profile.save">Lưu</button>
        <span id="pf-saved" class="profile__note" role="status"></span>
      </form>
    </section>

    <section class="profile__panel">
      <h2 data-i18n="profile.ratings">Rating theo thể loại</h2>
      <div id="pf-ratings" class="profile__cards"></div>
    </section>

    <section class="profile__panel" id="pf-clubs-panel" hidden>
      <h2 data-i18n="profile.clubs">Câu lạc bộ</h2>
      <ul id="pf-clubs" class="profile__list"></ul>
    </section>

    <section class="profile__panel">
      <h2 data-i18n="profile.recent">Ván gần đây</h2>
      <p id="pf-recent-note" class="profile__note" hidden></p>
      <ul id="pf-recent" class="profile__list"></ul>
    </section>
  </div>
</main>

<script src="js/i18n.js?v=181"></script>
<script src="js/ui-mode.js?v=181"></script>
<script src="js/audio-manager.js?v=181"></script>
<script src="js/settings-panel.js?v=181"></script>
<script src="js/profile.js?v=181"></script>
</body>
</html>
