<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Hồ sơ</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=8aabd3f8" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=ba363fa2" />
  <link rel="stylesheet" href="css/platform.css?v=ae47d7cf" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp pprofile" role="main">
  <p id="pf-status" class="pnote" role="status"></p>

  <!-- #403 PF7 "Sơ yếu kỳ thủ": one CV sheet. Grid areas side | main / org | main; phone stacks side, main, org. -->
  <article id="pf-content" class="pf-cv" hidden>
    <aside class="pf-side">
      <div class="pf-id">
        <span id="pf-avatar"></span>
        <div class="pf-id__txt">
          <p class="pf-id__name" id="pf-side-name"></p>
          <p class="pf-tag" id="pf-tag" hidden></p>
        </div>
      </div>
      <section>
        <h3 class="pf-h3" data-i18n="profile.contact">Liên hệ</h3>
        <div class="pf-contact" id="pf-joined"></div>
      </section>
      <section>
        <h3 class="pf-h3" data-i18n="profile.rating_h">Rating</h3>
        <div id="pf-ratings" class="pf-skills" role="group"></div>
      </section>
    </aside>

    <div class="pf-main">
      <header class="pf-top">
        <div class="pf-top__nm">
          <h1 id="pf-name"></h1>
          <dl class="pf-facts" id="pf-facts" hidden></dl>
        </div>
        <div class="pf-acts">
          <div class="pactions" id="pf-social" hidden></div>
          <div class="pactions" id="pf-actions" hidden>
            <a class="pbtn" id="pf-edit-btn" href="/settings.html"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-pencil-simple"></use></svg><span data-i18n="profile.edit_btn">Chỉnh sửa</span></a>
            <button type="button" class="pbtn" id="pf-copy"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-copy"></use></svg><span data-i18n="profile.copy_link">Sao chép liên kết</span></button>
            <span class="pnote" id="pf-copy-note" role="status"></span>
          </div>
        </div>
      </header>

      <section class="pf-sec">
        <h2 class="pf-h2" data-i18n="profile.bio_label">Giới thiệu</h2>
        <p class="pf-sum" id="pf-bio"></p>
      </section>

      <section class="pf-sec">
        <h2 class="pf-h2" data-i18n="profile.stats_h">Số liệu</h2>
        <p id="pf-stats-note" class="pnote" hidden></p>
        <dl class="pf-nums" id="pf-stats"></dl>
        <div class="pf-wdl" id="pf-wdl" role="img" hidden></div>
      </section>

      <section class="pf-sec">
        <h2 class="pf-h2" id="pf-chart-title" data-i18n="profile.chart_title">Biểu đồ rating</h2>
        <div id="pf-chart-tabs" class="pchips" role="tablist"></div>
        <svg id="pf-chart" class="pchart" viewBox="0 0 400 120" preserveAspectRatio="none" role="img" hidden></svg>
        <p id="pf-chart-note" class="pnote"></p>
      </section>

      <section class="pf-sec" id="pf-badges-sec" hidden>
        <h2 class="pf-h2" data-i18n="profile.awards">Thành tích</h2>
        <div id="pf-badges" class="pf-aw"></div>
      </section>

      <section class="pf-sec" id="pf-games">
        <h2 class="pf-h2" data-i18n="profile.recent_h">Ván gần đây</h2>
        <p id="pf-recent-note" class="pnote" hidden></p>
        <table class="pf-tbl" id="pf-recent-tbl">
          <thead><tr><th data-i18n="profile.col_date">Ngày</th><th data-i18n="profile.col_opp">Đối thủ</th><th data-i18n="profile.col_result">Kết quả</th></tr></thead>
          <tbody id="pf-recent"></tbody>
        </table>
        <div class="pf-foot">
          <button type="button" class="pbtn" id="pf-more" hidden><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=d9575ee8#ph-regular-caret-down"></use></svg><span id="pf-more-label" data-i18n="profile.load_more">Xem thêm</span></button>
          <span class="pf-ref" id="pf-ref" data-i18n="profile.replay_hint" hidden>Bấm vào ván để xem lại.</span>
        </div>
      </section>
    </div>

    <aside class="pf-org" id="pf-org" hidden>
      <section id="pf-puzzles" hidden>
        <h3 class="pf-h3" data-i18n="profile.puzzles_h">Giải đố</h3>
        <div id="pf-puzzle-box"></div>
      </section>
      <section id="pf-clubs-panel" hidden>
        <h3 class="pf-h3" data-i18n="profile.clubs">Hội nhóm</h3>
        <div id="pf-clubs" class="pf-clubs"></div>
      </section>
    </aside>
  </article>
</main>

<script src="js/i18n.js?v=ec94f227"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=349e6629"></script>
<script src="js/platform-shell.js?v=f1ed8844"></script>
<script src="js/countries.js?v=60e0b5b7"></script>
<script src="js/challenge-modal.js?v=77805a23"></script>
<script src="js/profile.js?v=7d908c21"></script>
</body>
</html>
