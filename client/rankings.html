<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Bảng xếp hạng</title>
  <meta name="description" content="Bảng xếp hạng Glicko-2 theo thể loại trên Play3CR." id="meta-description" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=178" />
  <link rel="stylesheet" href="css/tokens.css?v=178" />
  <link rel="stylesheet" href="css/rankings.css?v=178" />
  <link rel="stylesheet" href="css/shell.css?v=178" />
  <link rel="stylesheet" href="css/settings-panel.css?v=178" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=178">

  <script src="js/ui-mode-preload.js?v=178"></script>
  <script src="js/skin-preload.js?v=178"></script>
</head>
<body>

<nav class="topnav" aria-label="Main navigation">
  <a href="index.html" class="topnav__brand" aria-label="Play3CR">
    <img src="assets/brand/logo-mark.svg" alt="" width="28" height="28" class="topnav__logo" />
    <span class="topnav__title">Play3CR</span>
  </a>
  <div class="topnav__right">
    <a href="index.html" class="topnav__btn" style="text-decoration:none;" data-i18n-title="nav.lobby" title="Sảnh">
      <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=178#ph-bold-house"></use></svg>
      <span class="hide-on-mobile" data-i18n="nav.lobby">Sảnh</span>
    </a>
  </div>
</nav>

<main class="rankings" role="main">
  <div class="rankings__header">
    <h1 data-i18n="rankings.h1">Bảng xếp hạng</h1>
    <span id="rk-total" class="rankings__count"></span>
  </div>

  <div id="rk-tabs" class="rankings__tabs" role="tablist" aria-label="Thể loại"></div>

  <div class="rankings__tblwrap">
    <table class="rankings__tbl" aria-live="polite">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col" data-i18n="rankings.col_player">Người chơi</th>
          <th scope="col" class="num" data-i18n="rankings.col_rating">Rating</th>
          <th scope="col" class="num" data-i18n="rankings.col_games">Ván</th>
        </tr>
      </thead>
      <tbody id="rk-body"></tbody>
    </table>
  </div>
  <p id="rk-empty" class="rankings__note" hidden></p>
  <p id="rk-mine" class="rankings__note"></p>
  <p class="rankings__note" id="rk-footnote"></p>

  <div id="rk-pager" class="rankings__pager"></div>
</main>

<script src="js/i18n.js?v=178"></script>
<script src="js/ui-mode.js?v=178"></script>
<script src="js/audio-manager.js?v=178"></script>
<script src="js/settings-panel.js?v=178"></script>
<script src="js/rankings.js?v=178"></script>
</body>
</html>
