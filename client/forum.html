<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Diễn đàn</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=247" />
  <link rel="stylesheet" href="css/tokens.css?v=247" />
  <link rel="stylesheet" href="css/platform-shell.css?v=247" />
  <link rel="stylesheet" href="css/platform.css?v=247" />
  <link rel="stylesheet" href="css/puzzles.css?v=247" />
  <link rel="stylesheet" href="css/forum.css?v=247" />
  <link rel="stylesheet" href="css/settings-panel.css?v=247" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=247">

  <script src="js/ui-mode-preload.js?v=247"></script>
  <script src="js/skin-preload.js?v=247"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <nav class="ptabs fm-tabs" aria-label="Learn"><a class="ptab" href="/puzzles" data-i18n="forum.tab_puzzles">Puzzle</a><a class="ptab" href="/forum" aria-current="page" data-i18n="forum.tab_forum">Diễn đàn</a></nav>
  <div class="pintro"><h1 data-i18n="forum.h1">Diễn đàn</h1><p id="fm-total" class="muted small"></p></div>
  <div id="fm-cats" class="pchips" role="group" data-i18n-aria="forum.categories" aria-label="Danh mục"></div>

  <div class="pactions" style="margin:0 0 16px">
    <button type="button" id="fm-new-btn" class="pbtn pbtn--primary" data-i18n="forum.new" hidden>Chủ đề mới</button>
    <a id="fm-reports" class="pbtn pbtn--ghost" href="/admin#forum" hidden></a>
  </div>
  <p id="fm-login" class="pnote" hidden></p>

  <form id="fm-new" class="pform ppanel fm-form" autocomplete="off" hidden>
    <label for="fm-new-cat" data-i18n="forum.f_category">Danh mục</label>
    <select id="fm-new-cat"></select>
    <label for="fm-new-title" data-i18n="forum.f_title">Tiêu đề</label>
    <input id="fm-new-title" maxlength="100" required />
    <label for="fm-new-body" data-i18n="forum.f_body">Nội dung</label>
    <textarea id="fm-new-body" rows="6" maxlength="4000" required></textarea>
    <p id="fm-new-result" class="pz-result" role="status" hidden></p>
    <div class="pactions"><button type="submit" id="fm-new-submit" class="pbtn pbtn--primary" data-i18n="forum.post">Đăng</button></div>
  </form>

  <div id="fm-list" class="prows" aria-live="polite"></div>
  <p id="fm-empty" class="pnote" hidden></p>
  <div id="fm-pager" class="ppager"></div>
</main>

<script src="js/i18n.js?v=247"></script>
<script src="js/ui-mode.js?v=247"></script>
<script src="js/session.js?v=247"></script>
<script src="js/audio-manager.js?v=247"></script>
<script src="js/settings-panel.js?v=247"></script>
<script src="js/platform-shell.js?v=247"></script>
<script src="js/forum-common.js?v=247"></script>
<script src="js/forum.js?v=247"></script>
</body>
</html>
