<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Bạn bè</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=8aabd3f8" />
  <link rel="stylesheet" href="css/tokens.css?v=db200088" />
  <link rel="stylesheet" href="css/platform-shell.css?v=10e0e4bb" />
  <link rel="stylesheet" href="css/platform.css?v=a2a363cd" />
  <link rel="stylesheet" href="css/settings-panel.css?v=a2e285a4" />
  <link rel="stylesheet" href="css/social.css?v=efc6c295" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=b452e3a9"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp sc" role="main">
  <h1 class="sc-sr" data-i18n="social.chat_title">Trò chuyện</h1>
  <div class="sc-app" id="sc-app">
    <section class="sc-pane sc-side" aria-labelledby="sc-title">
      <div class="sc-top">
        <div class="sc-top__row">
          <h2 id="sc-title" class="sc-title" data-i18n="social.chat_title">Trò chuyện</h2>
          <button id="sc-challenge-new" class="sc-ibtn" type="button" data-i18n-aria="challenge.pick_title" aria-label="Thách đấu bạn bè"></button>
        </div>
        <form id="sc-add" class="sc-search" role="search" autocomplete="off">
          <input id="sc-add-q" type="search" maxlength="40" aria-label="Thêm bạn" data-i18n-placeholder="social.search_ph" placeholder="Tìm bạn, hoặc tên#1234" />
        </form>
        <p id="sc-status" class="sc-status" role="status"></p>
        <div id="sc-add-results" class="sc-results" aria-live="polite"></div>
      </div>
      <div id="sc-story" class="sc-story" data-i18n-aria="social.friends" aria-label="Bạn bè"></div>
      <div class="sc-list" id="sc-list">
        <div id="sc-challenges" class="sc-group"></div>
        <div id="sc-incoming" class="sc-group"></div>
        <div id="dm-list" class="sc-group"></div>
        <div id="sc-suggest" class="sc-group" hidden></div>
        <div class="sc-out" id="sc-out-box" hidden>
          <h3 class="sc-h3" data-i18n="social.outgoing">Đã gửi lời mời</h3>
          <div id="sc-outgoing" class="sc-group"></div>
        </div>
        <div class="sc-code"><span data-i18n="social.my_code">Mã của bạn</span> <code id="sc-code">…</code> <button id="sc-code-copy" class="pbtn pbtn--sm pbtn--ghost" type="button" data-i18n="social.copy">Sao chép</button></div>
      </div>
    </section>

    <section class="sc-pane sc-main" id="sc-dm">
      <div class="sc-th" id="dm-thread" hidden>
        <header class="sc-th__head">
          <button id="dm-back" class="sc-ibtn sc-back" type="button" data-i18n-aria="social.back" aria-label="Quay lại"></button>
          <span id="dm-av" class="sc-av"></span>
          <div class="sc-nmbox">
            <a id="dm-with" class="sc-nm sc-th__name"></a>
            <small id="dm-st" class="sc-st"></small>
          </div>
          <a id="dm-watch" class="pbtn pbtn--sm pbtn--ghost sc-th__watch" hidden></a>
          <button id="dm-challenge" class="pbtn pbtn--sm pbtn--primary sc-th__ch" type="button"></button>
        </header>
        <div id="dm-log" class="sc-log" role="log" aria-live="polite"></div>
        <div id="dm-pending" class="sc-pending"></div>
        <p id="dm-note" class="sc-note" role="status"></p>
        <form id="dm-form" class="sc-form">
          <input id="dm-input" type="text" maxlength="500" autocomplete="off" data-i18n-placeholder="private_chat.ph_input" placeholder="Nhập tin nhắn…" />
          <button id="dm-sword" class="sc-ibtn" type="button" data-i18n-aria="social.challenge_aria" aria-label="Gửi thách đấu"></button>
          <button type="submit" class="pbtn pbtn--primary sc-send"><span data-i18n="private_chat.btn_send">Gửi</span></button>
        </form>
      </div>
      <div class="sc-notifs" id="sc-notifs-view" hidden>
        <header class="sc-th__head">
          <button id="sc-notifs-back" class="sc-ibtn sc-back" type="button" data-i18n-aria="social.back" aria-label="Quay lại"></button>
          <h2 class="sc-th__name" data-i18n="notif.title">Thông báo</h2>
        </header>
        <div id="sc-notifs" class="sc-log prows prows--tickets" aria-live="polite"></div>
      </div>
      <div class="sc-empty" id="dm-empty">
        <span class="sc-empty__stone" aria-hidden="true"></span>
        <b class="sc-empty__t" data-i18n="social.empty_title">Chưa có cuộc trò chuyện</b>
        <p class="sc-empty__p" data-i18n="social.empty_body">Kết bạn ở cột trái, rồi nhắn tin hoặc gửi thách đấu ngay trong chat.</p>
        <p class="sc-empty__p"><span data-i18n="social.my_code">Mã của bạn</span>: <b id="sc-code2">…</b></p>
      </div>
    </section>

    <aside class="sc-pane sc-who" id="sc-who" hidden></aside>
  </div>
</main>

<script src="js/i18n.js?v=3a34a48f"></script>
<script src="js/escape-utils.js?v=05dffe1e"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=f0ca2309"></script>
<script src="js/settings-panel.js?v=014127cb"></script>
<script src="js/platform-shell.js?v=3de577e1"></script>
<script src="js/challenge-modal.js?v=ef75733c"></script>
<script src="js/social.js?v=91a12815"></script>
</body>
</html>
