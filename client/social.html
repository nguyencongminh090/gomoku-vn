<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Bạn bè</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=248" />
  <link rel="stylesheet" href="css/tokens.css?v=248" />
  <link rel="stylesheet" href="css/platform-shell.css?v=248" />
  <link rel="stylesheet" href="css/platform.css?v=248" />
  <link rel="stylesheet" href="css/settings-panel.css?v=248" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=248">

  <script src="js/ui-mode-preload.js?v=248"></script>
  <script src="js/skin-preload.js?v=248"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <div class="pintro">
    <h1 data-i18n="social.title">Bạn bè &amp; tin nhắn</h1>
    <p id="sc-status" class="muted small" role="status"></p>
  </div>

  <div class="psplit">
    <div class="pcol">
      <section class="ppanel">
        <h2 class="ph2" data-i18n="notif.title">Thông báo</h2>
        <div id="sc-notifs" class="prows" aria-live="polite"></div>
      </section>
      <section class="ppanel">
        <h2 class="ph2" data-i18n="social.challenges">Thách đấu</h2>
        <div id="sc-challenges" class="prows"></div>
      </section>
      <section class="ppanel">
        <h2 class="ph2" data-i18n="social.incoming">Lời mời kết bạn</h2>
        <div id="sc-incoming" class="prows"></div>
      </section>
    </div>
    <div class="pcol">
      <section class="ppanel">
        <h2 class="ph2" data-i18n="social.friends">Bạn bè</h2>
        <div id="sc-friends" class="prows"></div>
        <h2 class="ph2 ph2--gap" data-i18n="social.outgoing">Đã gửi lời mời</h2>
        <div id="sc-outgoing" class="prows"></div>
      </section>
      <section class="ppanel pdm" id="sc-dm">
        <h2 class="ph2" data-i18n="social.messages">Tin nhắn</h2>
        <div class="pdm__grid">
          <div id="dm-list" class="prows pdm__list"></div>
          <div class="pdm__thread" id="dm-thread" hidden>
            <div class="pdm__head"><a id="dm-with" class="prow__t"></a></div>
            <div id="dm-log" class="pdm__log" role="log" aria-live="polite"></div>
            <form id="dm-form" class="pdm__form">
              <input id="dm-input" type="text" maxlength="500" autocomplete="off" data-i18n-placeholder="private_chat.ph_input" placeholder="Nhập tin nhắn…" />
              <button type="submit" class="pbtn pbtn--primary" data-i18n="private_chat.btn_send">Gửi</button>
            </form>
            <p id="dm-note" class="pnote" role="status"></p>
          </div>
          <p id="dm-empty" class="pnote" data-i18n="social.dm_pick">Chọn một cuộc trò chuyện hoặc mở hồ sơ bạn bè để nhắn tin.</p>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="js/i18n.js?v=248"></script>
<script src="js/escape-utils.js?v=248"></script>
<script src="js/ui-mode.js?v=248"></script>
<script src="js/session.js?v=248"></script>
<script src="js/audio-manager.js?v=248"></script>
<script src="js/settings-panel.js?v=248"></script>
<script src="js/platform-shell.js?v=248"></script>
<script src="js/social.js?v=248"></script>
</body>
</html>
