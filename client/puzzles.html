<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Puzzle</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=93220240" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/platform-shell.css?v=174b5103" />
  <link rel="stylesheet" href="css/platform.css?v=35725b58" />
  <link rel="stylesheet" href="css/forum.css?v=eae48526" />
  <link rel="stylesheet" href="css/puzzles.css?v=2aaeb6b5" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="pl pz-page">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <nav class="mseg pz-tabs" aria-label="Learn"><a class="mseg__opt" href="/puzzles" aria-current="page" data-i18n="forum.tab_puzzles">Puzzle</a><a class="mseg__opt" href="/forum" data-i18n="forum.tab_forum">Diễn đàn</a></nav>

  <section class="pz-hero pz-panel" aria-labelledby="pz-h1">
    <div>
      <p class="pz-eyebrow" data-i18n="puzzles.eyebrow">Học</p>
      <h1 id="pz-h1" data-i18n="puzzles.path_h1">Lộ trình puzzle</h1>
      <p class="pz-lead" data-i18n="puzzles.path_lead">Giải từ Dễ tới Cao thủ.</p>
      <p id="pz-total" class="pz-help"></p>
    </div>
    <div class="pz-hero__actions">
      <div id="pz-actions" class="pz-row">
        <a class="mtbtn mtbtn--quiet" href="/puzzles/mine" data-i18n="puzzles.mine">Puzzle của tôi</a>
        <a class="mtbtn" href="/puzzles/new"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-plus-circle"></use></svg><span data-i18n="puzzles.new">Đăng puzzle mới</span></a>
      </div>
      <a id="pz-continue" class="mbtn mbtn--primary" href="/puzzles" hidden></a>
    </div>
  </section>

  <div class="pz-filters">
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_level">Level</span><div id="pz-levels" class="mseg" role="group" data-i18n-aria="puzzles.filter_level" aria-label="Level"></div></div>
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_rule">Luật</span><div id="pz-rules" class="mseg" role="group" data-i18n-aria="puzzles.filter_rule" aria-label="Luật"></div></div>
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_tag">Chủ đề</span><div id="pz-tags" class="mseg" role="group" data-i18n-aria="puzzles.filter_tag" aria-label="Chủ đề"></div></div>
  </div>

  <div id="pz-shelves" aria-live="polite"></div>
  <div id="pz-level-head" class="pz-shelf" hidden></div>
  <div id="pz-list" class="pz-grid" aria-live="polite"></div>
  <p id="pz-empty" class="pz-empty" hidden></p>
  <div id="pz-pager" class="ppager"></div>
</main>

<script src="js/i18n.js?v=872c893a"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/settings-panel.js?v=4f7ecd46"></script>
<script src="js/platform-shell.js?v=ee86dad9"></script>
<script src="js/puzzle-board.js?v=8bf7b792"></script>
<script src="js/puzzles.js?v=65ecca86"></script>
</body>
</html>
