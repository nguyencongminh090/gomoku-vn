<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Puzzle</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=225" />
  <link rel="stylesheet" href="css/tokens.css?v=225" />
  <link rel="stylesheet" href="css/platform-shell.css?v=225" />
  <link rel="stylesheet" href="css/platform.css?v=225" />
  <link rel="stylesheet" href="css/forum.css?v=225" />
  <link rel="stylesheet" href="css/puzzles.css?v=225" />
  <link rel="stylesheet" href="css/settings-panel.css?v=225" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=225">

  <script src="js/ui-mode-preload.js?v=225"></script>
  <script src="js/skin-preload.js?v=225"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <nav class="pchips fm-tabs" aria-label="Learn"><a class="pchip" href="/puzzles" aria-current="page" data-i18n="forum.tab_puzzles">Puzzle</a><a class="pchip" href="/forum" data-i18n="forum.tab_forum">Diễn đàn</a></nav>
  <div class="pintro">
    <h1 data-i18n="puzzles.h1">Puzzle</h1>
    <p id="pz-total" class="muted small"></p>
  </div>

  <div class="pactions" style="margin:0 0 16px">
    <a class="pbtn pbtn--primary" href="/puzzles/new" data-i18n="puzzles.new">Đăng puzzle mới</a>
    <a class="pbtn pbtn--ghost" href="/puzzles/mine" data-i18n="puzzles.mine">Puzzle của tôi</a>
  </div>

  <div class="pbar">
    <div id="pz-levels" class="pchips" role="group" data-i18n-aria="puzzles.filter_level" aria-label="Level" style="margin:0"></div>
    <div id="pz-rules" class="pchips" role="group" data-i18n-aria="puzzles.filter_rule" aria-label="Luật" style="margin:0"></div>
  </div>
  <div id="pz-tags" class="pchips" role="group" data-i18n-aria="puzzles.filter_tag" aria-label="Chủ đề"></div>

  <div id="pz-list" class="pz-grid" aria-live="polite"></div>
  <p id="pz-empty" class="pnote" hidden></p>
  <div id="pz-pager" class="ppager"></div>
</main>

<script src="js/i18n.js?v=225"></script>
<script src="js/ui-mode.js?v=225"></script>
<script src="js/session.js?v=225"></script>
<script src="js/audio-manager.js?v=225"></script>
<script src="js/settings-panel.js?v=225"></script>
<script src="js/platform-shell.js?v=225"></script>
<script src="js/puzzles.js?v=225"></script>
</body>
</html>
