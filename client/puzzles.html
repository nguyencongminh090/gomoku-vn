<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Play3CR — Puzzle</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=237afa6e" />
  <link rel="stylesheet" href="css/tokens.css?v=75d051bd" />
  <link rel="stylesheet" href="css/platform-shell.css?v=c86085ef" />
  <link rel="stylesheet" href="css/platform.css?v=6a89d52b" />
  <link rel="stylesheet" href="css/forum.css?v=eae48526" />
  <link rel="stylesheet" href="css/puzzles.css?v=beb79e2c" />
  <link rel="stylesheet" href="css/settings-panel.css?v=33a2079d" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">

  <script src="js/skin-preload.js?v=b452e3a9"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <nav class="ptabs fm-tabs" aria-label="Learn"><a class="ptab" href="/puzzles" aria-current="page" data-i18n="forum.tab_puzzles">Puzzle</a><a class="ptab" href="/forum" data-i18n="forum.tab_forum">Diễn đàn</a></nav>
  <div class="pintro">
    <h1 data-i18n="puzzles.h1">Puzzle</h1>
    <p id="pz-total" class="muted small"></p>
  </div>

  <div id="pz-actions" class="pactions" style="margin:0 0 16px">
    <a class="pbtn pbtn--primary" href="/puzzles/new"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-plus-circle"></use></svg><span data-i18n="puzzles.new">Đăng puzzle mới</span></a>
    <a class="pbtn pbtn--ghost" href="/puzzles/mine" data-i18n="puzzles.mine">Puzzle của tôi</a>
  </div>

  <div class="pz-filters">
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_level">Level</span><div id="pz-levels" class="pchips" role="group" data-i18n-aria="puzzles.filter_level" aria-label="Level"></div></div>
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_rule">Luật</span><div id="pz-rules" class="pchips" role="group" data-i18n-aria="puzzles.filter_rule" aria-label="Luật"></div></div>
    <div class="pz-filter"><span class="pz-filter__label" data-i18n="puzzles.filter_tag">Chủ đề</span><div id="pz-tags" class="pchips" role="group" data-i18n-aria="puzzles.filter_tag" aria-label="Chủ đề"></div></div>
  </div>

  <div id="pz-list" class="pz-grid" aria-live="polite"></div>
  <p id="pz-empty" class="pnote" hidden></p>
  <div id="pz-pager" class="ppager"></div>
</main>

<script src="js/i18n.js?v=c09e482f"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=f0ca2309"></script>
<script src="js/settings-panel.js?v=014127cb"></script>
<script src="js/platform-shell.js?v=86159d16"></script>
<script src="js/puzzle-board.js?v=8bf7b792"></script>
<script src="js/puzzles.js?v=df4d5265"></script>
</body>
</html>
