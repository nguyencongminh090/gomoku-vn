<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Trận đấu giải đấu</title>
  <meta name="description" content="Play3CR — Trận đấu trong giải đấu Caro trực tuyến." />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=93220240" />
  <link rel="stylesheet" href="css/tokens.css?v=bd768e32" />
  <link rel="stylesheet" href="css/lobby.css?v=4fcfbbea" />
  <link rel="stylesheet" href="css/room.css?v=f2b03135" />
  <link rel="stylesheet" href="css/game.css?v=801e852a" />
  <link rel="stylesheet" href="css/tournament.css?v=1a887d48" />
  <link rel="stylesheet" href="css/shell.css?v=7cd3d780" />
  <link rel="stylesheet" href="css/settings-panel.css?v=c3360643" />
  <link rel="stylesheet" href="css/room-arena.css?v=5034d535" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">
  <script src="js/skin-preload.js?v=399486e6"></script>
</head>
<body class="arena-room tmatch-room">

<div id="status-banner" class="status-banner" aria-live="polite"></div>

<!-- Same chrome and grid as room.html ("Arena Focus", room-arena.css): nav ticket, seat cards, tabs, action
     tiles, phone dock + sheet. Page-only differences live in tournament.css under body.tmatch-room. -->
<nav class="topnav rnav" role="navigation">
  <a href="index.html" class="topnav__brand rnav__brand" aria-label="Play3CR">
    <span class="topnav__title">Play<b>3CR</b></span>
  </a>
  <span class="rnav__spacer"></span>
  <div class="rnav__ticket tm-ticket"><div class="tm-meta" id="match-meta"></div></div>
  <span class="rnav__spacer"></span>
  <a href="#" id="back-to-tournament" class="topnav__btn rnav__leave detail-back" data-i18n-title="tmatch.back" data-i18n-aria="tmatch.back" title="Chi tiết giải" aria-label="Chi tiết giải">
    <svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-arrow-left"></use></svg>
    <span class="rnav__leave-text" data-i18n="tmatch.back">Chi tiết giải</span>
  </a>
  <div class="topnav__right"></div>
</nav>

<main class="room" role="main">
  <h1 class="tm-sr" id="match-title">—</h1>

  <section class="board-area-shell" id="board-area-shell">
    <div class="board-area" id="board-area">
      <div class="board-canvas-wrap" id="board-wrap">
        <canvas id="match-canvas"></canvas>
      </div>
    </div>
  </section>

  <aside class="rail" id="rail">
    <div class="seatcard seatcard--top" id="seatcard-top" aria-live="polite"></div>

    <div class="scorecard" id="scorecard" hidden>
      <div class="scorecard__title" id="score-panel-title" data-i18n="tmatch.score_title">Bảng điểm</div>
      <div class="score-hero" id="score-hero"></div>
    </div>

    <div class="rpanel">
      <div class="gtoasts" id="game-toasts" aria-live="assertive">
        <div id="swap2-banner-slot"></div>
        <div id="draw-prompt-area"></div>
        <div id="time-prompt-area"></div>
      </div>

      <div class="rsheet" id="rsheet">
        <button class="rsheet__grab" id="rsheet-grab" type="button" data-i18n-aria="room.sheet_close" aria-label="Đóng"><span aria-hidden="true"></span></button>

        <div class="sidebar-tabs" role="tablist">
          <button class="tab-btn" data-tab="tab-moves" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-list-numbers"></use></svg><span class="tab-btn__label" data-i18n="tmatch.tab_moves">Nước đi</span></button>
          <button class="tab-btn tab-btn--active" data-tab="tab-chat" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-chat-circle"></use></svg><span class="tab-btn__label" data-i18n="room.tab_chat">Chat</span></button>
          <button class="tab-btn" data-tab="tab-users" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-eye"></use></svg><span class="tab-btn__label" data-i18n="room.tab_spectators">Khán giả</span></button>
        </div>

        <div class="tab-content" id="tab-moves">
          <ol class="moves" id="moves-list"></ol>
          <ol class="moves-grid" id="moves-grid"></ol>
        </div>

        <div class="tab-content tab-content--active" id="tab-chat">
          <div class="chat-panel">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input" id="chat-input-wrapper">
              <input type="text" id="chat-input" data-i18n-placeholder="room.ph_chat" placeholder="Nhập tin nhắn..."
                maxlength="500" autocomplete="off" />
              <button id="btn-send" type="button" data-i18n-title="room.btn_send" title="Gửi" aria-label="Gửi"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-bold-paper-plane-tilt"></use></svg></button>
            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-users">
          <div id="users-panel" class="users-panel"><ul id="users-list" class="users-list"></ul></div>
        </div>
      </div>
    </div>

    <div class="game-controls" id="match-actions" style="display:none;">
      <button class="act" type="button" id="btn-time" data-i18n-title="game.btn_time"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-hourglass"></use></svg><span data-i18n="room.act_time">Xin time</span></button>
      <button class="act" type="button" id="btn-draw" data-i18n-title="game.btn_draw"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-handshake"></use></svg><span data-i18n="room.act_draw">Cầu hoà</span></button>
      <button class="act" type="button" id="btn-resign"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-flag"></use></svg><span data-i18n="room.act_resign">Đầu hàng</span></button>
    </div>

    <div class="seatcard seatcard--bottom" id="seatcard-bottom" aria-live="polite"></div>

    <div class="stage" aria-hidden="true"></div>
    <div class="rdock" id="rdock">
      <!-- phones: #chat-input-wrapper is moved here by tournament-match.js -->
      <button class="rdock__btn" id="btn-sheet" type="button" aria-expanded="false" aria-controls="rsheet" data-i18n-title="room.sheet_open" data-i18n-aria="room.sheet_open" title="Chat, tỉ số và nước đi" aria-label="Chat, tỉ số và nước đi"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-regular-chat-circle"></use></svg><span class="rdock__badge" id="sheet-badge" hidden></span></button>
    </div>
  </aside>
  <div class="rsheet-scrim" id="rsheet-scrim" hidden></div>
</main>

<div class="match-result-overlay" id="match-result-overlay">
  <div class="match-result-card">
    <svg class="icon match-result-card__icon" id="match-result-icon"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-bold-flag-checkered"></use></svg>
    <div class="match-result-card__title" id="match-result-title"></div>
    <div class="match-result-card__sub" id="match-result-sub"></div>
    <a class="btn btn-confirm" id="match-result-back" href="#" data-i18n="tmatch.back_to_tournament">Quay lại giải đấu</a>
  </div>
</div>

<!-- Between-games transition (TODO.md #50 — a game inside a series ended but
     the pairing isn't decided yet). Same visual treatment as the final
     result overlay, and auto-hides once the next game's tmatch:init arrives.
     TODO.md #62: check-in for the next game happens right here (a "Sẵn sàng"
     button emitting the same tournament:ready event tournament-detail.js
     uses) instead of sending players back to the tournament page — the
     server-side Ready<->InProgress state machine (PairingLifecycle.js) is
     unchanged, this only adds a second UI entry point into it. -->
<div class="match-result-overlay" id="series-transition-overlay">
  <div class="match-result-card">
    <svg class="icon match-result-card__icon" id="series-transition-icon"><use href="assets/icons/phosphor-sprite.svg?v=1d6d0a18#ph-bold-flag-checkered"></use></svg>
    <div class="match-result-card__title" id="series-transition-title"></div>
    <div class="match-result-card__sub" id="series-transition-sub"></div>
    <button class="btn btn-confirm" id="series-transition-ready-btn" type="button" data-i18n="tmatch.series_ready_btn">Sẵn sàng</button>
    <div class="start-modal__waiting" id="series-transition-waiting" style="display:none;"></div>
  </div>
</div>

<script src="/vendor/socket.io/socket.io.min.js?v=d5d79a35"></script>
<!-- TODO.md #74: tournament matches never loaded this, so had no move/win/
     lose/timer sound at all despite tournament-match.js calling audioManager
     the same way room-socket.js does. -->
<script src="js/audio-manager.js?v=05f3d9fe"></script>
<script src="js/coords.js?v=f2d4e6d0"></script>
<script src="js/renju.js?v=ee70c581"></script>
<script src="js/renju-opening-ui.js?v=9a34bd6d"></script>
<script type="module" src="js/tournament-match-entry.js?v=3e83c707"></script>
</body>
</html>
