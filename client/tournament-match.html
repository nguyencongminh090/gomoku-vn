<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Trận đấu giải đấu</title>
  <meta name="description" content="Play3CR — Trận đấu trong giải đấu Caro trực tuyến." />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/main.css?v=62" />
  <link rel="stylesheet" href="css/lobby.css?v=62" />
  <link rel="stylesheet" href="css/room.css?v=62" />
  <link rel="stylesheet" href="css/tournament.css?v=62" />
  <link rel="stylesheet" href="css/settings-panel.css?v=62" />
  <script>
    (function() {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme ? storedTheme : 'light');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      var m;
      try { m = localStorage.getItem('gvn_ui_mode'); } catch (e) { m = null; }
      var mode = (m === 'lite' || m === 'default' || m === 'pro') ? m : 'lite';
      document.documentElement.setAttribute('data-ui-mode', mode);
    })();
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

<div id="status-banner" class="status-banner" aria-live="polite"></div>

<nav class="topnav" role="navigation" aria-label="Điều hướng chính">
  <a href="index.html" class="topnav__brand">
    <img src="assets/brand/logo-mark.svg" alt="" width="28" height="28" class="topnav__logo" />
    <span class="topnav__title">Play3CR</span>
  </a>
  <div class="topnav__right">
    <span id="nav-user" class="topnav__user"></span>
    <span id="nav-badge" class="topnav__badge"></span>
  </div>
</nav>

<div class="lobby-layout">
<main class="lobby" role="main">

  <a href="#" id="back-to-tournament" class="detail-back"><i class="ph ph-arrow-left"></i><span data-i18n="tmatch.back">Quay lại chi tiết giải đấu</span></a>

  <div class="detail-header">
    <div>
      <div class="detail-header__name" id="match-title">—</div>
      <div class="detail-header__meta" id="match-meta"></div>
    </div>
  </div>

  <div id="swap2-banner-slot"></div>

  <div class="match-shell">
    <div class="match-board-wrap">
      <div class="match-clocks">
        <div class="match-clock" id="clock-black">
          <span class="match-clock__name"><span class="match-stone-dot match-stone-dot--black"></span><span id="clock-black-name">—</span></span>
          <span class="match-clock__time" id="clock-black-time">--:--</span>
        </div>
        <div class="match-clock" id="clock-white">
          <span class="match-clock__name"><span class="match-stone-dot match-stone-dot--white"></span><span id="clock-white-name">—</span></span>
          <span class="match-clock__time" id="clock-white-time">--:--</span>
        </div>
      </div>

      <section class="board-area-shell" id="board-area-shell">
        <div class="board-area" id="board-area">
          <div class="board-canvas-wrap match-board-canvas-wrap" id="board-wrap">
            <canvas id="match-canvas"></canvas>
          </div>
        </div>
      </section>

      <div class="match-actions" id="match-actions" style="display:none;">
        <button class="btn btn-cancel" type="button" id="btn-resign" data-i18n="tmatch.btn_resign">Đầu hàng</button>
      </div>
    </div>

    <aside class="ui-shell">
      <div class="ui-core" style="padding:0;">

        <!-- Tabs: Move history | Chat | Spectators — the chat/spectators tabs
             are ported from room.html's component chrome (TODO.md #50 step 7,
             decision 9: UI/CSS reuse only, NOT routed through RoomHandler —
             see server/socket/handlers/TournamentMatchHandler.js's
             tmatch:chat_message/tmatch:presence, its own parallel mechanism
             scoped to the match's own Socket.io room). -->
        <div class="sidebar-tabs">
          <button class="tab-btn tab-btn--active" data-tab="tab-moves" data-i18n="tmatch.tab_moves">Nước đi</button>
          <button class="tab-btn" data-tab="tab-chat" data-i18n="room.tab_chat">Trò chuyện</button>
          <button class="tab-btn" data-tab="tab-users" data-i18n="room.tab_spectators">Khán giả</button>
        </div>

        <div class="tab-content tab-content--active" id="tab-moves">
          <div class="move-list" id="move-list" style="padding:10px 14px;"></div>
        </div>

        <div class="tab-content" id="tab-chat">
          <div class="chat-panel">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input" id="chat-input-wrapper">
              <input type="text" id="chat-input" data-i18n-placeholder="room.ph_chat" placeholder="Nhập tin nhắn..."
                maxlength="500" autocomplete="off" />
              <button id="btn-send" type="button" data-i18n="room.btn_send">Gửi</button>
            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-users">
          <div id="users-panel" class="users-panel">
            <ul id="users-list" class="users-list"></ul>
          </div>
        </div>

      </div>
    </aside>
  </div>

</main>
</div>

<div class="match-result-overlay" id="match-result-overlay">
  <div class="match-result-card">
    <div class="match-result-card__icon" id="match-result-icon">🏁</div>
    <div class="match-result-card__title" id="match-result-title"></div>
    <div class="match-result-card__sub" id="match-result-sub"></div>
    <a class="btn btn-confirm" id="match-result-back" href="#" data-i18n="tmatch.back_to_tournament">Quay lại giải đấu</a>
  </div>
</div>

<!-- Between-games transition (TODO.md #50 — a game inside a series ended but
     the pairing isn't decided yet). Same visual treatment as the final
     result overlay, but auto-hides once the next game's tmatch:init arrives
     instead of linking back out to the tournament. -->
<div class="match-result-overlay" id="series-transition-overlay">
  <div class="match-result-card">
    <div class="match-result-card__icon" id="series-transition-icon">⏭️</div>
    <div class="match-result-card__title" id="series-transition-title"></div>
    <div class="match-result-card__sub" id="series-transition-sub"></div>
    <div class="match-result-card__sub" data-i18n="tmatch.series_waiting_next">Đang chuẩn bị ván tiếp theo...</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/tournament-match-entry.js?v=62"></script>
</body>
</html>
