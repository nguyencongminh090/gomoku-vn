<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Tạo phòng</title>
<style>
:root{
  --bg:#161512;--surface:#262421;--surface2:#2f2d29;--border:rgba(255,255,255,.10);--fill:rgba(255,255,255,.06);
  --ink:#e8e6e1;--ink2:#a8a49b;--ink3:#9a968c;--brand:#4f7d1c;--brand-t:#8bc34a;--brand-l:rgba(98,153,36,.16);
  --accent:#ee6a20;--bar:#0f0e0c;--paper:#e9d9b4;--line:#8a7a55;
  --r:10px;--rl:14px;--rxl:20px;
  --fast:140ms;--norm:240ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--border);flex-wrap:wrap}
.bar b{margin-right:8px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;min-height:40px}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 12px}
.note{max-width:720px;margin:0 auto 12px;color:var(--ink2);font-size:14px;padding:0 16px}
.sheet{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--rxl);box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden;animation:in var(--norm) var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}}
.sheet.A{max-width:520px}.sheet.B{max-width:860px}.sheet.C{max-width:540px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.hd h2{margin:0;font-size:18px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill)}
.bd{padding:8px 20px 20px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px;font-weight:700}
.hint{font-size:13px;color:var(--ink2);margin:6px 0 0}
input[type=text],input[type=number]{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--ink);padding:0 12px;font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* seg */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--fill);transition:background var(--fast),border-color var(--fast),transform var(--fast)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed=true]{background:var(--brand-l);border-color:var(--brand);color:#fff}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
/* cta */
.cta{display:flex;gap:10px;margin-top:20px}
.btn{min-height:48px;border-radius:var(--r);border:0;font-weight:700;padding:0 18px}
.btn.ghost{background:var(--fill)}
.btn.go{background:var(--brand);color:#fff;flex:1;transition:transform var(--fast),filter var(--fast)}
.btn.go:hover{filter:brightness(1.1)}.btn.go:active{transform:scale(.98)}
.sum{font-size:13px;color:var(--ink2);margin:14px 0 0;min-height:1.4em}
.sum b{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:13px}
/* ---- A: presets ---- */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{position:relative;text-align:left;padding:14px;border-radius:var(--rl);border:1px solid var(--border);background:var(--fill);display:grid;gap:4px;transition:border-color var(--fast),background var(--fast),transform var(--fast)}
.pc:hover{border-color:var(--ink3)}.pc:active{transform:scale(.98)}
.pc[aria-pressed=true]{border-color:var(--brand);background:var(--brand-l)}
.pc[aria-pressed=true]::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--brand-t);font-weight:700;animation:pop var(--norm) var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.pc .t{font-weight:700}.pc .d{font-size:13px;color:var(--ink2)}
.pc svg{width:48px;height:48px}
.acc{margin-top:14px;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--fill);border:0;min-height:48px;text-align:left}
.acc .val{color:var(--brand-t);font-size:13px;margin-left:auto}
.acc .panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--norm) var(--ease)}
.acc.open .panel{grid-template-rows:1fr}
.acc .panel>div{overflow:hidden}
.acc .in{padding:0 14px 14px}
.acc .caret{transition:transform var(--norm) var(--ease)}.acc.open .caret{transform:rotate(180deg)}
/* ---- B: board preview ---- */
.two{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:0}
.pv{background:linear-gradient(160deg,#2b2823,#1d1b18);padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;border-right:1px solid var(--border)}
.pv .board{width:100%;max-width:300px;aspect-ratio:1;background:var(--paper);border-radius:8px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pv svg{width:100%;height:100%;display:block}
.pv .cap{font-size:13px;color:var(--ink2);text-align:center;min-height:2.6em}
.pv .cap b{color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);min-height:48px}
.sw{position:relative;width:46px;height:26px;flex:none;border-radius:99px;background:var(--surface2);border:1px solid var(--border);transition:background var(--fast)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--norm) var(--spring)}
.sw[aria-checked=true]{background:var(--brand)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.sw[disabled]{opacity:.4}
.clock{display:flex;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:var(--fill);font-size:20px}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
/* ---- C: sentence ---- */
.sentence{font-size:22px;line-height:2.1;margin:8px 0 4px}
.sentence button{border:0;border-bottom:2px dashed var(--brand);background:var(--brand-l);color:var(--brand-t);border-radius:8px 8px 0 0;padding:2px 10px;font-weight:700;font-size:inherit;transition:background var(--fast)}
.sentence button[aria-expanded=true]{background:var(--brand);color:#fff}
.sentence button.bump{animation:bump var(--norm) var(--spring)}
@keyframes bump{50%{transform:scale(1.08)}}
.pop{margin:6px 0 10px;padding:12px;border-radius:var(--rl);background:var(--bg);border:1px solid var(--border);animation:in var(--norm) var(--ease)}
.pop[hidden]{display:none}
.pop .opt{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;padding:10px;border-radius:var(--r);border:1px solid transparent;background:transparent;min-height:48px}
.pop .opt[aria-pressed=true]{background:var(--brand-l);border-color:var(--brand)}
.pop .opt small{grid-column:2;color:var(--ink2)}
.pop .opt span.k{grid-row:1/3;align-self:center;font-weight:800;width:44px;color:var(--brand-t)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.extras button{min-height:40px;padding:0 14px;border-radius:999px;border:1px dashed var(--ink3);background:transparent}
.extras button[aria-pressed=true]{border-style:solid;border-color:var(--brand);background:var(--brand-l)}
/* mobile: bottom sheet */
@media(max-width:640px){
  .stage{padding:0;align-items:flex-end;min-height:calc(100dvh - 60px)}
  .sheet{max-width:none!important;border-radius:var(--rxl) var(--rxl) 0 0;max-height:92dvh;overflow:auto;animation:up var(--norm) var(--ease)}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--border);margin:8px auto 0}
  .two{grid-template-columns:1fr}
  .pv{flex-direction:row;padding:10px 14px;border-right:0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
  .pv .board{width:84px;flex:none;padding:5px}.pv .cap{text-align:left;flex:1}
  .cta{position:sticky;bottom:0;background:linear-gradient(transparent,var(--surface) 30%);padding-top:14px}
  .presets{grid-template-columns:1fr 1fr}
}
@keyframes up{from{transform:translateY(100%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="bar" role="tablist" aria-label="Hướng thiết kế">
  <b>Tạo phòng — mockup</b>
  <button class="tab" role="tab" data-v="A" aria-selected="true">A · Preset trước</button>
  <button class="tab" role="tab" data-v="B" aria-selected="false">B · Bàn cờ sống</button>
  <button class="tab" role="tab" data-v="C" aria-selected="false">C · Câu lệnh</button>
</div>
<p class="note" id="note"></p>
<div class="stage"><div id="root"></div></div>

<script>
const DEF={ranked:true,size:17,rule:'freestyle',swap2:false,wall:false,portal:false,tmode:'per_move',secs:60,inc:0,name:''};
const S={...DEF};
const RULES={freestyle:['Luật 1','5 quân liền trở lên là thắng'],standard:['Tiêu chuẩn','Đúng 5 quân liền'],caro:['Luật 2','5 quân, không bị chặn 2 đầu']};
const TM={per_move:['Mỗi nước','Hết giờ nước đi là thua ván'],per_game:['Mỗi ván','Tổng thời gian cả ván'],blitz:['Blitz','Có cộng thêm giờ sau mỗi nước']};
const PRESETS=[
 {id:'quick',t:'Chuẩn',d:'17×17 · Tường · 60s/nước',s:{size:17,rule:'freestyle',swap2:false,wall:true,portal:false,tmode:'per_move',secs:60,inc:0}},
 {id:'blitz',t:'Blitz',d:'15×15 · 3 phút +2s',s:{size:15,rule:'freestyle',swap2:false,wall:false,portal:false,tmode:'blitz',secs:180,inc:2}},
 {id:'pro',t:'Thi đấu',d:'19×19 · Swap2 · Luật 2',s:{size:19,rule:'caro',swap2:true,wall:false,portal:false,tmode:'per_game',secs:600,inc:0}},
 {id:'fun',t:'Biến thể',d:'17×17 · Tường + Cổng',s:{size:17,rule:'freestyle',swap2:false,wall:true,portal:true,tmode:'per_move',secs:45,inc:0}},
];
const NOTES={A:'A · Preset trước: 90% người dùng chỉ cần chọn 1 thẻ rồi bấm Tạo. Tuỳ chỉnh nằm trong các mục gập, mỗi mục hiện giá trị hiện tại ngay trên tiêu đề.',
B:'B · Bàn cờ sống: bàn mini bên trái đổi theo từng lựa chọn (cỡ bàn, tường, cổng). Người chơi thấy trước điều mình đang tạo. Trên điện thoại, bàn thu nhỏ thành thanh dính ở đầu.',
C:'C · Câu lệnh: cả cấu hình đọc như một câu; chạm vào từ khoá để đổi. Ít ô nhập, dễ đọc lại, hợp điện thoại. Mục phụ (Swap2, Tường, Cổng) là các nút bật.'};
let V='A',open={};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function summary(){
  const tm=S.tmode==='blitz'?`${S.secs}s +${S.inc}s`:S.tmode==='per_game'?`${S.secs}s/ván`:`${S.secs}s/nước`;
  const sp=[S.swap2&&'Swap2',S.wall&&'Tường',S.portal&&'Cổng'].filter(Boolean).join(' + ');
  return `<b>${S.ranked?'Xếp hạng':'Giao hữu'}</b> · ${S.size}×${S.size} · ${RULES[S.rule][0]}${sp?' · '+sp:''} · ${tm}`;
}
function sync(){ if(S.swap2){S.wall=false;S.portal=false} if(S.tmode!=='blitz')S.inc=0 }
function seg(items,cur,key,extra=''){return `<div class="seg" ${extra}>${items.map(([v,l,dis])=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${String(cur)===String(v)}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`}
function toggle(key,label,desc){const dis=S.swap2&&(key==='wall'||key==='portal');
  return `<div class="tog"><div><div>${label}</div><div class="hint" style="margin:0">${dis?'Swap2 chơi trên bàn trống':desc}</div></div><button type="button" class="sw" role="switch" data-t="${key}" aria-checked="${S[key]}" aria-label="${label}" ${dis?'disabled':''}></button></div>`}
function clock(){return `<div class="lbl">Thời gian</div>${seg(Object.entries(TM).map(([k,v])=>[k,v[0]]),S.tmode,'tmode')}
 <p class="hint">${TM[S.tmode][1]}</p>
 <div class="clock" style="margin-top:10px"><div class="stepper"><button type="button" data-step="secs" data-d="-5" aria-label="Giảm">−</button><output>${S.secs}s</output><button type="button" data-step="secs" data-d="5" aria-label="Tăng">+</button></div>
 ${S.tmode==='blitz'?`<span>cộng</span><div class="stepper"><button type="button" data-step="inc" data-d="-1" aria-label="Giảm">−</button><output>+${S.inc}s</output><button type="button" data-step="inc" data-d="1" aria-label="Tăng">+</button></div>`:''}</div>`}
function boardSVG(){
  const n=S.size,c=100/(n-1);let g='';
  for(let i=0;i<n;i++){g+=`<line x1="0" y1="${i*c}" x2="100" y2="${i*c}"/><line x1="${i*c}" y1="0" x2="${i*c}" y2="100"/>`}
  let ex='';
  if(S.wall){[[3,5,3],[8,10,1]].forEach(([a,b,len])=>{ex+=`<rect x="${(a-.3)*c}" y="${(b-.3)*c}" width="${.6*c}" height="${(len+.6)*c}" rx="1" fill="#3b2f1c"/>`})}
  if(S.portal){[[n-4,3],[3,n-4]].forEach(([x,y],i)=>{ex+=`<circle cx="${x*c}" cy="${y*c}" r="${c*.5}" fill="none" stroke="${i?'#2d7fd1':'#e8761c'}" stroke-width="1.6"/><circle cx="${x*c}" cy="${y*c}" r="${c*.22}" fill="${i?'#2d7fd1':'#e8761c'}"/>`})}
  const st=[[n>>1,n>>1,'#111'],[(n>>1)+1,n>>1,'#fff'],[(n>>1),(n>>1)+1,'#111']].map(([x,y,f])=>`<circle cx="${x*c}" cy="${y*c}" r="${c*.42}" fill="${f}" stroke="#111" stroke-width=".5"/>`).join('');
  return `<svg viewBox="-2 -2 104 104" aria-hidden="true"><g stroke="#8a7a55" stroke-width=".35">${g}</g>${ex}${st}</svg>`}
function miniSVG(p){const n=p.s.size;return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="6" fill="#e9d9b4"/><g stroke="#8a7a55" stroke-width=".6">${[...Array(6)].map((_,i)=>`<line x1="6" y1="${8+i*6.4}" x2="42" y2="${8+i*6.4}"/><line x1="${8+i*6.4}" y1="6" x2="${8+i*6.4}" y2="42"/>`).join('')}</g><circle cx="21" cy="21" r="3" fill="#111"/><circle cx="28" cy="21" r="3" fill="#fff" stroke="#111" stroke-width=".5"/>${p.s.wall?'<rect x="14" y="28" width="3" height="10" fill="#3b2f1c"/>':''}${p.s.portal?'<circle cx="36" cy="36" r="3" fill="none" stroke="#e8761c" stroke-width="1.5"/>':''}<text x="44" y="12" font-size="7" text-anchor="end" fill="#6b5a35">${n}</text></svg>`}
function name(){return `<div class="lbl">Tên phòng</div><input type="text" maxlength="30" placeholder="Tuỳ chọn — để trống tự đặt tên" data-name value="${esc(S.name)}">`}
function mode(){return `<div class="lbl">Chế độ</div>${seg([[true,'🏆 Xếp hạng'],[false,'🤝 Giao hữu']],S.ranked,'ranked')}<p class="hint">${S.ranked?'Tính điểm Elo, không đi lại.':'Không tính điểm, được đi lại.'} Có khách ngồi chơi thì ván tự thành giao hữu.</p>`}
function footer(){return `<div class="sum" aria-live="polite">${summary()}</div><div class="cta"><button class="btn ghost" type="button" data-reset>Mặc định</button><button class="btn go" type="button" data-go>Tạo phòng</button></div>`}
function hd(){return `<div class="hd"><h2>Tạo phòng mới</h2><button class="x" type="button" aria-label="Đóng">✕</button></div>`}
function acc(id,title,val,body){const o=open[id];return `<div class="acc ${o?'open':''}"><button type="button" data-acc="${id}" aria-expanded="${!!o}"><span>${title}</span><span class="val">${val}</span><span class="caret" aria-hidden="true">▾</span></button><div class="panel"><div><div class="in">${body}</div></div></div></div>`}

function viewA(){
  const cur=PRESETS.find(p=>Object.entries(p.s).every(([k,v])=>S[k]===v));
  return `<div class="sheet A" role="dialog" aria-modal="true" aria-label="Tạo phòng mới">${hd()}<div class="bd">
  <div class="lbl" style="margin-top:4px">Chọn nhanh</div>
  <div class="presets">${PRESETS.map(p=>`<button type="button" class="pc" data-preset="${p.id}" aria-pressed="${cur&&cur.id===p.id}">${miniSVG(p)}<span class="t">${p.t}</span><span class="d">${p.d}</span></button>`).join('')}</div>
  ${mode()}
  <div style="margin-top:14px">
  ${acc('rule','Luật chơi',`${RULES[S.rule][0]}${S.swap2?' · Swap2':''}`,
    `<div class="lbl" style="margin-top:0">Luật thắng</div>${seg(Object.entries(RULES).map(([k,v])=>[k,v[0]]),S.rule,'rule')}<p class="hint">${RULES[S.rule][1]}</p>
     <div class="lbl">Mở đầu</div>${seg([[false,'Không'],[true,'Swap2']],S.swap2,'swap2')}
     <div class="lbl">Luật đặc biệt</div>${toggle('wall','Tường (Wall)','Ô bị chặn ngẫu nhiên trên bàn')}${toggle('portal','Cổng dịch chuyển','Quân đi qua cổng xuất hiện ở cổng kia')}`)}
  ${acc('board','Bàn cờ',`${S.size}×${S.size}`,seg([15,17,19,20].map(n=>[n,n+'×'+n]),S.size,'size'))}
  ${acc('time','Thời gian',S.tmode==='blitz'?`${S.secs}s +${S.inc}s`:`${S.secs}s`,clock().replace('<div class="lbl">Thời gian</div>',''))}
  ${acc('name','Tên phòng',S.name||'Tự đặt',name().replace(/<div class="lbl">.*?<\/div>/,''))}
  </div>${footer()}</div></div>`}

function viewB(){
  return `<div class="sheet B" role="dialog" aria-modal="true" aria-label="Tạo phòng mới">${hd()}<div class="two">
  <div class="pv"><div class="board">${boardSVG()}</div><div class="cap">${summary()}</div></div>
  <div class="bd">
   ${mode()}
   <div class="lbl">Bàn cờ</div>${seg([15,17,19,20].map(n=>[n,n+'×'+n]),S.size,'size')}
   <div class="lbl">Luật thắng</div>${seg(Object.entries(RULES).map(([k,v])=>[k,v[0]]),S.rule,'rule')}<p class="hint">${RULES[S.rule][1]}</p>
   <div class="lbl">Luật mở đầu & đặc biệt</div>${toggle('swap2','Swap2','Đổi bên sau 3 quân đầu')}${toggle('wall','Tường','Ô bị chặn trên bàn')}${toggle('portal','Cổng dịch chuyển','Hai cổng nối nhau')}
   ${clock()}
   ${name()}
   ${footer()}
  </div></div></div>`}

function viewC(){
  const w=(id,txt)=>`<button type="button" data-pop="${id}" aria-expanded="${open[id]?'true':'false'}">${txt}</button>`;
  const pops={
   mode:`${[[true,'Xếp hạng','Tính điểm Elo, không đi lại'],[false,'Giao hữu','Không tính điểm, được đi lại']].map(([v,t,d])=>`<button type="button" class="opt" data-k="ranked" data-v="${v}" aria-pressed="${S.ranked===v}"><span class="k">${v?'🏆':'🤝'}</span><b>${t}</b><small>${d}</small></button>`).join('')}`,
   size:`${seg([15,17,19,20].map(n=>[n,n+'×'+n]),S.size,'size')}`,
   rule:Object.entries(RULES).map(([k,v])=>`<button type="button" class="opt" data-k="rule" data-v="${k}" aria-pressed="${S.rule===k}"><span class="k">${v[0].replace('Luật ','L')==='Tiêu chuẩn'?'5=':v[0].replace('Luật ','L')}</span><b>${v[0]}</b><small>${v[1]}</small></button>`).join(''),
   time:Object.entries(TM).map(([k,v])=>`<button type="button" class="opt" data-k="tmode" data-v="${k}" aria-pressed="${S.tmode===k}"><span class="k">⏱</span><b>${v[0]}</b><small>${v[1]}</small></button>`).join('')+`<div class="clock" style="margin-top:8px"><div class="stepper"><button type="button" data-step="secs" data-d="-5" aria-label="Giảm">−</button><output>${S.secs}s</output><button type="button" data-step="secs" data-d="5" aria-label="Tăng">+</button></div>${S.tmode==='blitz'?`<span>cộng</span><div class="stepper"><button type="button" data-step="inc" data-d="-1" aria-label="Giảm">−</button><output>+${S.inc}s</output><button type="button" data-step="inc" data-d="1" aria-label="Tăng">+</button></div>`:''}</div>`
  };
  const tmTxt=S.tmode==='blitz'?`${S.secs}s +${S.inc}s`:S.tmode==='per_game'?`${S.secs}s cả ván`:`${S.secs}s mỗi nước`;
  const P=id=>open[id]?`<div class="pop" data-popbox="${id}">${pops[id]}</div>`:'';
  return `<div class="sheet C" role="dialog" aria-modal="true" aria-label="Tạo phòng mới">${hd()}<div class="bd">
  <div class="sentence">Mở một phòng ${w('mode',S.ranked?'xếp hạng':'giao hữu')}, bàn ${w('size',S.size+'×'+S.size)}, ${w('rule',RULES[S.rule][0])}, đếm giờ ${w('time',tmTxt)}.</div>
  ${['mode','size','rule','time'].map(P).join('')}
  <div class="lbl">Thêm vào</div>
  <div class="extras">
   <button type="button" data-t="swap2" aria-pressed="${S.swap2}">＋ Swap2</button>
   <button type="button" data-t="wall" aria-pressed="${S.wall}" ${S.swap2?'disabled':''}>＋ Tường</button>
   <button type="button" data-t="portal" aria-pressed="${S.portal}" ${S.swap2?'disabled':''}>＋ Cổng dịch chuyển</button>
  </div>
  ${S.swap2?'<p class="hint">Swap2 chơi trên bàn trống nên Tường và Cổng tạm tắt.</p>':''}
  <div class="lbl">Dùng lại</div><div class="seg">${PRESETS.map(p=>`<button type="button" data-preset="${p.id}">${p.t}</button>`).join('')}</div>
  ${name()}
  ${footer()}</div></div>`}

function render(){
  sync();
  const f=document.activeElement,key=f&&(f.dataset.acc||f.dataset.pop||f.dataset.preset||f.dataset.t||(f.dataset.k&&f.dataset.k+'|'+f.dataset.v)||(f.dataset.step&&f.dataset.step+'|'+f.dataset.d));
  const keepScroll=$('.sheet')?.scrollTop||0;
  $('#root').innerHTML=({A:viewA,B:viewB,C:viewC})[V]();
  $('#note').textContent=NOTES[V];
  const sh=$('.sheet');sh.style.animation='none';sh.scrollTop=keepScroll;
  if(key){const sel=[`[data-acc="${key}"]`,`[data-pop="${key}"]`,`[data-preset="${key}"]`,`[data-t="${key}"]`].concat(key.includes('|')?[`[data-k="${key.split('|')[0]}"][data-v="${key.split('|')[1]}"]`,`[data-step="${key.split('|')[0]}"][data-d="${key.split('|')[1]}"]`]:[]);
    for(const s of sel){const el=$(s);if(el){el.focus({preventScroll:true});break}}}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.classList.contains('tab')){V=t.dataset.v;open={};document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b===t));$('#root').innerHTML='';render();return}
  if(t.dataset.k){const v=t.dataset.v;S[t.dataset.k]=['ranked','swap2'].includes(t.dataset.k)?v==='true':(t.dataset.k==='size'?+v:v);
    if(t.dataset.k==='tmode'){S.secs=v==='blitz'?180:v==='per_game'?600:60}
    return render()}
  if(t.dataset.t){S[t.dataset.t]=!S[t.dataset.t];return render()}
  if(t.dataset.step){const k=t.dataset.step,d=+t.dataset.d*(k==='secs'&&S.tmode!=='per_move'?6:1);S[k]=Math.max(k==='secs'?5:0,Math.min(k==='secs'?3600:600,S[k]+d));return render()}
  if(t.dataset.acc){open[t.dataset.acc]=!open[t.dataset.acc];return render()}
  if(t.dataset.pop){const id=t.dataset.pop,was=open[id];open={};open[id]=!was;return render()}
  if(t.dataset.preset){Object.assign(S,PRESETS.find(p=>p.id===t.dataset.preset).s);return render()}
  if(t.dataset.reset!==undefined){Object.assign(S,DEF);return render()}
  if(t.dataset.go!==undefined){t.textContent='Đang tạo…';t.disabled=true;setTimeout(()=>{t.textContent='Tạo phòng';t.disabled=false},900)}
});
document.addEventListener('input',e=>{if(e.target.dataset.name!==undefined)S.name=e.target.value});
render();
</script>
</body>
</html>
