<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Phòng chơi</title>
  <meta name="description" content="Play3CR — Phòng chơi Caro trực tuyến với luật Wall và Portal." />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=237afa6e" />
  <link rel="stylesheet" href="css/tokens.css?v=75d051bd" />
  <link rel="stylesheet" href="css/lobby.css?v=64758c00" />
  <link rel="stylesheet" href="css/room.css?v=70cf7510" />
  <link rel="stylesheet" href="css/shell.css?v=524202cc" />
  <link rel="stylesheet" href="css/game.css?v=e77e8c5b" />
  <link rel="stylesheet" href="css/settings-panel.css?v=33a2079d" />
  <link rel="stylesheet" href="css/room-arena.css?v=85ceb982" />
  <link rel="stylesheet" href="vendor/fonts/nunito/style.css">


  <script src="js/skin-preload.js?v=b452e3a9"></script>
  <!-- Phosphor Icons -->

  <!-- modulepreload hints (TODO.md #126) — must exactly match js/room-entry.js's import list -->
  <link rel="modulepreload" href="js/session.js?v=7d763f30" />
  <link rel="modulepreload" href="js/i18n.js?v=7d67ef60" />
  <link rel="modulepreload" href="js/ui-mode.js?v=3e1ff171" />
  <link rel="modulepreload" href="js/settings-panel.js?v=014127cb" />
  <link rel="modulepreload" href="js/socket-client.js?v=13b77de5" />
  <link rel="modulepreload" href="js/board.js?v=e95b51b3" />
  <link rel="modulepreload" href="js/room.js?v=d303980d" />
  <link rel="modulepreload" href="js/chat-ui.js?v=c9347a46" />
  <link rel="modulepreload" href="js/room-ui.js?v=6339f10d" />
  <link rel="modulepreload" href="js/game-ui.js?v=40aa4bb0" />
  <link rel="modulepreload" href="js/room-socket.js?v=c7acb632" />

</head>

<body class="arena-room">

  <!-- Shown by default (no JS toggle needed to appear) until room:joined or
       room:error arrives, so a rejected room:create/room:join (e.g. hitting
       MAX_ROOMS_PER_IP) never shows the empty/uninitialized room chrome
       underneath — just this, then a redirect. Hidden by room-socket.js once
       real room data lands. See TODO.md #18 / instruction.md §B18. -->
  <div class="game-overlay visible" id="room-entry-overlay">
    <div class="game-overlay__card">
      <div class="game-overlay__icon"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-hourglass"></use></svg></div>
      <div class="game-overlay__result" data-i18n="room.entering">Đang vào phòng...</div>
      <div class="game-overlay__slow" data-i18n="conn.lagging">Đang tải… mạng chậm</div>
    </div>
  </div>

  <!-- ── Connection Status ───────────────────────────────────────────────── -->
  <div id="status-banner" class="status-banner" aria-live="polite"></div>

  <!-- ── Top Nav ──────────────────────────────────────────────────────────── -->
  <nav class="topnav" role="navigation">
    <a href="index.html" class="topnav__brand" aria-label="Play3CR">
      <span class="topnav__title">Play<b>3CR</b></span>
    </a>
    <!-- Site links (#191 item 6). room-ui.js hides them while you hold a seat in an ongoing game. -->
    <nav id="room-site-links" class="topnav__links" data-i18n-aria="shell.nav" aria-label="Chính">
      <a href="/index.html" data-i18n="shell.lobby">Chơi</a>
      <a href="/index.html#rooms" data-i18n="shell.rooms">Phòng</a>
      <a href="/index.html#tournaments" data-i18n="tabs.tournaments">Giải đấu</a>
      <a href="/rankings.html" data-i18n="lobby.rankings">Xếp hạng</a>
      <a href="/clubs.html" data-i18n="lobby.clubs">Câu lạc bộ</a>
      <a href="/puzzles" data-i18n="shell.learn">Học</a>
    </nav>
    <div class="topnav__right">
      <span id="room-id-nav" class="topnav__user topnav__room-id"></span>
      <span id="room-mode-badge" class="mode-badge" hidden></span>
      <button id="btn-leave" class="topnav__btn" type="button" data-i18n-title="nav.leave" title="Rời phòng">
        <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-bold-sign-out"></use></svg>
        <span data-i18n="nav.leave" class="hide-on-mobile">Rời phòng</span>
      </button>
    </div>
  </nav>

  <!-- ── Room (#216 "Arena Focus") ─────────────────────────────────────────
       Desktop: board | rail [opponent card · tabs · actions · my card].
       ≤768px: one column — opponent card, edge-to-edge board, my card,
       actions, tabs. The rail uses display:contents there so its children
       join the page column in that order (room-arena.css). -->
  <main class="room" role="main">

    <section class="board-area-shell" id="board-area-shell">
      <div class="board-area" id="board-area">
        <div class="board-placeholder">
          <div class="board-placeholder__icon"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-checkerboard"></use></svg></div>
          <div class="board-placeholder__text" data-i18n="room.placeholder">Chờ người chơi ngồi vào và sẵn sàng...</div>
        </div>
      </div>

      <!-- Start Modal (ready window) — centered over the board; only the card
           catches clicks. Sibling of #board-area: GameUI.initBoard() replaces
           #board-area's innerHTML on first render. -->
      <div class="start-modal" id="start-modal">
        <div class="start-modal__card">
          <div class="start-modal__icon"><svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-bold-play-circle"></use></svg></div>
          <div class="start-modal__title" data-i18n="start_modal.title">Sẵn sàng vào trận?</div>
          <div class="start-modal__countdown" id="start-modal-countdown-wrap" style="display:none;">
            <span data-i18n="start_modal.countdown_label">Còn</span>
            <span id="start-modal-countdown">15</span>s
          </div>
          <div class="start-modal__divider"></div>
          <button class="btn-primary" id="start-modal-btn" type="button" data-action="confirmStart" data-i18n="start_modal.btn_start">Bắt đầu</button>
          <div class="start-modal__waiting" id="start-modal-waiting" data-i18n="start_modal.waiting" style="display:none;">Đang chờ đối thủ bấm Bắt đầu...</div>
        </div>
      </div>
    </section>

    <!-- Desktop only (CSS): collapses the docked rail so the board gets the full width -->
    <button class="rail-dock-toggle" id="rail-dock-toggle" type="button" aria-expanded="true" aria-controls="rail"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-bold-caret-right"></use></svg></button>

    <aside class="rail" id="rail" aria-label="Ván đấu">
      <!-- Player cards: the opponent on top, you at the bottom (a spectator
           sees seat #2 on top, seat #1 at the bottom). RoomUI.renderPlayerCards. -->
      <div class="seatcard seatcard--top" id="seatcard-top" aria-live="polite"></div>

      <div class="rpanel">
        <!-- Requests + confirm countdowns float over the top of the panel, never
             over the board, clocks or actions. -->
        <div class="gtoasts" id="game-toasts" aria-live="assertive">
          <div id="draw-prompt-area"></div>
          <div id="time-prompt-area"></div>
          <div id="undo-prompt-area"></div>
          <div id="confirm-prompt-area"></div>
        </div>

        <!-- Phones only (CSS): minimizes the panel to the quick chat bar -->
        <button class="rpanel-toggle" id="rpanel-toggle" type="button" aria-expanded="false" aria-controls="tab-chat"><span class="rpanel-toggle__tri" aria-hidden="true"></span></button>

        <div class="sidebar-tabs" role="tablist">
          <button class="tab-btn" data-tab="tab-moves" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-list-numbers"></use></svg><span class="tab-btn__label" data-i18n="room.tab_moves">Nước đi</span></button>
          <button class="tab-btn tab-btn--active" data-tab="tab-chat" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-chat-circle"></use></svg><span class="tab-btn__label" data-i18n="room.tab_chat">Chat</span></button>
          <button class="tab-btn" data-tab="tab-users" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-eye"></use></svg><span class="tab-btn__label" data-i18n="room.tab_spectators">Khán giả</span></button>
          <button class="tab-btn" data-tab="tab-settings" role="tab"><svg class="icon" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-gear-six"></use></svg><span class="tab-btn__label" data-i18n="room.tab_settings">Cài đặt</span></button>
        </div>

        <div class="tab-content" id="tab-moves">
          <ol class="moves" id="moves-list"></ol>
        </div>

        <div class="tab-content tab-content--active" id="tab-chat">
          <div class="chat-panel">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input" id="chat-input-wrapper">
              <input type="text" id="chat-input" data-i18n-placeholder="room.ph_chat" placeholder="Nhập tin nhắn..."
                maxlength="500" autocomplete="off" />
              <button id="btn-send" type="button" data-i18n-title="room.btn_send" title="Gửi" aria-label="Gửi">
                <svg class="icon"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-bold-paper-plane-tilt"></use></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-users">
          <div class="score-panel" id="score-panel">
            <div class="score-panel__title" data-i18n="room.score_title">Bảng điểm</div>
            <table class="score-table">
              <thead>
                <tr>
                  <th data-i18n="room.th_name">Tên</th>
                  <th data-i18n="room.th_win">T</th>
                  <th data-i18n="room.th_loss">B</th>
                  <th data-i18n="room.th_draw">H</th>
                </tr>
              </thead>
              <tbody id="score-body"></tbody>
            </table>
          </div>
          <div id="users-panel" class="users-panel">
            <ul id="users-list" class="users-list"></ul>
          </div>
        </div>

        <div class="tab-content" id="tab-settings">
          <div id="settings-panel" class="settings-panel">
            <div class="settings-panel__body open" id="settings-body"></div>
          </div>
        </div>
      </div>

      <!-- Action tiles: Lùi · Xin time (Giao hữu only) · Cầu hoà · Đầu hàng.
           GameUI.renderGameControls; empty (and hidden) outside your own game. -->
      <div class="game-controls" id="game-controls"></div>

      <div class="seatcard seatcard--bottom" id="seatcard-bottom" aria-live="polite"></div>
    </aside>
  </main>

  <!-- Float Messages (appear on top of game board) -->
  <div id="float-messages" class="float-messages"></div>

  <!-- Socket.io CDN -->
  <script src="/vendor/socket.io/socket.io.min.js"></script>
  <!-- Application Scripts via Vite entry point -->
  <script src="js/escape-utils.js?v=05dffe1e"></script>
  <!-- Clock maths shared with the diagnostic page (TODO.md #168). Classic
       script, not an entry import: it is a UMD module and Vite's commonjs
       plugin would lazily wrap it, leaving window.TimerSyncCore unset in a
       production build — the same trap escape-utils.js is loaded this way
       for (see room-entry.js's header comment). -->
  <script src="js/timer-sync-core.js?v=c56a5a16"></script>
  <script src="js/audio-manager.js?v=f0ca2309"></script>
  <script src="js/action-delegate.js?v=7420bbed"></script>
  <script type="module" src="js/room-entry.js?v=64f260e3"></script>
</body>

</html>
