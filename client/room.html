<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Phòng chơi</title>
  <meta name="description" content="Play3CR — Phòng chơi Caro trực tuyến với luật Wall và Portal." />
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=106" />
  <link rel="stylesheet" href="css/lobby.css?v=106" />
  <link rel="stylesheet" href="css/room.css?v=106" />
  <link rel="stylesheet" href="css/room-zen.css?v=106" />
  <link rel="stylesheet" href="css/game.css?v=106" />
  <link rel="stylesheet" href="css/settings-panel.css?v=106" />
  <!-- Manrope (self-hosted, TODO.md #69) -->
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=106">

  <script src="js/ui-mode-preload.js?v=106"></script>
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="vendor/phosphor/regular/style.css?v=106" />
  <link rel="stylesheet" href="vendor/phosphor/bold/style.css?v=106" />

</head>

<body class="zen-room">

  <!-- Shown by default (no JS toggle needed to appear) until room:joined or
       room:error arrives, so a rejected room:create/room:join (e.g. hitting
       MAX_ROOMS_PER_IP) never shows the empty/uninitialized room chrome
       underneath — just this, then a redirect. Hidden by room-socket.js once
       real room data lands. See TODO.md #18 / instruction.md §B18. -->
  <div class="game-overlay visible" id="room-entry-overlay">
    <div class="game-overlay__card">
      <div class="game-overlay__icon">⏳</div>
      <div class="game-overlay__result" data-i18n="room.entering">Đang vào phòng...</div>
    </div>
  </div>

  <!-- ── Connection Status ───────────────────────────────────────────────── -->
  <div id="status-banner" class="status-banner" aria-live="polite"></div>

  <!-- ── Top Nav ──────────────────────────────────────────────────────────── -->
  <nav class="topnav" role="navigation">
    <a href="index.html" class="topnav__brand">
      <img src="assets/brand/logo-mark.svg" alt="" width="28" height="28" class="topnav__logo" />
      <span class="topnav__title">Play3CR</span>
    </a>
    <div class="topnav__right">
      <span id="room-id-nav" class="topnav__user topnav__room-id"></span>
      <button id="btn-leave" class="topnav__btn" type="button" data-i18n-title="nav.leave" title="Rời phòng">
        <i class="ph-bold ph-sign-out" style="font-size: 16px;"></i>
        <span data-i18n="nav.leave" class="hide-on-mobile">Rời phòng</span>
      </button>
    </div>
  </nav>

  <!-- ── Room: 2-Column Layout ────────────────────────────────────────────── -->
  <main class="room" role="main">

    <!-- ── Compact "who's in this room" strip (mobile only, above the board) ── -->
    <div id="players-strip" class="players-strip" aria-live="polite"></div>

    <!-- ── Board Area (left, main column) ─────────────────────────────────── -->
    <section class="board-area-shell" id="board-area-shell">
      <div class="board-area" id="board-area">
        <div class="board-placeholder">
          <div class="board-placeholder__icon"><i class="ph ph-checkerboard"></i></div>
          <div class="board-placeholder__text" data-i18n="room.placeholder">Chờ người chơi ngồi vào và sẵn sàng...</div>
        </div>
      </div>

      <!-- Start Modal (ready window) — centered over the board, not a
           full-screen backdrop: only the card itself catches clicks, so the
           seat's stand-up button and chat stay usable while this shows. Kept
           as a sibling of #board-area (not a child) because GameUI.initBoard()
           replaces #board-area's innerHTML wholesale on first render. -->
      <div class="start-modal" id="start-modal">
        <div class="start-modal__card">
          <div class="start-modal__icon"><i class="ph-bold ph-play-circle"></i></div>
          <div class="start-modal__title" data-i18n="start_modal.title">Sẵn sàng vào trận?</div>
          <div class="start-modal__countdown" id="start-modal-countdown-wrap" style="display:none;">
            <span data-i18n="start_modal.countdown_label">Còn</span>
            <span id="start-modal-countdown">15</span>s
          </div>
          <div class="start-modal__divider"></div>
          <button class="btn-primary" id="start-modal-btn" type="button" data-action="confirmStart" data-i18n="start_modal.btn_start">Bắt đầu</button>
          <div class="start-modal__waiting" id="start-modal-waiting" data-i18n="start_modal.waiting" style="display:none;">Đang chờ đối thủ bấm Bắt đầu...</div>
        </div>
      </div>
    </section>

    <!-- ── Right Panel: Players + Tabs ────────────────────────────────────── -->
    <aside class="panel-right-shell ui-shell">
      <div class="panel-right ui-core">

      <!-- Players section (always visible, never hidden behind a tab) -->
      <div class="panel-players">
        <div class="players-row">
          <div id="slot-1" class="slot-card">
            <div class="slot-card__label">#1</div>
            <div id="slot-1-content"></div>
          </div>
          <div class="players-vs">VS</div>
          <div id="slot-2" class="slot-card">
            <div class="slot-card__label">#2</div>
            <div id="slot-2-content"></div>
          </div>
        </div>
        <div id="action-buttons" class="slot-actions"></div>
        <div class="score-panel" id="score-panel" style="display:none;">
          <div class="score-panel__title" data-i18n="room.score_title">Bảng điểm</div>
          <table class="score-table">
            <thead>
              <tr>
                <th data-i18n="room.th_name">Tên</th>
                <th data-i18n="room.th_win">T</th>
                <th data-i18n="room.th_loss">B</th>
                <th data-i18n="room.th_draw">H</th>
              </tr>
            </thead>
            <tbody id="score-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Tabs: Chat | Spectators | Settings -->
      <div class="sidebar-tabs">
        <button class="tab-btn tab-btn--active" data-tab="tab-chat">
          <i class="ph-bold ph-chat-circle" aria-hidden="true"></i>
          <span class="tab-btn__label" data-i18n="room.tab_chat">Trò chuyện</span>
        </button>
        <button class="tab-btn" data-tab="tab-users">
          <i class="ph ph-eye" aria-hidden="true"></i>
          <span class="tab-btn__label" data-i18n="room.tab_spectators">Khán giả</span>
        </button>
        <button class="tab-btn" data-tab="tab-settings">
          <i class="ph ph-gear-six" aria-hidden="true"></i>
          <span class="tab-btn__label" data-i18n="room.tab_settings">Cài đặt</span>
        </button>
      </div>

      <div class="tab-content tab-content--active" id="tab-chat">
        <div class="chat-panel">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input" id="chat-input-wrapper">
            <input type="text" id="chat-input" data-i18n-placeholder="room.ph_chat" placeholder="Nhập tin nhắn..."
              maxlength="500" autocomplete="off" />
            <button id="btn-send" type="button" data-i18n="room.btn_send">Gửi</button>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-users">
        <div id="users-panel" class="users-panel">
          <ul id="users-list" class="users-list"></ul>
        </div>
      </div>

      <div class="tab-content" id="tab-settings">
        <div id="settings-panel" class="settings-panel">
          <div class="settings-panel__body open" id="settings-body"></div>
        </div>
      </div>
      
      </div>
    </aside>
  </main>

  <!-- Float Messages (appear on top of game board) -->
  <div id="float-messages" class="float-messages"></div>

  <!-- Focus Mode Toggle (only visible during game) -->
  <button id="btn-focus" class="btn-focus" type="button" data-i18n-title="game.focus_title" title="Chế độ tập trung"
    aria-label="Chế độ tập trung (F)" style="display:none;">
    <i class="ph ph-corners-out" style="font-size: 24px;"></i>
  </button>

  <!-- Socket.io CDN -->
  <script src="/vendor/socket.io/socket.io.min.js"></script>
  <!-- Application Scripts via Vite entry point -->
  <script src="js/escape-utils.js?v=106"></script>
  <script src="js/audio-manager.js?v=106"></script>
  <script src="js/profanity-classifier-model.js?v=106"></script>
  <script src="js/profanity-filter.js?v=106"></script>
  <script src="js/action-delegate.js?v=106"></script>
  <script type="module" src="js/room-entry.js?v=106"></script>
</body>

</html>
