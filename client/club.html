<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Some of these pages are served at /u/<x> or /c/<x>: root-relative base keeps css/js/assets working. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Câu lạc bộ</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=193" />
  <link rel="stylesheet" href="css/tokens.css?v=193" />
  <link rel="stylesheet" href="css/platform-shell.css?v=193" />
  <link rel="stylesheet" href="css/platform.css?v=193" />
  <link rel="stylesheet" href="css/settings-panel.css?v=193" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=193">

  <script src="js/ui-mode-preload.js?v=193"></script>
  <script src="js/skin-preload.js?v=193"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <p id="cb-status" class="pnote" role="status"></p>

  <div id="cb-content" hidden>
    <header class="phead">
      <span id="cb-avatar"></span>
      <div>
        <h1><span id="cb-name"></span> <span class="pbadge" id="cb-policy-badge"></span></h1>
        <p class="phead__bio" id="cb-desc"></p>
        <div class="pactions">
          <button type="button" class="pbtn pbtn--primary" id="cb-join"></button>
          <button type="button" class="pbtn" id="cb-leave" data-i18n="clubs.leave" hidden>Rời CLB</button>
          <button type="button" class="pbtn pbtn--ghost" id="cb-delete" data-i18n="clubs.delete" hidden>Xoá CLB</button>
        </div>
        <p id="cb-msg" class="pnote" role="status"></p>
      </div>
      <dl class="pstats" id="cb-stats"></dl>
    </header>

    <div class="psplit">
      <div>
        <h2 class="ph2" data-i18n="clubs.board">Bảng xếp hạng CLB</h2>
        <div id="cb-tabs" class="pchips" role="tablist"></div>
        <div class="ptbl-wrap">
          <table class="ptbl">
            <thead><tr>
              <th scope="col">#</th>
              <th scope="col" data-i18n="rankings.col_player">Người chơi</th>
              <th scope="col" data-i18n="clubs.col_role">Vai trò</th>
              <th scope="col" class="num" data-i18n="rankings.col_rating">Rating</th>
              <th scope="col" id="cb-actions-th"></th>
            </tr></thead>
            <tbody id="cb-body"></tbody>
          </table>
        </div>
      </div>

      <aside>
        <section class="ppanel" style="margin-bottom:20px">
          <h2 class="ph2" data-i18n="profile.members_admin">Ban quản trị</h2>
          <div id="cb-staff" class="prows"></div>
        </section>

        <section class="ppanel" id="cb-manage" hidden>
          <h2 class="ph2" data-i18n="clubs.manage">Quản lý</h2>
          <form id="cb-form" class="pform">
            <label for="cb-desc-input" data-i18n="clubs.desc">Mô tả (tối đa 280 ký tự)</label>
            <textarea id="cb-desc-input" maxlength="280" rows="2"></textarea>
            <label for="cb-policy" id="cb-policy-label" data-i18n="clubs.policy">Chính sách tham gia</label>
            <select id="cb-policy">
              <option value="open" data-i18n="clubs.policy_open">Công khai — ai cũng vào được</option>
              <option value="invite" data-i18n="clubs.policy_invite">Theo lời mời — cần duyệt</option>
            </select>
            <div class="pform__row"><button type="submit" class="pbtn pbtn--primary" data-i18n="profile.save">Lưu</button></div>
          </form>
          <h2 class="ph2 ph2--gap" data-i18n="clubs.pending">Yêu cầu tham gia</h2>
          <div id="cb-pending" class="prows"></div>
        </section>
      </aside>
    </div>
  </div>
</main>

<script src="js/i18n.js?v=193"></script>
<script src="js/ui-mode.js?v=193"></script>
<script src="js/session.js?v=193"></script>
<script src="js/audio-manager.js?v=193"></script>
<script src="js/settings-panel.js?v=193"></script>
<script src="js/platform-shell.js?v=193"></script>
<script src="js/club.js?v=193"></script>
</body>
</html>
