<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Câu lạc bộ</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=180" />
  <link rel="stylesheet" href="css/tokens.css?v=180" />
  <link rel="stylesheet" href="css/profile.css?v=180" />
  <link rel="stylesheet" href="css/rankings.css?v=180" />
  <link rel="stylesheet" href="css/clubs.css?v=180" />
  <link rel="stylesheet" href="css/shell.css?v=180" />
  <link rel="stylesheet" href="css/settings-panel.css?v=180" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=180">

  <script src="js/ui-mode-preload.js?v=180"></script>
  <script src="js/skin-preload.js?v=180"></script>
</head>
<body>

<nav class="topnav" aria-label="Main navigation">
  <a href="index.html" class="topnav__brand" aria-label="Play3CR">
    <img src="assets/brand/logo-mark.svg" alt="" width="28" height="28" class="topnav__logo" />
    <span class="topnav__title">Play3CR</span>
  </a>
  <div class="topnav__right">
    <a href="rankings.html" class="topnav__btn" style="text-decoration:none;" data-i18n-title="lobby.rankings" title="Xếp hạng">
      <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=180#ph-bold-trophy"></use></svg>
      <span class="hide-on-mobile" data-i18n="lobby.rankings">Xếp hạng</span>
    </a>
    <a href="index.html" class="topnav__btn" style="text-decoration:none;" data-i18n-title="nav.lobby" title="Sảnh">
      <svg class="icon" style="font-size: 16px;"><use href="assets/icons/phosphor-sprite.svg?v=180#ph-bold-house"></use></svg>
      <span class="hide-on-mobile" data-i18n="nav.lobby">Sảnh</span>
    </a>
  </div>
</nav>

<main class="profile" role="main">
  <p id="cb-status" class="profile__note" role="status"></p>

  <div id="cb-content" hidden>
    <header class="profile__head">
      <div class="profile__who">
        <h1 id="cb-name"></h1>
        <p class="profile__note" id="cb-meta"></p>
        <p class="profile__bio" id="cb-desc"></p>
      </div>
      <div class="clubs__actions">
        <button type="button" class="profile__btn profile__btn--primary" id="cb-join"></button>
        <button type="button" class="profile__btn" id="cb-leave" data-i18n="clubs.leave" hidden>Rời CLB</button>
        <button type="button" class="profile__btn" id="cb-delete" data-i18n="clubs.delete" hidden>Xoá CLB</button>
      </div>
    </header>
    <p id="cb-msg" class="profile__note" role="status"></p>

    <section class="profile__panel" id="cb-manage" hidden>
      <h2 data-i18n="clubs.manage">Quản lý</h2>
      <form id="cb-form">
        <label for="cb-desc-input" data-i18n="clubs.desc">Mô tả (tối đa 280 ký tự)</label>
        <textarea id="cb-desc-input" maxlength="280" rows="2"></textarea>
        <label for="cb-policy" id="cb-policy-label" data-i18n="clubs.policy">Chính sách tham gia</label>
        <select id="cb-policy">
          <option value="open" data-i18n="clubs.policy_open">Công khai — ai cũng vào được</option>
          <option value="invite" data-i18n="clubs.policy_invite">Theo lời mời — cần duyệt</option>
        </select>
        <button type="submit" class="profile__btn profile__btn--primary" data-i18n="profile.save">Lưu</button>
      </form>
      <h2 class="clubs__sub" data-i18n="clubs.pending">Yêu cầu tham gia</h2>
      <ul id="cb-pending" class="profile__list"></ul>
    </section>

    <section class="profile__panel">
      <h2 data-i18n="clubs.leaderboard">Bảng xếp hạng thành viên</h2>
      <div id="cb-tabs" class="rankings__tabs" role="tablist"></div>
      <div class="rankings__tblwrap">
        <table class="rankings__tbl">
          <thead><tr>
            <th scope="col">#</th>
            <th scope="col" data-i18n="rankings.col_player">Người chơi</th>
            <th scope="col" data-i18n="clubs.col_role">Vai trò</th>
            <th scope="col" class="num" data-i18n="rankings.col_rating">Rating</th>
            <th scope="col" id="cb-actions-th"></th>
          </tr></thead>
          <tbody id="cb-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="js/i18n.js?v=180"></script>
<script src="js/ui-mode.js?v=180"></script>
<script src="js/audio-manager.js?v=180"></script>
<script src="js/settings-panel.js?v=180"></script>
<script src="js/club.js?v=180"></script>
</body>
</html>
