<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play3CR — Phòng chơi (Style 2: Zen Stacked, mockup)</title>
<meta name="description" content="Front-end mockup only — not wired to the server or real data. Room layout Style 2 (Zen Stacked) synced to the Zen Minimal lobby language." />
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
<link rel="stylesheet" href="vendor/fonts/manrope/style.css" />
<link rel="stylesheet" href="vendor/phosphor/regular/style.css" />
<link rel="stylesheet" href="vendor/phosphor/bold/style.css" />
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #1C1C1C;
    --ink-2: #7A7A7A;
    --ink-3: #B8B8B8;
    --line: rgba(28,28,28,0.09);
    --font: 'Manrope', system-ui, sans-serif;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font); font-weight: 400; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .mock-banner { background: var(--ink); color: var(--paper); text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; padding: 8px 12px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 560px; margin: 0 auto; padding: 40px 24px 0; }
  .topbar__brand { display: flex; align-items: center; gap: 10px; }
  .topbar__logo { width: 18px; height: 18px; opacity: 0.8; }
  .topbar__title { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-2); }
  .topbar__right { display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--ink-3); }
  .topbar__right button { background: none; border: none; cursor: pointer; color: var(--ink-2); font-size: 16px; padding: 2px; }

  .page { max-width: 560px; margin: 0 auto; padding: 28px 24px 100px; }

  /* ── Sentence-line player summary ── */
  .match-line { font-size: 13px; color: var(--ink-2); margin-bottom: 24px; text-align: center; }
  .match-line b { color: var(--ink); font-weight: 700; }
  .match-line .timer { color: var(--ink); font-weight: 700; }

  .board-frame { width: 100%; max-width: 480px; margin: 0 auto 28px; aspect-ratio: 1; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .board-placeholder { text-align: center; color: var(--ink-3); }
  .board-placeholder i { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.6; }
  .board-placeholder__text { font-size: 12.5px; font-weight: 500; }

  /* ── Player row under board ── */
  .players-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  .player { display: flex; align-items: center; gap: 10px; }
  .player__mono { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--ink-3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .player--active .player__mono { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .player__name { font-size: 13.5px; font-weight: 600; }
  .player__score { font-size: 12px; color: var(--ink-3); }
  .players-vs { font-size: 10.5px; font-weight: 700; color: var(--ink-3); }

  .tabs { display: flex; justify-content: center; gap: 28px; margin-bottom: 28px; }
  .tab { background: none; border: none; cursor: pointer; font-family: var(--font); font-size: 12.5px; font-weight: 500; color: var(--ink-3); padding: 0; }
  .tab.is-active { color: var(--ink); font-weight: 700; }

  .chat-messages { margin-bottom: 20px; }
  .chat-msg { font-size: 13px; line-height: 1.8; }
  .chat-msg b { color: var(--ink); }
  .chat-msg span { color: var(--ink-2); }

  .chat-input { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
  .chat-input input { flex: 1; border: none; font-family: var(--font); font-size: 13px; background: none; outline: none; }
  .chat-input input::placeholder { color: var(--ink-3); }
  .chat-input button { background: none; border: none; font-family: var(--font); font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="mock-banner">STYLE 2 — Zen Stacked · room mockup, synced to Zen Minimal, not wired to the app</div>

<nav class="topbar">
  <div class="topbar__brand">
    <img src="assets/brand/logo-mark.svg" alt="" class="topbar__logo" />
    <span class="topbar__title">Play3CR · #84213</span>
  </div>
  <div class="topbar__right">
    <button aria-label="Tập trung"><i class="ph ph-corners-out"></i></button>
    <button aria-label="Rời phòng"><i class="ph ph-sign-out"></i></button>
  </div>
</nav>

<div class="page">
  <div class="match-line">Lượt của <b>quangquy</b> · còn <span class="timer">00:42</span></div>

  <div class="board-frame">
    <div class="board-placeholder">
      <i class="ph ph-checkerboard"></i>
      <div class="board-placeholder__text">Chờ người chơi ngồi vào và sẵn sàng...</div>
    </div>
  </div>

  <div class="players-row">
    <div class="player player--active">
      <div class="player__mono">Q</div>
      <div>
        <div class="player__name">quangquy</div>
        <div class="player__score">2T · 1B · 0H</div>
      </div>
    </div>
    <div class="players-vs">VS</div>
    <div class="player" style="flex-direction: row-reverse;">
      <div class="player__mono">H</div>
      <div style="text-align:right;">
        <div class="player__name">hoang_anh</div>
        <div class="player__score">1T · 2B · 0H</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab is-active">Trò chuyện</button>
    <button class="tab">Khán giả</button>
    <button class="tab">Cài đặt</button>
  </div>

  <div class="chat-messages">
    <div class="chat-msg"><b>hoang_anh:</b> <span>gg ván trước :)</span></div>
    <div class="chat-msg"><b>quangquy:</b> <span>chuẩn bị thua tiếp nè</span></div>
    <div class="chat-msg"><b>hoang_anh:</b> <span>thử xem</span></div>
  </div>
  <div class="chat-input">
    <input type="text" placeholder="Nhập tin nhắn..." />
    <button>Gửi</button>
  </div>
</div>
</body>
</html>
