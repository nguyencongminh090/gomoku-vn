<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play3CR — Đăng puzzle</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-mark.svg" />
  <link rel="stylesheet" href="css/main.css?v=b48e027f" />
  <link rel="stylesheet" href="css/tokens.css?v=e359be30" />
  <link rel="stylesheet" href="css/platform-shell.css?v=8156b4c8" />
  <link rel="stylesheet" href="css/platform.css?v=4a4d271a" />
  <link rel="stylesheet" href="css/puzzles.css?v=32ba2e07" />
  <link rel="stylesheet" href="css/settings-panel.css?v=d8ac9246" />
  <link rel="stylesheet" href="vendor/fonts/manrope/style.css?v=1e215c18">

  <script src="js/skin-preload.js?v=b452e3a9"></script>
</head>
<body class="pl">
<div id="pl-shell"></div>

<main class="papp" role="main">
  <p><a href="/puzzles/mine" class="muted small pback"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-arrow-left"></use></svg><span data-i18n="puzzles.mine_back">Puzzle của tôi</span></a></p>
  <div class="pintro"><h1 id="ed-h1" data-i18n="puzzles.editor_h1">Đăng puzzle</h1></div>
  <p id="ed-error" class="pnote" hidden></p>

  <div id="ed-view" class="pz-solve" hidden>
    <div class="pz-solve__board ppanel"><canvas id="ed-canvas"></canvas></div>

    <form id="ed-form" class="pform ppanel pz-editor" autocomplete="off">
      <div class="pchips" id="ed-tools" role="group" data-i18n-aria="puzzles.tool_group" aria-label="Công cụ"></div>
      <p id="ed-count" class="muted small"></p>
      <label for="ed-import" data-i18n="puzzles.import_label">Nhập thế cờ từ văn bản</label>
      <textarea id="ed-import" rows="2" maxlength="2000" placeholder="h8 i9 h10 | wall: a1 a2 | portal: b2 c3"></textarea>
      <button type="button" id="ed-import-btn" class="pbtn pbtn--ghost pbtn--sm"><span data-i18n="puzzles.import_btn">Áp dụng lên bàn</span></button>

      <label for="ed-title" data-i18n="puzzles.f_title">Tiêu đề</label>
      <input id="ed-title" maxlength="60" required />
      <label for="ed-prompt" data-i18n="puzzles.f_prompt">Đề bài</label>
      <textarea id="ed-prompt" rows="2" maxlength="280"></textarea>

      <div class="pform__row">
        <div><label for="ed-rule" data-i18n="puzzles.filter_rule">Luật</label><br><select id="ed-rule"></select></div>
        <div><label for="ed-size" data-i18n="puzzles.f_size">Cỡ bàn</label><br><select id="ed-size"></select></div>
        <div><label for="ed-tomove" data-i18n="puzzles.f_tomove">Bên đi</label><br><select id="ed-tomove"></select></div>
        <div><label for="ed-level" data-i18n="puzzles.f_level">Level đề xuất</label><br><select id="ed-level"></select></div>
      </div>

      <label for="ed-mode" data-i18n="puzzles.f_mode">Kiểu đáp án</label>
      <select id="ed-mode"></select>

      <label data-i18n="puzzles.f_tags">Chủ đề (tối đa 3)</label>
      <div id="ed-tags" class="pchips"></div>

      <label data-i18n="puzzles.f_answers">Đáp án chấp nhận</label>
      <p class="muted small" id="ed-answers-help"></p>
      <div id="ed-answers" class="pz-answers"></div>
      <button type="button" id="ed-add-answer" class="pbtn pbtn--ghost pbtn--sm"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-plus-circle"></use></svg><span data-i18n="puzzles.add_answer">Thêm đáp án</span></button>

      <p id="ed-edit-note" class="pnote" hidden data-i18n="puzzles.edit_requeue">Sửa puzzle sẽ đưa nó về trạng thái chờ duyệt.</p>
      <p id="ed-result" class="pz-result" role="status" hidden></p>
      <div class="pactions"><button type="submit" id="ed-submit" class="pbtn pbtn--primary"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="assets/icons/phosphor-sprite.svg?v=421b7369#ph-regular-paper-plane-tilt"></use></svg><span data-i18n="puzzles.submit">Gửi duyệt</span></button></div>
    </form>
  </div>
</main>

<script src="js/i18n.js?v=a173b527"></script>
<script src="js/ui-mode.js?v=3e1ff171"></script>
<script src="js/session.js?v=7d763f30"></script>
<script src="js/audio-manager.js?v=f0ca2309"></script>
<script src="js/settings-panel.js?v=014127cb"></script>
<script src="js/platform-shell.js?v=86159d16"></script>
<script src="js/coords.js?v=f2d4e6d0"></script>
<script src="js/board.js?v=8a25f014"></script>
<script src="js/puzzle-board.js?v=77e69157"></script>
<script src="js/puzzle-editor.js?v=82c4fe29"></script>
</body>
</html>
