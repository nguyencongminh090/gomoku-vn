<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play3CR — Nền đặc (mockup)</title>
<meta name="description" content="Front-end mockup only. Solid background colour candidates, light and dark." />
<link rel="stylesheet" href="vendor/fonts/nunito/style.css" />
<style>
  :root{--font:'Nunito',system-ui,sans-serif;--page:#f4f3f0;--pink:#1d1c19;--ink:#1d1c19}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f3f0;color:#1d1c19;font:14px/1.45 var(--font);padding:20px}
  h1{font-size:18px;margin-bottom:4px}.sub{color:#5a574f;margin-bottom:18px;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:18px;max-width:1280px;margin:0 auto}
  .opt{border:1px solid rgba(0,0,0,.1);border-radius:14px;overflow:hidden;background:#fff}
  .opt header{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .opt header b{font-size:15px}.opt header span{color:#5a574f;font-size:12px}
  .panes{display:grid;grid-template-columns:1fr 1fr}
  .pane{padding:14px;min-height:250px;background:var(--bg)}
  .card{background:var(--surface);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;color:var(--ink)}
  .card b{display:block;margin-bottom:2px}.card span{color:var(--ink2);font-size:12px}
  .card i{display:inline-block;margin-top:8px;font-style:normal;background:var(--brand);color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700}
  .board{margin-top:12px;width:120px;height:120px;border-radius:6px;background:#d9b377;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.2);background-image:linear-gradient(rgba(60,30,4,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(60,30,4,.5) 1px,transparent 1px);background-size:20px 20px;background-position:10px 10px}
  .st{position:absolute;width:16px;height:16px;border-radius:50%}
  .k{background:#111}.w{background:#f4f2ec;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  .meta{font-size:12px;margin-top:10px;color:var(--ink2)}
  .meta em{font-style:normal;font-weight:700;color:var(--ink)}
  .hex{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<h1>Nền đặc: 8 gam màu, mỗi gam có bản sáng (trái) và tối (phải)</h1>
<p class="sub">Thẻ, chữ và nút giữ nguyên token hiện tại để chỉ so sánh màu nền. Số liệu: độ tương phản chữ chính trên nền, và độ tách của thẻ khỏi nền.</p>
<div class="grid" id="g"></div>
<script>
const C=[
 ['1. Xám ấm (hiện tại)','Trung tính, không lệch màu; đã khớp token.','#ecebe8','#161512','#ffffff','#262421'],
 ['2. Kem giấy','Ấm, gần màu giấy của lá hiện tại.','#f1ebde','#1a1713','#fffdf8','#292520'],
 ['3. Xám xanh (slate)','Lạnh, sạch, hợp trang nhiều dữ liệu.','#e8ecf0','#14171b','#ffffff','#22262c'],
 ['4. Xanh lá nhạt','Ăn theo màu thương hiệu, mềm.','#e6eddc','#131810','#fbfdf6','#232a1d'],
 ['5. Xanh rêu (nỉ bàn)','Gợi nỉ bàn, tối là xanh lục sẫm.','#dde8da','#0f1f19','#f8fcf6','#1b3128'],
 ['6. Gỗ kaya phẳng','Một màu gỗ, không vân, bàn cờ cùng tông nên kém nổi.','#e3cfa6','#2a1f15','#fbf4e4','#3a2b1d'],
 ['7. Trắng tinh / đen dịu','Sáng nhất; tối theo chuẩn #121212 của Material.','#fafaf8','#121212','#ffffff','#1e1e1e'],
 ['8. Xanh đêm','Lạnh hơn, tối là xanh navy, nút xanh lá nổi.','#e6ebf5','#0e1320','#ffffff','#1a2132']
];
const lum=h=>{const n=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*n[0]+.7152*n[1]+.0722*n[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05)).toFixed(1)};
const T={l:{ink:'#2b2926',ink2:'#5f5b52',edge:'rgba(0,0,0,.08)',brand:'#4d7c1f'},d:{ink:'#e8e6e1',ink2:'#a8a49b',edge:'rgba(255,255,255,.07)',brand:'#4f7d1c'}};
function pane(bg,sf,t){const k=T[t];return '<div class="pane" style="--bg:'+bg+';--surface:'+sf+';--ink:'+k.ink+';--ink2:'+k.ink2+';--edge:'+k.edge+';--brand:'+k.brand+'"><div class="card"><b>Chơi nhanh</b><span>Caro 15×15, 10 phút</span><br><i>Tìm trận</i></div><div class="board"><div class="st k" style="left:32px;top:32px"></div><div class="st w" style="left:52px;top:32px"></div><div class="st k" style="left:52px;top:52px"></div><div class="st w" style="left:72px;top:52px"></div></div><p class="meta">Nền <span class="hex">'+bg+'</span><br>Chữ/nền <em>'+cr(k.ink,bg)+':1</em><br>Thẻ/nền <em>'+cr(sf,bg)+':1</em></p></div>'}
document.getElementById('g').innerHTML=C.map(c=>'<div class="opt"><header><b>'+c[0]+'</b><span>'+c[1]+'</span></header><div class="panes">'+pane(c[2],c[4],'l')+pane(c[3],c[5],'d')+'</div></div>').join('');
</script>
</body>
</html>
