<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xếp hạng — 8 hướng</title>
<link rel="stylesheet" href="../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../client/css/tokens.css"><link rel="stylesheet" href="common.css">
<style>h1{margin:28px 0 6px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding-bottom:60px}.c{background:var(--c-surface);border-radius:16px;overflow:hidden}.c img{display:block;width:100%;height:220px;object-fit:cover;object-position:top}.c div{padding:14px 16px}.c b{font-size:18px}.c p{margin:4px 0 0;color:var(--c-ink-2);font-size:14px}.c a{color:var(--c-brand-text);font-weight:800}</style></head><body><main class="wrap"><h1>Trang Xếp hạng — 8 hướng</h1><p class="muted">Mockup tĩnh, dữ liệu mẫu. Mở từng hướng; nút ◐ đổi sáng/tối; thêm ?mode=light.</p><div class="g" id="g"></div></main>
<script>const L=[['rk1-podium','RK1 Bục vinh danh','Top 3 podium, còn lại danh sách gọn; dock hạng của bạn.'],['rk2-mountain','RK2 Leo núi Elo','Các bậc núi theo rating; cờ của bạn cắm ở bậc hiện tại.'],['rk3-board','RK3 Bàn cờ xếp hạng','Top 15 là quân cờ trên bàn, danh sách là bảng ghi nước đi.'],['rk4-scoreboard','RK4 Bảng điện tử','Số lật kiểu split-flap, ticker ai lên/xuống.'],['rk5-honor','RK5 Bảng vàng','Ba tấm biển sơn mài treo trên ảnh bàn gỗ.'],['rk6-slope','RK6 Dốc xếp hạng','Slope chart 7 ngày trước → hôm nay.'],['rk7-gazette','RK7 Báo tuần','Ba tin nổi bật tự sinh từ delta7, rồi tới bảng.'],['rk8-around','RK8 Quanh bạn','Hạng của bạn ở giữa, ai trên/dưới kèm khoảng cách điểm.'],['rk10-race','RK10 Đường đua 7 ngày','Bar-chart race phát lại tuần, ngày chọn được; sparkline 7 ngày trong bảng.'],['rk11-cards','RK11 Thẻ kỳ thủ','Top 10 là thẻ sưu tầm ánh kim nghiêng theo chuột; bậc đổi màu viền.'],['rk12-dongho','RK12 Tranh Đông Hồ','Bảng khoa: Trạng nguyên, Bảng nhãn, Thám hoa in khắc gỗ; giấy điệp, son, chàm.'],['rk17-podium-board','RK17 Bục + Bảng điện tử','RK1 + RK4: bục vinh danh trong bảng LED lật số, mở màn 5s (bỏ qua được, 1 lần/phiên).'],['rk13-brutal','RK13 Sticker Neo-brutal','Viền dày, bóng cứng, số khổng lồ, hàng là tấm vé + nhãn dán từ delta7.']];
g.innerHTML=L.map(([id,t,d])=>`<div class="c"><img src="shots/${id}-dark-1280.png" alt=""><div><b>${t}</b><p>${d}</p><p><a href="mockups/${id}.html">Mở</a> · <a href="shots/${id}-light-1280.png">sáng</a> · <a href="shots/${id}-dark-375.png">phone</a></p></div></div>`).join('')</script></body></html>
