<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK5 Bảng vàng</title>
<link rel="stylesheet" href="../../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../../client/css/tokens.css"><link rel="stylesheet" href="../common.css">
<style>
.hero{position:relative;isolation:isolate;overflow:hidden;color:#fff;text-align:center;padding:48px 0 0}
.hero img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(14,10,6,.8),rgba(14,10,6,.55) 60%,rgba(14,10,6,.9))}
.hero h1{margin:0;font-size:clamp(34px,4vw+10px,64px);font-weight:1000;letter-spacing:.12em;text-transform:uppercase;color:#f3cf6a;text-shadow:0 2px 0 #7a1d12}
.hero .eyebrow{color:#f3cf6a}
.plq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:820px;margin:34px auto 0;align-items:start}
.pq{position:relative;padding:34px 12px 20px;border-radius:6px 6px 24px 24px;background:linear-gradient(#a3281a,#6f160c);box-shadow:inset 0 0 0 3px #d9a521,inset 0 0 0 6px #6f160c,0 16px 30px -10px rgba(0,0,0,.7);transform-origin:50% -30px;animation:sway 5s ease-in-out infinite}
.pq:nth-child(2){margin-top:-18px;padding-bottom:34px;animation-delay:-1.6s}.pq:nth-child(3){animation-delay:-3s}
.pq::before,.pq::after{content:'';position:absolute;top:-34px;width:2px;height:34px;background:#d9a521}.pq::before{left:22%}.pq::after{right:22%}
@keyframes sway{50%{transform:rotate(-1.2deg)}}
.pq .k{font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#f3cf6a}
.pq .nm{margin:8px 0 2px;font-size:clamp(17px,2vw,24px);font-weight:1000;color:#fff3cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pq .rt{font-size:clamp(28px,3.4vw,46px);font-weight:1000;color:#f3cf6a;line-height:1.1}.pq .dl{color:#ffd9a8}
.pq .av{box-shadow:0 0 0 3px #d9a521;margin-bottom:6px}
.wood{height:40px}
.hall{margin:0 auto;max-width:820px;padding:8px 0 80px}
.f{margin:20px 0}
.eng{display:grid;grid-template-columns:48px 1fr auto 56px;gap:12px;align-items:center;min-height:56px;padding:0 16px;border-bottom:1px solid rgba(217,165,33,.25);background:linear-gradient(90deg,rgba(111,22,12,.18),transparent)}
.eng .k{font-weight:1000;color:#f3cf6a;font-size:20px}.eng .n{font-weight:900;letter-spacing:.02em}.eng .n small{display:block;font-weight:600;color:var(--c-ink-2);font-size:12px}.eng .r{font-weight:1000;font-size:20px}
.eng.me{box-shadow:inset 3px 0 0 #f3cf6a;background:rgba(217,165,33,.16)}
@media(max-width:600px){.plq{gap:8px}.pq{padding-inline:6px}.pq .av{--s:44px!important}.eng{grid-template-columns:36px 1fr auto}.eng .dl{display:none}}
</style></head><body>
<section class="hero"><div class="wrap"><p class="eyebrow">Mùa này · Tự do</p><h1>Bảng vàng</h1><div class="plq" id="pq"></div><div class="wood"></div></div><img src="../img/wood.jpg" alt=""></section>
<main class="wrap hall"><div class="filters f" id="f"></div><div id="h"></div><p class="note">Ảnh: Pixabay 3339748 (ghi nguồn trong trang thật). Có scrim tối để chữ đạt AA.</p></main>
<script src="../data.js"></script><script>RK.top();RK.chrome(f);const P=RK.players;
pq.innerHTML=[1,0,2].map(i=>{const p=P[i];return `<div class="pq">${RK.av(p,64)}<div class="k">Hạng ${i+1}</div><div class="nm">${p.name}</div><div class="rt num">${p.rating}</div>${RK.dl(p)}</div>`}).join('');
h.innerHTML=P.slice(3).map(p=>`<div class="eng"><span class="k num">${p.rank}</span><span class="n">${p.name}<small>${p.club||p.city}</small></span><span class="r num">${p.rating}</span>${RK.dl(p)}</div>`).join('')+`<div class="eng me"><span class="k">47</span><span class="n">Bạn<small>còn 64 điểm để lên hạng 46</small></span><span class="r num">${RK.me.rating}</span>${RK.dl(RK.me)}</div>`;</script></body></html>
