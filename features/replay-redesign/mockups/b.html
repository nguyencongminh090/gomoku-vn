<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><base href="/"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mockup B — Ba cột + bottom sheet</title>
<link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/platform.css"><link rel="stylesheet" href="css/platform-shell.css"><link rel="stylesheet" href="css/settings-panel.css">
<link rel="stylesheet" href="vendor/fonts/nunito/style.css"><link rel="stylesheet" href="features/replay-redesign/mockups/mock.css">
<script src="js/skin-preload.js"></script></head>
<body class="pl rp-page vb" data-variant="b">
<script src="features/replay-redesign/mockups/extra-icons.js"></script>
<div id="pl-shell"></div>
<main class="rp" role="main">
  <section class="rp-info ppanel rp-desk-only" aria-label="Thông tin ván"><a href="#" class="pback muted small"><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-arrow-left"></use></svg><span>Quay lại</span></a><div class="rp-players"><div id="rp-black" class="rp-player"></div><div id="rp-white" class="rp-player"></div></div><p id="rp-result" class="rp-result"></p><div id="rp-meta" class="rp-meta"></div><div class="rp-opts"><button type="button" class="rp-tbtn rp-share" title="Sao chép liên kết tới nước này"><svg class="icon" aria-hidden="true"><use href="#ph-regular-link"></use></svg><span>Chia sẻ</span></button><button type="button" class="rp-switch" role="switch" aria-checked="true" title="Phân tích (A)"><span class="rp-switch__track" aria-hidden="true"><span class="rp-switch__thumb"></span></span><span>Phân tích</span></button></div><details class="rp-report"><summary><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-flag"></use></svg><span>Báo gian lận</span></summary><p class="muted small">(form hiện tại giữ nguyên: chọn người, lý do, Gửi)</p></details></section>
  <div class="rp-bar rp-phone-only"><div class="rp-players"><div data-m="black" class="rp-player"></div><div data-m="white" class="rp-player"></div></div></div>
  <div id="rp-board" class="rp-board"><canvas id="rp-canvas"></canvas></div>
  <div class="rp-ctrl ppanel"><div class="rp-range"><div class="rp-track"><input id="rp-slider" type="range" min="0" value="0" aria-label="Dòng thời gian ván"><div id="rp-ticks" class="rp-ticks" aria-hidden="true"></div></div><span id="rp-counter" class="rp-counter" aria-live="off"></span></div><div class="rp-btns rp-dock" role="group" aria-label="Điều khiển phát lại">
  <button id="rp-first" class="rp-ib" type="button" aria-label="Nước đầu (Home)"><svg class="icon" aria-hidden="true"><use href="#ph-regular-skip-back"></use></svg></button>
  <button id="rp-prev" class="rp-ib" type="button" aria-label="Lùi 1 nước (←)"><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-caret-left"></use></svg></button>
  <button id="rp-play" class="rp-ib rp-ib--play" type="button" aria-label="Tự động phát (Space)"><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-play"></use></svg></button>
  <button id="rp-next" class="rp-ib" type="button" aria-label="Tiến 1 nước (→)"><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-caret-right"></use></svg></button>
  <button id="rp-last" class="rp-ib" type="button" aria-label="Nước cuối (End)"><svg class="icon" aria-hidden="true"><use href="#ph-regular-skip-forward"></use></svg></button></div><div class="rp-opts"><div class="pseg rp-speed" role="group" aria-label="Tốc độ phát"><button type="button" class="pseg__opt" data-speed="1200" aria-pressed="false">0.5×</button><button type="button" class="pseg__opt is-active" data-speed="600" aria-pressed="true">1×</button><button type="button" class="pseg__opt" data-speed="300" aria-pressed="false">2×</button></div><span class="rp-phone-only"><button type="button" class="rp-tbtn rp-share" title="Sao chép liên kết tới nước này"><svg class="icon" aria-hidden="true"><use href="#ph-regular-link"></use></svg><span>Chia sẻ</span></button></span></div></div>
  <div class="rp-sheet">
    <button id="rp-sheet-toggle" class="rp-sheet__bar" type="button" aria-expanded="false"><span id="rp-peek"></span><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-caret-down"></use></svg></button>
    <section class="rp-panel ppanel" aria-label="Nước đi">
      <h2 class="rp-h">Nước đi</h2>
      <div id="rp-moves" class="rp-moves"></div>
      <div class="rp-opts"><button id="rp-del" type="button" class="rp-tbtn rp-tbtn--danger" title="Xoá nhánh (Delete)"><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-trash"></use></svg><span>Xoá nhánh</span></button></div>
      <div class="rp-info rp-phone-only"><div class="rp-players"><div data-m="black" class="rp-player"></div><div data-m="white" class="rp-player"></div></div><p data-m="result" class="rp-result"></p><div data-m="meta" class="rp-meta"></div><details class="rp-report"><summary><svg class="icon" aria-hidden="true"><use href="/assets/icons/phosphor-sprite.svg#ph-regular-flag"></use></svg><span>Báo gian lận</span></summary><p class="muted small">(form hiện tại giữ nguyên: chọn người, lý do, Gửi)</p></details></div>
    </section>
  </div>
</main><p id="rp-toast" class="rp-toast" role="status" hidden></p>
<span class="mock-tag">Mockup B · Ba cột + bottom sheet</span>
<script src="js/i18n.js"></script><script src="js/ui-mode.js"></script><script src="js/audio-manager.js"></script><script src="js/settings-panel.js"></script>
<script src="js/session.js"></script><script src="js/platform-shell.js"></script><script src="js/board.js"></script><script src="js/move-tree.js"></script>
<script src="js/escape-utils.js"></script><script src="js/tree-view.js"></script>
<script src="features/replay-redesign/mockups/fixture.js"></script><script src="features/replay-redesign/mockups/mock.js"></script>
</body></html>
