<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đồng hồ bàn chơi — mockups</title>
<style>
:root{--c-bg:#fafaf8;--c-surface:#fff;--c-surface-2:#f4f3f0;--c-fill:#e9e7e2;--c-border:#dedbd4;--c-ink:#2b2926;--c-ink-2:#5f5b52;--c-brand:#4d7c1f;--c-on-brand:#fff;--c-brand-light:rgba(77,124,31,.12);--c-error:#c62828;--board:#fbf8f1;--grid:#c9d3e3;--x:#d32f2f;--o:#1e5fbf;--radius:10px;--radius-lg:16px}
:root[data-theme=dark]{--c-bg:#121212;--c-surface:#1e1e1e;--c-surface-2:#282828;--c-fill:#2e2e2e;--c-border:#383838;--c-ink:#e8e6e1;--c-ink-2:#a8a49b;--c-brand:#4f7d1c;--c-brand-light:rgba(98,153,36,.16);--c-error:#e05555;--board:#1c1c1a;--grid:#3a3f48;--x:#ef6b6b;--o:#6aa2ff}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:#8a8778;color:var(--c-ink)}
#gallery{display:flex;gap:28px;padding:24px;align-items:flex-start;width:max-content}
.col{display:flex;flex-direction:column;gap:10px;width:390px}
.cap{min-height:78px;color:#fff;font-weight:800;font-size:18px}.cap small{display:block;font-weight:600;font-size:13px;opacity:.9;line-height:1.35}
.phone{position:relative;width:390px;height:var(--h,844px);background:var(--c-bg);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.nav{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--c-surface);border-bottom:1px solid var(--c-border);font-weight:900;font-size:20px}
.nav .code{margin-left:auto;font-size:15px;font-weight:700}.nav .tag{font-size:13px;font-weight:800;background:var(--c-brand-light);color:var(--c-brand);padding:4px 8px;border-radius:8px}
.board{flex:none;width:390px;height:390px;background:var(--board);display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(17,1fr);border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);position:relative}
.board i{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:17px;line-height:1}
.board i.x{color:var(--x)}.board i.o{color:var(--o)}.board i.last{background:rgba(211,47,47,.14)}
/* seat card (current) */
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;background:var(--c-surface);border:2px solid var(--c-border);border-radius:var(--radius-lg);margin:6px 8px}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-surface-2);font-size:13px;font-weight:800}
.av.me{background:var(--c-brand);color:#fff}
.av b{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:6px;background:var(--c-surface);display:grid;place-items:center;font-size:13px;border:1px solid var(--c-border)}
.av b.x{color:var(--x)}.av b.o{color:var(--o)}
.nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{display:block;font-size:12px;color:var(--c-ink-2);font-weight:700}
.clk{font-variant-numeric:tabular-nums;font-weight:800;font-size:30px;line-height:1.15;padding:3px 12px;border-radius:var(--radius);background:var(--c-fill);color:var(--c-ink-2);min-width:104px;text-align:center}
.on .clk,.clk.on{background:var(--c-brand);color:#fff}.seat.on{border-color:var(--c-brand)}
.low .clk,.clk.low{background:var(--c-error);color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 8px}
.acts span{background:var(--c-surface);border-radius:12px;padding:8px 0;text-align:center;font-size:13px;font-weight:700;border:1px solid var(--c-border)}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:8px 10px}
.chat p{align-self:flex-start;background:var(--c-surface);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--c-ink-2)}.chat p b{color:var(--c-ink)}
.dock{flex:none;display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--c-border);background:var(--c-surface)}
.dock .in{flex:1;border:2px solid var(--c-border);border-radius:999px;padding:9px 14px;color:var(--c-ink-2);font-size:15px}
.dock .rb{width:44px;height:44px;border-radius:50%;border:2px solid var(--c-border);display:grid;place-items:center}
/* K1 scoreboard bar */
.sb{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px}
.sb .s{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;background:var(--c-surface);border:2px solid var(--c-border);min-width:0}
.sb .s.r{flex-direction:row-reverse;text-align:right}
.sb .s .nm{flex:1;min-width:0;font-size:13px}
.sb .s .t{font-variant-numeric:tabular-nums;font-weight:900;font-size:26px}
.sb .s.on{background:var(--c-brand);border-color:var(--c-brand);color:#fff}.sb .s.on small{color:#e6f0d8}
.sb .av{width:32px;height:32px;font-size:11px}
.mine{display:flex;align-items:center;gap:10px;padding:4px 14px;font-size:13px;color:var(--c-ink-2);font-weight:700}
/* K2 board-edge bars */
.pill{align-self:center;display:flex;gap:4px;margin:8px 0 6px;background:var(--c-surface);border:2px solid var(--c-border);border-radius:999px;padding:3px}
.pill span{font-variant-numeric:tabular-nums;font-weight:900;font-size:24px;padding:2px 14px;border-radius:999px;color:var(--c-ink-2);display:flex;gap:6px;align-items:center}
.pill span em{font-style:normal;font-size:16px}.pill span.on{background:var(--c-brand);color:#fff}
.edge{height:8px;background:var(--c-fill);position:relative;flex:none}.edge::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c-ink-2);opacity:.55}
.edge.on::after{background:var(--c-brand);opacity:1}
.seatmini{display:flex;align-items:center;gap:10px;padding:6px 14px}.seatmini .nm{flex:1}
/* K4 side-by-side seats */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.duo .c{background:var(--c-surface);border:2px solid var(--c-border);border-radius:var(--radius-lg);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.duo .row{display:flex;align-items:center;gap:8px;min-width:0}.duo .row .nm{flex:1;min-width:0;font-size:14px}
.duo .c .clk{font-size:34px;min-width:0}.duo .c.on{border-color:var(--c-brand)}
.vs{font-size:12px;font-weight:800;color:var(--c-ink-2);text-align:center;margin-top:-4px}
/* hand overlay */
.hand{position:absolute;pointer-events:none;display:none;inset:0}
body.showhand .hand{display:block}
.note{position:absolute;right:10px;bottom:70px;background:#111c;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;display:none}
body.showhand .note{display:block}
</style></head><body>
<div id="gallery"></div>
<script>
const q=new URLSearchParams(location.search);if(q.get('theme')==='dark')document.documentElement.dataset.theme='dark';
if(q.get('hand'))document.body.classList.add('showhand');
const H=+(q.get('h')||844);
const stones={'8,7':'x','8,8':'x','9,8':'o','10,8':'x','9,9':'o','11,8':'x','10,9':'o','11,10':'o','7,6':'x'};
function board(){let s='<div class="board">';for(let r=0;r<17;r++)for(let c=0;c<17;c++){const k=r+','+c,v=stones[k];s+=`<i class="${v||''}${k==='11,10'?' last':''}">${v==='x'?'✕':v==='o'?'○':''}</i>`}return s+'</div>'}
const nav='<div class="nav">Play3CR<span class="code">#5UX</span><span class="tag">Giao hữu</span></div>';
const acts='<div class="acts"><span>↶ Lùi</span><span>⧗ Xin time</span><span>🤝 Cầu hoà</span><span>⚑ Đầu hàng</span></div>';
const chat='<div class="chat"><p><b>guest8326</b> H8 đẹp quá</p><p><b>guest5054</b> chặn J10 ngay</p></div>';
const dock='<div class="dock"><span class="in">Bình luận…</span><span class="rb">👏</span><span class="rb">☰</span></div>';
// thumb: right hand (default) or left
const thumb=(side='r')=>{const x=side==='r'?390:0,rot=side==='r'?-38:38;return `<svg class="hand" viewBox="0 0 390 ${H}" preserveAspectRatio="none"><g transform="translate(${x} ${H-40}) rotate(${rot})"><ellipse cx="0" cy="-150" rx="58" ry="190" fill="#c58d6b" fill-opacity=".72"/><ellipse cx="0" cy="-300" rx="40" ry="46" fill="#b07a5a" fill-opacity=".8"/></g></svg>`};
const V=[
 {id:'K0',t:'Hiện tại',s:'Đồng hồ của tôi ở góc dưới-phải, nằm đúng dưới ngón cái tay phải khi chạm bàn cờ phần dưới.',
  h:nav+`<div class="seat"><div class="av">GU<b class="x">✕</b></div><div class="nm">guest7703<small>● online</small></div><div class="clk">1:00</div></div>`+board()+`<div class="seat on"><div class="av me">GU<b class="o">○</b></div><div class="nm">guest1309<small>● online</small></div><div class="clk">0:58</div></div>`+acts+chat+dock,hand:'r'},
 {id:'K1',t:'Bảng tỉ số trên',s:'Cả hai đồng hồ trong một thanh ngay dưới header, xa vùng tay. Thẻ của tôi ở dưới bỏ đi, bàn cờ cao thêm ~56px.',
  h:nav+`<div class="sb"><div class="s"><div class="av">GU<b class="x">✕</b></div><div class="nm">guest7703<small>Đối thủ</small></div><div class="t">1:00</div></div><div class="s r on"><div class="av me">GU<b class="o">○</b></div><div class="nm">guest1309<small>Bạn</small></div><div class="t">0:58</div></div></div>`+board()+acts+chat+dock,hand:'r'},
 {id:'K2',t:'Thanh viền bàn',s:'Hai số ở 1 viên thuốc giữa trên cùng + thanh thời gian chạy dọc mép trên/dưới bàn cờ: tay che số vẫn thấy thanh rút ngắn.',
  h:nav+`<div class="pill"><span>✕ 1:00</span><span class="on">○ 0:58</span></div><div class="seatmini"><div class="av">GU<b class="x">✕</b></div><div class="nm">guest7703</div></div><div class="edge" style="--w:100%"></div>`+board()+`<div class="edge on" style="--w:62%"></div><div class="seatmini"><div class="av me">GU<b class="o">○</b></div><div class="nm">guest1309 <small>Bạn</small></div></div>`+acts+chat+dock,hand:'r'},
 {id:'K3',t:'Theo tay thuận',s:'Giữ bố cục cũ; đồng hồ của tôi sang phía đối diện tay cầm (Cài đặt › Tay thuận: Phải/Trái). Hình: người thuận tay phải → số ở trái.',
  h:nav+`<div class="seat"><div class="av">GU<b class="x">✕</b></div><div class="nm">guest7703<small>● online</small></div><div class="clk">1:00</div></div>`+board()+`<div class="seat on" style="grid-template-columns:auto 1fr auto"><div class="clk">0:58</div><div class="nm" style="text-align:right">guest1309<small>● online</small></div><div class="av me">GU<b class="o">○</b></div></div>`+acts+chat+dock,hand:'r'},
 {id:'K4',t:'Hai ghế cạnh nhau',s:'Hai thẻ người chơi cạnh nhau phía trên, số to 34px dưới tên. Ai đến lượt: viền + nền xanh. Không gì cần đọc ở nửa dưới.',
  h:nav+`<div class="duo"><div class="c"><div class="row"><div class="av">GU<b class="x">✕</b></div><div class="nm">guest7703</div></div><div class="clk">1:00</div></div><div class="c on"><div class="row"><div class="av me">GU<b class="o">○</b></div><div class="nm">guest1309<small>Bạn</small></div></div><div class="clk on">0:58</div></div></div>`+board()+acts+chat+dock,hand:'r'},
];
document.getElementById('gallery').innerHTML=V.map(v=>`<div class="col"><div class="cap">${v.id} · ${v.t}<small>${v.s}</small></div><div class="phone" style="--h:${H}px">${v.h}${thumb(v.hand)}<span class="note">tay phải</span></div></div>`).join('');
</script></body></html>
