<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ — 7 hướng</title>
<link rel="stylesheet" href="../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../client/css/tokens.css"><link rel="stylesheet" href="common.css">
<style>h1{margin:28px 0 6px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:18px 0 60px}.c{background:var(--c-surface);border-radius:16px;overflow:hidden}.sh{display:grid;grid-template-columns:3fr 1fr;gap:2px;height:240px;background:var(--c-bg)}.sh img{display:block;width:100%;height:240px;object-fit:cover;object-position:top}.c div.b{padding:14px 16px}.c b{font-size:18px}.c p{margin:4px 0 8px;color:var(--c-ink-2);font-size:14px}.c .l{display:flex;flex-wrap:wrap;gap:6px 14px}.c a{color:var(--c-brand-text);font-weight:800}</style></head><body><main class="wrap"><h1>Trang Hồ sơ — 7 hướng</h1><p class="muted">Mockup tĩnh, dữ liệu mẫu. Trên thanh trên của mỗi mockup: "Đang xem…" đổi hồ sơ người khác ↔ hồ sơ của mình, ◐ đổi sáng/tối. Nhãn <span class="need">API</span> = cần dữ liệu server chưa có (thêm <code>&amp;need=off</code> để ẩn).</p><div class="g" id="g"></div></main>
<script>const L=[['pf1-poster','PF1 Áp phích','An toàn. Một dải hero (ai + con số rating lớn), dải chỉ số, rồi tab Tổng quan / Ván đấu / Thành tích / Hội nhóm. Điện thoại: thanh hành động dính đáy.'],['pf2-bento','PF2 Bento','Lưới ô: 2 ô lớn (danh tính, rating + biểu đồ), ô nhỏ mỗi ô một con số, lịch hoạt động. Lịch sử ván vẫn là danh sách.'],['pf3-scoresheet','PF3 Sổ kỳ phổ','"Bàn cờ giấy": một trang sổ ô li, phiếu kỳ thủ, dấu son cho huy hiệu, biên bản ván đấu kẻ tay.'],['pf4-gallery','PF4 Phòng trưng bày','Mỗi ván là một bàn cờ thu nhỏ; ván đáng nhớ phóng to; danh tính nằm cột trái dính.'],['pf5-versus','PF5 Đối đầu','Xem người khác = so kè Họ ↔ Bạn, tỉ số đối đầu, cơ hội thắng, nút Thách đấu lớn. Xem mình = mục tiêu tiếp theo.'],['pf6-journey','PF6 Hành trình','Đường rating là con đường, mốc đánh số; bên dưới là dòng thời gian huy hiệu, đỉnh, chuỗi thắng, nhóm ván theo tuần.'],['pf7-cv','PF7 Sơ yếu kỳ thủ (CV)','Một tờ CV: cột trái đảo màu (ảnh, liên hệ, "kỹ năng" = rating, hội nhóm), cột phải là Giới thiệu, Số liệu, Quá trình thi đấu, Thành tích, bảng ván gần đây.']];
g.innerHTML=L.map(x=>`<div class="c"><a class="sh" href="mockups/${x[0]}.html"><img src="shots/${x[0]}-dark-1280.png" alt=""><img src="shots/${x[0]}-dark-375-fold.png" alt=""></a><div class="b"><b>${x[1]}</b><p>${x[2]}</p><div class="l"><a href="mockups/${x[0]}.html">Người khác</a><a href="mockups/${x[0]}.html?view=self">Của mình</a><a href="mockups/${x[0]}.html?mode=light">Sáng</a></div></div></div>`).join('')</script></body></html>
