<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PF3 Sổ kỳ phổ</title>
<link rel="stylesheet" href="../../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../../client/css/tokens.css"><link rel="stylesheet" href="../common.css">
<style>
/* PF3 — the profile is a page of a paper score book ("bàn cờ giấy"): squared paper, a filled-in player form,
   red seals for badges, a hand-ruled ledger of games. Handmade only in paper, headings and seals; buttons stay clean. */
:root{--pp:#211e18;--pp-2:#2a261f;--pp-ink:#ece4d0;--pp-ink-2:#b5ab92;--pp-rule:rgba(236,228,208,.10);--pp-line:rgba(236,228,208,.34);--son:#ff8f7a;--son-bg:rgba(255,143,122,.08);--margin:rgba(255,143,122,.45);--shadow:rgba(0,0,0,.5)}
:root[data-mode=light]{--pp:#f7f0dd;--pp-2:#efe6cd;--pp-ink:#231f18;--pp-ink-2:#655b47;--pp-rule:rgba(60,45,20,.13);--pp-line:rgba(35,31,24,.5);--son:#b3261e;--son-bg:rgba(179,38,30,.06);--margin:rgba(179,38,30,.4);--shadow:rgba(60,45,20,.25)}
.sheet{position:relative;max-width:1000px;margin:28px auto 0;padding:36px 44px 40px 76px;color:var(--pp-ink);background-color:var(--pp);border-radius:4px;box-shadow:0 18px 40px -18px var(--shadow),8px 8px 0 -2px var(--pp-2);
  background-image:linear-gradient(var(--pp-rule) 1px,transparent 1px),linear-gradient(90deg,var(--pp-rule) 1px,transparent 1px);background-size:24px 24px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:56px;width:2px;background:var(--margin)}
.sheet::after{content:"";position:absolute;left:20px;top:60px;bottom:60px;width:16px;background:radial-gradient(circle,var(--c-bg) 6px,transparent 7px) 0 0/16px 96px repeat-y}
.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:3px double var(--pp-line)}
.title h1{font-size:15px;font-weight:900;letter-spacing:.32em;text-transform:uppercase}
.title span{font-weight:800;color:var(--pp-ink-2);font-size:14px}
.id{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
.photo{padding:8px 8px 10px;background:var(--pp-2);box-shadow:0 0 0 1px var(--pp-line);transform:rotate(-2deg)}
.photo .av{border-radius:2px}
.photo small{display:block;text-align:center;margin-top:6px;font-weight:800;color:var(--pp-ink-2);font-size:12px}
.name{font-size:clamp(34px,3.4vw + 10px,58px);font-weight:1000;letter-spacing:-.02em;line-height:1.05}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;margin-top:14px;max-width:370px}
.f{border-bottom:1px solid var(--pp-line);padding-bottom:3px}
.f dt{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pp-ink-2)}
.f dd{margin:0;font-weight:800;font-size:17px}
.bio{margin-top:16px;font-size:18px;font-style:italic;max-width:54ch;line-height:1.5}
.sheet .acts{margin-top:20px}
.sheet .btn{box-shadow:inset 0 0 0 1.5px var(--pp-line)}.sheet .btn--pri{box-shadow:none}
.seals{position:absolute;right:0;top:-6px;display:flex;gap:10px}
.seal{width:98px;height:98px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:10px;color:var(--son);background:var(--son-bg);
  box-shadow:inset 0 0 0 3px currentColor,inset 0 0 0 6px var(--pp),inset 0 0 0 7px currentColor;font-size:11px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;animation:pop var(--d-base) var(--e-out) backwards}
.seal:nth-child(1){transform:rotate(-9deg);animation-delay:500ms}.seal:nth-child(2){transform:rotate(6deg);animation-delay:620ms}.seal:nth-child(3){transform:rotate(-4deg);animation-delay:740ms}
.seal .ico{width:22px;height:22px}
.h2{display:flex;align-items:baseline;gap:12px;margin:34px 0 10px;font-size:13px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}
.h2::after{content:"";flex:1;border-bottom:1px solid var(--pp-line)}
.h2 small{letter-spacing:0;text-transform:none;font-weight:700;color:var(--pp-ink-2);order:2}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pp-ink-2);text-align:left;padding:6px 8px;border-bottom:2px solid var(--pp-line)}
td{padding:0 8px;height:48px;border-bottom:1px solid var(--pp-line);font-weight:700}
td.r,th.r{text-align:right}td.big{font-size:22px;font-weight:1000}
td .ell{display:block;max-width:100%}
.led td:first-child{color:var(--pp-ink-2);width:36px}
.led tr{transition:background var(--d-fast)}.led tbody tr:hover{background:var(--son-bg)}
.led .o{max-width:0;width:40%}
.kq{font-weight:1000}.kq.win{color:var(--c-success)}.kq.loss{color:var(--son)}
.tally{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.tally div b{display:block;font-size:34px;font-weight:1000;line-height:1}.tally div span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pp-ink-2)}
.sheet .ch-l{stroke:var(--pp-ink);stroke-width:2}.sheet .ch-a{fill:none}.sheet .ch-p{fill:var(--pp);stroke:var(--son)}.sheet .ch-t{fill:var(--pp-ink-2)}.sheet .ch-g{stroke:var(--pp-line);stroke-dasharray:3 4}
.sheet .wdl{margin-top:14px;height:8px;border-radius:0}
.foot{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;margin-top:14px}
.clubs{display:flex;flex-wrap:wrap;gap:10px 22px}.clubs a{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:800}.clubs small{display:block;font-weight:600;color:var(--pp-ink-2)}
@media(max-width:860px){
  .sheet{margin:12px 8px 0;padding:20px 14px 24px 30px;box-shadow:0 10px 24px -14px var(--shadow)}
  .sheet::before{left:20px}.sheet::after{display:none}
  .title h1{font-size:12px;letter-spacing:.2em}
  .id{grid-template-columns:auto minmax(0,1fr);gap:14px;margin-top:16px}
  .photo .av{--s:76px!important}.photo small{display:none}
  .fields{grid-template-columns:1fr 1fr;gap:10px 14px;grid-column:1/-1;margin-top:0;max-width:none}
  .idr{display:contents}.name{align-self:center}
  .bio,.sheet .acts,.seals{grid-column:1/-1;margin-top:0}
  .bio{font-size:16px}
  .seals{position:static;order:5;justify-content:flex-start}.seal{width:82px;height:82px;font-size:10px}
  .sheet .acts .btn--pri{flex:1 1 100%}.sheet .acts .btn{flex:1}
  .two{grid-template-columns:minmax(0,1fr);gap:0}
  .led .x,.led td:first-child,.led th:first-child{display:none}.led .o{width:100%}.sheet td,.sheet th{padding-inline:5px}
  .tally{gap:16px}.tally div b{font-size:26px}
}
</style></head><body>
<main><article class="sheet rise" id="s"></article></main>
<p class="mk-note">PF3 · "Bàn cờ giấy": hồ sơ là một trang sổ ghi kỳ phổ. Dấu son = huy hiệu. Bảng ván đấu là sổ cái (danh sách cùng loại nên giữ dạng bảng). <span class="need">API</span> = cần dữ liệu mới.</p>
<script src="../icons.js"></script><script src="../data.js"></script><script>
const {P,G,RES,ic,av,dl,need,wdl,actions,chart,series}=PF;PF.top();const m=P.ratings[0];
s.innerHTML=`<header class="title"><h1>Phiếu kỳ thủ</h1><span class="num">Hạng #${m.rank} · ${m.k}</span></header>
<section class="id">
  <div class="photo">${av(P,132)}<small>@${P.user}</small></div>
  <div class="idr"><h2 class="name ell">${P.name}</h2>
    <dl class="fields"><div class="f"><dt>Quê quán</dt><dd class="ell">${P.city}</dd></div><div class="f"><dt>Gia nhập</dt><dd class="num">${P.joined}</dd></div><div class="f"><dt>Số ván</dt><dd class="num">${P.stats.g}</dd></div></dl>
    <p class="bio">“${P.bio}”</p><div class="acts">${actions()}</div></div>
  <div class="seals">${P.badges.map(b=>`<div class="seal">${ic(b.i)}<span>${b.t}</span></div>`).join('')}</div>
</section>
<div class="two"><div>
  <h3 class="h2">Bảng điểm</h3>
  <table><thead><tr><th>Thể loại</th><th class="r">Rating</th><th class="r">Hạng</th><th class="r">7 ngày</th></tr></thead><tbody>
  ${P.ratings.map(r=>`<tr><td>${r.k}</td><td class="r big">${r.r}${r.prov?'?':''}</td><td class="r">${r.rank?'#'+r.rank:'—'}</td><td class="r">${dl(r.d)}</td></tr>`).join('')}</tbody></table>
  <h3 class="h2">Tổng kết</h3>
  <div class="tally"><div><b class="num">${P.pct}%</b><span>Thắng</span></div><div><b class="num">${P.stats.d}</b><span>Hoà</span></div><div><b class="num">${P.streak.cur}</b><span>Chuỗi thắng</span></div><div><b class="num">${P.streak.best}</b><span>Cao nhất</span></div><div><b class="num">${P.puzzles.solved}</b><span>Puzzle · ${P.puzzles.level}</span></div></div>
  ${wdl()}
</div><div>
  <h3 class="h2">Đồ thị rating <small>${m.k} · 90 ngày</small></h3>
  ${chart(series(m),{axis:1,peak:1,h:230})}
  <div class="chips" role="tablist" style="margin-top:10px">${P.ratings.map((r,i)=>`<button class="chip" role="tab" aria-selected="${!i}">${r.k}</button>`).join('')}</div>
</div></div>
<h3 class="h2">Biên bản ván đấu <small>${P.stats.g} ván</small></h3>
<table class="led"><thead><tr><th>Số</th><th>Ngày</th><th>Đối thủ</th><th class="x">Luật ${need()}</th><th class="x r">Nước</th><th>Kết quả</th><th class="r">± ${need()}</th><th class="x"></th></tr></thead><tbody>
${G.slice(0,10).map((g,i)=>`<tr><td>${P.stats.g-i}</td><td>${g.date}</td><td class="o"><span class="ell">${g.opp}</span></td><td class="x">${g.rule}</td><td class="x r">${g.moves}</td><td><span class="kq ${g.res}">${RES[g.res][1]}</span></td><td class="r">${dl(g.delta)}</td><td class="x r"><a style="font-weight:800;text-decoration:underline">Xem lại</a></td></tr>`).join('')}</tbody></table>
<div class="foot"><button class="btn">${ic('caret-down')}Xem thêm</button><div class="clubs">${P.clubs.map(c=>`<a>${av(c,36,'av--sq')}<span>${c.name}<small>${c.role}</small></span></a>`).join('')}</div></div>`;
PF.tabs();
</script></body></html>
