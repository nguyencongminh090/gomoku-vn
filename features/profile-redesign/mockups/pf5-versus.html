<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PF5 Đối đầu</title>
<link rel="stylesheet" href="../../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../../client/css/tokens.css"><link rel="stylesheet" href="../common.css">
<style>
/* PF5 — the page answers the visitor's real question: "should I challenge this player?"
   Other's profile = tale of the tape (them vs you). Own profile = next goals. */
:root{--you:#5aa9e6;--you-bg:rgba(90,169,230,.16)}
:root[data-mode=light]{--you:#1d5f96;--you-bg:rgba(29,95,150,.10)}
.tape{position:relative;margin-top:24px;background:var(--c-surface);border-radius:24px;padding:28px 28px 24px;overflow:hidden}
.tape::before{content:"";position:absolute;inset:0 50% 0 0;background:linear-gradient(90deg,var(--c-brand-light),transparent);pointer-events:none}
.tape::after{content:"";position:absolute;inset:0 0 0 50%;background:linear-gradient(270deg,var(--you-bg),transparent);pointer-events:none}
.tape>*{position:relative;z-index:1}
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center}
.pl{display:flex;gap:16px;align-items:center;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:right}
.pl h1,.pl h2{font-size:clamp(24px,2vw + 10px,38px);font-weight:1000;line-height:1.1;letter-spacing:-.02em}
.pl .meta{color:var(--c-ink-2);font-size:14px;font-weight:700}
.pl>div{min-width:0}
.pl.l .av{box-shadow:0 0 0 4px var(--c-brand-text)}.pl.r .av{box-shadow:0 0 0 4px var(--you)}
.mid{text-align:center}
.mid .sc{font-size:clamp(44px,4vw + 14px,76px);font-weight:1000;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.mid .sc i{font-style:normal;color:var(--c-ink-2);font-weight:700;margin:0 .12em}
.mid .form{justify-content:center;margin-top:8px}
.rows{margin:26px auto 0;max-width:820px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 128px minmax(0,1fr) 64px;gap:12px;align-items:center}
.row b{font-size:20px;font-weight:1000}.row b.r{text-align:right}
.row .k{text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-2)}
.tr{height:12px;border-radius:99px;background:var(--c-fill);overflow:hidden;display:flex}
.tr.l{justify-content:flex-end}
.tr i{display:block;height:100%;border-radius:99px;animation:wipe var(--d-slow) var(--e-out) backwards;animation-delay:calc(200ms + var(--i)*60ms)}
.tr.l i{background:var(--c-brand-text)}.tr.r i{background:var(--you)}
.win{font-weight:1000}
.cta{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center;margin-top:26px}
.cta .btn--pri{min-height:56px;padding:0 34px;font-size:18px}
.cta p{color:var(--c-ink-2);font-weight:700}
.cta p b{color:var(--c-ink)}
/* own profile */
.mine{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}
.goal{padding:16px;border-radius:16px;background:var(--c-bg);display:flex;flex-direction:column;gap:8px}
.goal b{font-size:18px;font-weight:900}.goal small{color:var(--c-ink-2);font-weight:700}
.prog{height:10px;border-radius:99px;background:var(--c-fill);overflow:hidden}.prog i{display:block;height:100%;background:var(--c-brand-text);border-radius:99px;animation:wipe var(--d-slow) var(--e-out) backwards}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:20px}
.pn{background:var(--c-surface);border-radius:20px;padding:20px}.pn+.pn{margin-top:20px}
.pn h2{font-size:18px;font-weight:900;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.gm{display:grid;grid-template-columns:24px 28px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:52px;border-top:1px solid var(--c-border-light)}
.gm:first-of-type{border-top:0}.gm .o{font-weight:800}.gm small{display:block;color:var(--c-ink-2);font-weight:600;font-size:12px}.gm .d{color:var(--c-ink-2);font-size:13px}
.info{display:flex;flex-direction:column;gap:12px}
.club{display:flex;gap:10px;align-items:center;font-weight:800;min-height:44px}.club small{display:block;font-weight:600;color:var(--c-ink-2)}
.cap{margin-top:8px;color:var(--c-ink-2);font-size:13px}
@media(max-width:860px){
  .tape{margin:12px -8px 0;padding:18px 14px;border-radius:20px}
  .duo{gap:8px}.pl,.pl.r{flex-direction:column;text-align:center;gap:8px}.pl .av{--s:64px!important}
  .pl h1,.pl h2{font-size:18px}.pl .meta{font-size:12px}.pl .bio-s{display:none}
  .mid .sc{font-size:40px}.mid .rs{width:18px;height:18px;font-size:10px;border-radius:5px}
  .rows{gap:14px;margin-top:20px}
  .row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px}
  .row b{order:1}.row .k{order:2;font-size:11px}.row b.r{order:3}
  .row .tr.l{order:4;grid-column:1}.row .tr.r{order:5;grid-column:3}
  .tr{height:8px}
  .cta .btn--pri{width:100%}
  .mine{grid-template-columns:auto minmax(0,1fr)}.mine .acts{grid-column:1/-1}.mine .acts .btn{flex:1}
  .goals,.cols{grid-template-columns:minmax(0,1fr)}
  .gm{grid-template-columns:24px 28px minmax(0,1fr) auto}.gm .d{display:none}
}
</style></head><body>
<main class="wrap">
 <section class="tape rise if-other" id="tape"></section>
 <section class="tape rise if-self" id="own"></section>
 <div class="cols"><div id="colA"></div><div id="colB"></div></div>
</main>
<p class="mk-note">PF5 · Xem người khác: so kè Họ ↔ Bạn + tỉ số đối đầu <span class="need">API</span>; cơ hội thắng tính từ rating (không cần API). Xem hồ sơ mình: bảng "Mục tiêu tiếp theo". Bấm "Đang xem…" trên thanh trên để đổi.</p>
<script src="../icons.js"></script><script src="../data.js"></script><script>
const {P,ME,G,H2H,ic,av,dl,need,res,badges,actions,chart,series}=PF;PF.top();const m=P.ratings[0];
const exp=Math.round(100/(1+Math.pow(10,(m.r-ME.ratings.freestyle)/400)));
const rows=[...P.ratings.map(r=>[r.k,r.r,ME.ratings[r.id],1300,2200]),['Tỉ lệ thắng',P.pct,ME.pct,0,100,'%'],['Chuỗi thắng',P.streak.cur,ME.streak,0,12],['Puzzle',P.puzzles.solved,ME.puzzles,0,100]];
const w=(v,lo,hi)=>Math.max(6,Math.min(100,(v-lo)/(hi-lo)*100));
tape.innerHTML=`<div class="duo">
  <div class="pl l">${av(P,104)}<div><h1 class="ell">${P.name}</h1><p class="meta ell">@${P.user} · ${P.city}</p><p class="meta bio-s">Tham gia ${P.joined}</p></div></div>
  <div class="mid"><span class="eyebrow">Đối đầu ${need()}</span><div class="sc num">${H2H.them}<i>–</i>${H2H.me}</div><span class="form" role="img" aria-label="5 ván đối đầu gần nhất, theo phía bạn">${H2H.last.map(x=>res(x)).join('')}</span></div>
  <div class="pl r">${av(ME,104)}<div><h2 class="ell">Bạn</h2><p class="meta ell">${ME.name}</p><p class="meta bio-s">${ME.g} ván</p></div></div></div>
 <div class="rows">${rows.map((r,i)=>`<div class="row" style="--i:${i}"><b class="num${r[1]>=r[2]?' win':''}">${r[1]}${r[5]||''}</b><div class="tr l"><i style="width:${w(r[1],r[3],r[4])}%"></i></div><span class="k">${r[0]}</span><div class="tr r"><i style="width:${w(r[2],r[3],r[4])}%"></i></div><b class="num r${r[2]>r[1]?' win':''}">${r[2]}${r[5]||''}</b></div>`).join('')}</div>
 <div class="cta"><button class="btn btn--pri">${ic('sword','ico--lg')}Thách đấu ${P.name}</button><button class="btn">${ic('chat-circle')}Nhắn tin</button><button class="btn">${ic('user-plus')}Kết bạn</button>
  <p style="flex-basis:100%;text-align:center">Cơ hội thắng của bạn ở ${m.k}: <b class="num">${exp}%</b> · thắng được <b class="num">+26</b> điểm ${need()}</p></div>`;
own.innerHTML=`<div class="mine">${av(P,104)}<div style="min-width:0"><h1 class="ell" style="font-size:clamp(26px,2vw + 12px,40px);font-weight:1000">${P.name}</h1><p class="muted" style="font-weight:700">@${P.user} · ${PF.where} · từ ${P.joined}</p><p style="margin-top:6px">${P.bio}</p></div><div class="acts">${actions()}</div></div>
 <div class="goals">
  <div class="goal"><span class="eyebrow">Mục tiêu · ${m.k}</span><b>Lên hạng #2</b><div class="prog"><i style="width:72%"></i></div><small class="num">${m.r} / 2087 · còn 276 điểm ${need()}</small></div>
  <div class="goal"><span class="eyebrow">Huy hiệu kế tiếp</span><b>1000 thắng xếp hạng</b><div class="prog"><i style="width:17.8%"></i></div><small class="num">${P.stats.w} / 1000 ${need()}</small></div>
  <div class="goal"><span class="eyebrow">Puzzle</span><b>Lên level ${P.puzzles.next}</b><div class="prog"><i style="width:60%"></i></div><small class="num">${P.puzzles.have} / ${P.puzzles.need} puzzle cùng level</small></div>
 </div>`;
const row=g=>`<a class="gm">${res(g)}${av(g,28)}<span class="o ell">${g.opp}<small>${g.rule} · ${g.moves} nước</small></span><span class="d num">${g.date}</span>${dl(g.delta)}</a>`;
const flip={win:'loss',loss:'win',draw:'draw'};
colA.innerHTML=`<div class="pn rise if-other" style="--i:2"><h2>Các ván giữa hai bạn ${need()}</h2>${[8,3,5,1].map(i=>{const r=flip[G[i].res],g={...G[i],opp:'Bạn '+PF.RES[r][1].toLowerCase(),name:ME.name,h:ME.h,res:r,delta:0};return row(g).replace('<span class="dl">—</span>','<span class="pill">Xem lại</span>')}).join('')}<p class="cap">Kết quả tính theo phía bạn.</p></div>
 <div class="pn rise" style="--i:3"><h2><span>Ván gần đây <span class="if-other">của ${P.name}</span></span>${PF.form(8)}</h2>${G.slice(0,6).map(row).join('')}<p style="margin-top:12px"><button class="btn">Xem cả ${P.stats.g} ván</button></p></div>`;
colB.innerHTML=`<div class="pn rise" style="--i:2"><h2>Rating · ${m.k}${dl(m.d,' / 7 ngày')}</h2>${chart(series(m),{axis:1,peak:1,h:210})}<div class="chips" role="tablist" style="margin-top:10px">${P.ratings.map((r,i)=>`<button class="chip" role="tab" aria-selected="${!i}">${r.k} <span class="num">${r.r}${r.prov?'?':''}</span></button>`).join('')}</div></div>
 <div class="pn rise info" style="--i:3"><h2 style="margin:0">Về ${P.name}</h2><p class="if-other">${P.bio}</p><div class="chips">${badges()}</div>${P.clubs.map(c=>`<a class="club">${av(c,36,'av--sq')}<span>${c.name}<small>${c.role} · ${c.n} thành viên</small></span></a>`).join('')}</div>`;
PF.tabs();
</script></body></html>
