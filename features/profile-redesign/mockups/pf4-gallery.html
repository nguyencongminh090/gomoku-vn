<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PF4 Phòng trưng bày</title>
<link rel="stylesheet" href="../../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../../client/css/tokens.css"><link rel="stylesheet" href="../common.css">
<style>
/* PF4 — a player is their games: the page is a gallery of final positions. Identity lives in a sticky side card
   (desktop) / compact header (phone). Each board opens the replay. */
.lay{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
.side{position:sticky;top:76px;background:var(--c-surface);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.side .top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.side h1{font-size:26px;font-weight:1000;max-width:100%}
.side .meta{color:var(--c-ink-2);font-size:14px;font-weight:700}
.side .bio{font-size:15px;text-align:center}
.side .acts{flex-direction:column}.side .acts .btn{width:100%}
.side .chips{justify-content:center}
.rt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--c-border-light)}
.rt b{font-size:22px;font-weight:1000}.rt small{color:var(--c-ink-2);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px;padding-top:14px;border-top:1px solid var(--c-border-light)}
.kv b{display:block;font-size:22px;font-weight:1000}.kv span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink-2)}
.club{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:800}.club small{display:block;font-weight:600;color:var(--c-ink-2)}
.feat{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:center;background:var(--c-surface);border-radius:20px;padding:22px}
.feat h2{font-size:clamp(26px,2vw + 12px,38px);font-weight:1000;line-height:1.1;letter-spacing:-.02em;margin:6px 0 10px}
.feat p{color:var(--c-ink-2);max-width:44ch}
.feat .vs{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0;font-weight:800}
.feat .bd{box-shadow:0 14px 30px -14px var(--c-scrim)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:28px 0 14px}
.bar h2{font-size:20px;font-weight:900}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{position:relative;display:block;background:var(--c-surface);border-radius:16px;padding:10px 10px 12px;animation:rise var(--d-slow) var(--e-out) backwards;animation-delay:calc(var(--i)*50ms)}
.card .rs{position:absolute;left:16px;top:16px;width:30px;height:30px;font-size:14px;box-shadow:0 0 0 3px var(--c-surface)}
.card .o{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:800}
.card .m{display:flex;justify-content:space-between;margin-top:2px;color:var(--c-ink-2);font-size:13px;font-weight:700}
@media(hover:hover) and (pointer:fine){.card{transition:transform var(--d-base) var(--e-out),box-shadow var(--d-base)}.card:hover{transform:translateY(-4px);box-shadow:0 14px 26px -14px var(--c-scrim)}}
.mhead{display:none}
@media(max-width:860px){
  .lay{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:0}
  .side{position:static;border-radius:0 0 20px 20px;margin-inline:-16px;padding:16px;gap:12px}
  .side .top{flex-direction:row;text-align:left;gap:14px}.side .top .av{--s:64px!important}
  .side .top>div{min-width:0}.side h1{font-size:22px}
  .side .bio{text-align:left}.side .chips{justify-content:flex-start}
  .side .acts{flex-direction:row}.side .acts .btn{width:auto;flex:1}.side .acts .btn--pri{flex:1 1 100%}
  .rts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rt{grid-template-columns:1fr;gap:0;padding:10px;border:0;border-radius:12px;background:var(--c-fill);text-align:center}.rt .dl{display:none}
  .side .clubs{display:none}
  .feat{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:8px 8px 10px}.card .rs{left:12px;top:12px}.card .o .av,.card .rl{display:none}.rt small{display:block}
}
</style></head><body>
<main class="wrap"><div class="lay"><aside class="side rise" id="side"></aside><div id="mainc"></div></div></main>
<p class="mk-note">PF4 · Mỗi ván là một bàn cờ thu nhỏ (thế cờ cuối, đường 5 thắng tô màu). Cần API trả thế cờ cuối cho danh sách ván <span class="need">API</span>. Bản thật dùng SVG bàn cờ của sảnh, không đụng BoardRenderer.</p>
<script src="../icons.js"></script><script src="../data.js"></script><script>
const {P,G,RES,ic,av,dl,need,res,badges,actions,board}=PF;PF.top();const best=G[0];
side.innerHTML=`<div class="top">${av(P,112)}<div><h1 class="ell">${P.name}</h1><p class="meta">@${P.user}</p><p class="meta">${PF.where} · từ ${P.joined}</p></div></div>
 <p class="bio">${P.bio}</p><div class="chips">${badges()}</div><div class="acts">${actions()}</div>
 <div class="rts">${P.ratings.map(r=>`<div class="rt"><span>${r.k} <small>${r.rank?'#'+r.rank:'tạm tính'}</small></span><b class="num">${r.r}${r.prov?'?':''}</b>${dl(r.d)}</div>`).join('')}</div>
 <div class="kv"><div><b class="num">${P.stats.g}</b><span>Ván</span></div><div><b class="num">${P.pct}%</b><span>Thắng</span></div><div><b class="num">${P.streak.cur}</b><span>Chuỗi</span></div></div>
 <div class="clubs">${P.clubs.map(c=>`<a class="club">${av(c,36,'av--sq')}<span class="ell">${c.name}<small>${c.role}</small></span></a>`).join('')}</div>`;
mainc.innerHTML=`<section class="feat rise" style="--i:1"><a aria-label="Xem lại ván">${board(best)}</a><div><span class="eyebrow">Ván đáng nhớ ${need()}</span>
  <h2>Hạ ${best.opp} sau ${best.moves} nước</h2><p>Chiến thắng trước đối thủ rating cao nhất trong 90 ngày qua — cầm đen, ${best.rule}.</p>
  <div class="vs">${av(P,32)}<span>${P.name}</span><span class="muted">thắng</span>${av(best,32)}<span class="ell">${best.opp} <span class="muted num">${best.oppR}</span></span></div>
  <a class="btn btn--ink">${ic('play')}Xem lại ván</a></div></section>
 <div class="bar"><h2>Ván đấu <span class="muted num">· ${P.stats.g}</span></h2><div class="chips" role="tablist">${['Tất cả','Thắng','Thua','Luật 1','Standard','Luật 2'].map((c,i)=>`<button class="chip" role="tab" aria-selected="${!i}">${c}</button>`).join('')}</div></div>
 <div class="gal">${G.map((g,i)=>`<a class="card" style="--i:${i}" aria-label="${RES[g.res][1]} trước ${g.opp}, ${g.date}">${board(g)}${res(g)}<div class="o">${av(g,24)}<span class="ell">${g.opp}</span></div><div class="m"><span><span class="rl">${g.rule} · </span>${g.moves} nước</span><span class="num">${g.date}</span></div></a>`).join('')}</div>
 <p style="margin-top:18px;text-align:center"><button class="btn">${ic('caret-down')}Xem thêm</button></p>`;
PF.tabs();
</script></body></html>
