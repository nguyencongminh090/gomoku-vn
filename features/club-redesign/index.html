<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hội nhóm — 6 hướng</title>
<link rel="stylesheet" href="../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../client/css/tokens.css"><link rel="stylesheet" href="common.css">
<style>h1{margin:28px 0 6px;font-size:32px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;padding:18px 0 60px}.c{background:var(--c-surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card)}.sh{display:grid;grid-template-columns:3fr 1fr;gap:2px;height:250px;background:var(--c-bg)}.sh img{display:block;width:100%;height:250px;object-fit:cover;object-position:top}.c div.b{padding:14px 16px}.c b{font-size:18px}.c p{margin:4px 0 8px;color:var(--c-ink-2);font-size:14px}.c .l{display:flex;flex-wrap:wrap;gap:6px 14px}.c .l a{color:var(--c-brand-text);font-weight:800}</style></head><body><main class="wrap"><h1>Trang Hội nhóm — 6 hướng</h1><p class="muted">Mockup tĩnh, dữ liệu mẫu theo đúng trường của API. Trên thanh trên mỗi mockup: Trang nhóm ↔ Khám phá, vai Khách / Thành viên / Quản lý, nút sáng/tối. Nhãn <span class="need">API</span> = dữ liệu server chưa có (thêm <code>?need=off</code> để ẩn).</p><div class="g" id="g"></div></main>
<script>const L=[
['cl1-san-nha','CL1 Sân nhà','An toàn. Ảnh bìa + huy hiệu, dải 4 con số, thông báo ghim, tab dính. Tổng quan: bục top tuần, bảng rating, lịch, giải đang đấu, ban quản trị. Khám phá: lưới thẻ có ảnh bìa.'],
['cl2-bang-tin','CL2 Bảng tin','Bảng gỗ bần của hội quán: mọi khối là một tờ giấy dó ghim lệch. Lịch là vé xé, bảng tuần là sổ ghi vạch, thành viên là ảnh polaroid. Khám phá: tường tờ rơi có mẩu xé ở chân để tham gia.'],
['cl3-doi-hinh','CL3 Đội hình','Nhóm chính là một bàn cờ: mỗi thành viên là một quân, người mạnh nhất ở tâm, xoáy ra ngoài theo rating. Bấm quân để xem thẻ người đó. Khám phá: mỗi nhóm là một bàn 9×9, bàn càng kín nhóm càng đông.'],
['cl4-hoi-quan','CL4 Hội quán','Nhóm là nơi để ở lại: cột nhóm của tôi, kênh, giữa là trò chuyện xen thẻ hệ thống (ván đang đấu, kết quả, sự kiện), phải là thành viên theo trạng thái. Khách thấy bản xem trước mờ + thẻ mời vào.'],
['cl5-co-hieu','CL5 Cờ hiệu','Áp phích: màu riêng của nhóm phủ đầu trang, ký hiệu nhóm cỡ khổng lồ, cờ đuôi nheo. Phần dưới kiểu Swiss: con số lớn, danh sách đội đánh số. Khám phá: Bảng hội nhóm, top 3 là khối màu.'],
['cl6-mua-giai','CL6 Mùa giải','Trang câu lạc bộ thể thao: đếm ngược buổi tiếp theo + "Tôi sẽ đến", lịch và kết quả (cả đối kháng giữa nhóm), bảng tuần có phong độ, đội hình áo số, kình địch, tủ cúp. Khám phá: "Tìm nhóm hợp với bạn" có % độ hợp.']];
g.innerHTML=L.map(x=>`<div class="c"><a class="sh" href="mockups/${x[0]}.html"><img src="shots/${x[0]}-club-dark-1280.png" alt=""><img src="shots/${x[0]}-club-dark-375-fold.png" alt=""></a><div class="b"><b>${x[1]}</b><p>${x[2]}</p><div class="l"><a href="mockups/${x[0]}.html">Trang nhóm</a><a href="mockups/${x[0]}.html?as=staff">Quản lý</a><a href="mockups/${x[0]}.html?as=visitor&mode=light">Khách, sáng</a><a href="mockups/${x[0]}.html?page=discover">Khám phá</a></div></div></div>`).join('')</script></body></html>
