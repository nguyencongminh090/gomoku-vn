<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Desktop Stage</title>
<style>
/* Tokens copied from client/css/tokens.css (light + dark) — mockup only */
:root{
  --c-bg:#ecebe8;--c-surface:#fff;--c-surface-2:#f4f3f0;--c-border:rgba(0,0,0,.12);
  --c-ink:#2b2926;--c-ink-2:#5f5b52;--c-ink-3:#66625a;
  --c-brand:#4d7c1f;--c-brand-text:#3d6418;--c-brand-light:rgba(77,124,31,.10);--c-on-brand:#fff;
  --c-accent:#a63d00;--c-accent-light:rgba(194,71,0,.10);
  --c-fill:rgba(0,0,0,.05);--board-bg:#faf7ee;--grid:#c9d3e6;--lab:#555;
  --x:#d32f2f;--o:#1e5fd0;
  --radius:5px;--radius-lg:8px;--radius-xl:12px;
  --shadow-pop:0 8px 28px rgba(0,0,0,.18);--ease-out:cubic-bezier(.2,.8,.2,1);
  --page:#cfcdc8;
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;color:var(--c-ink);
}
:root[data-theme="dark"]{
  --c-bg:#161512;--c-surface:#262421;--c-surface-2:#2f2d29;--c-border:rgba(255,255,255,.10);
  --c-ink:#e8e6e1;--c-ink-2:#a8a49b;--c-ink-3:#9a968c;
  --c-brand:#4f7d1c;--c-brand-text:#8bc34a;--c-brand-light:rgba(98,153,36,.16);
  --c-accent:#ee6a20;--c-accent-light:rgba(238,106,32,.16);
  --c-fill:rgba(255,255,255,.06);--shadow-pop:0 8px 28px rgba(0,0,0,.6);
  --board-bg:#2b2a26;--grid:#46474f;--lab:#9a968c;--x:#ef5350;--o:#64a0ff;--page:#0d0c0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--c-ink)}
button{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--c-surface);border-bottom:1px solid var(--c-border)}
.top h1{font-size:16px;margin:0}.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--c-border);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c-brand);color:var(--c-on-brand)}
.intro{max-width:1200px;margin:12px auto 0;padding:0 16px;font-size:14px;line-height:1.55;color:var(--c-ink-2)}
.intro b{color:var(--c-ink)}
.wrap{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fit{width:100%;max-width:calc(var(--sw)*1px);}
.fit-inner{width:calc(var(--sw)*1px);height:calc(var(--sh)*1px);transform-origin:top left}
.notes{max-width:1100px;font-size:13.5px;line-height:1.55;color:var(--c-ink-2);padding-left:20px;margin:6px 0 30px}
.notes b{color:var(--c-ink)}

/* ---------- screen ---------- */
.screen{width:100%;height:100%;background:var(--c-bg);display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate;box-shadow:0 18px 40px rgba(0,0,0,.25);border-radius:6px}
.nav{height:56px;flex:none;display:flex;align-items:center;gap:26px;padding:0 24px;background:var(--c-surface);border-bottom:1px solid var(--c-border);font-size:16px}
.nav .brand{font-size:22px;font-weight:600}.nav .brand b{color:var(--c-brand);font-weight:600}
.nav a{color:var(--c-ink-2)}.nav .sp{flex:1}
.nav .badge-m{font-size:13px;font-weight:700;background:var(--c-brand-light);color:var(--c-brand-text);padding:5px 10px;border-radius:6px}
.screen.narrow .nav a{display:none}
.body{flex:1;min-height:0;display:grid;gap:14px;padding:14px}
.boardbox{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.board{width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:block}

/* seat card */
.seat{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--c-surface-2);border:2px solid transparent;border-radius:var(--radius-xl)}
.seat.turn{border-color:var(--c-brand)}
.seat .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .mt{font-size:12.5px;color:var(--c-ink-3)}
.seat .clk{font-size:32px;font-weight:800;padding:2px 12px;border-radius:var(--radius-lg);background:var(--c-fill);color:var(--c-ink-2);font-variant-numeric:tabular-nums}
.seat.turn .clk{background:var(--c-brand);color:var(--c-on-brand)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;position:relative;flex:none}
.av .pc{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:6px;background:var(--c-surface);display:grid;place-items:center;font-size:13px;font-weight:900;border:1px solid var(--c-border)}
.pcx{color:var(--x)}.pco{color:var(--o)}

/* controls */
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{min-height:52px;border:0;border-radius:var(--radius-lg);background:var(--c-surface-2);color:var(--c-ink-2);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.act i{font-style:normal;font-size:16px}

/* pill tabs */
.tabs{display:flex;gap:4px;flex:none}
.tabs button{flex:1;border:0;border-radius:999px;padding:7px 0;background:var(--c-fill);font-size:13px;font-weight:700;color:var(--c-ink-2);cursor:pointer;position:relative}
.tabs button.on{background:var(--c-brand);color:var(--c-on-brand)}
.tabs .gear{flex:0 0 36px}
.tbody{flex:1;min-height:0;overflow:auto;padding:4px 4px 0}

/* dock */
.dock{flex:none;display:flex;align-items:center;gap:8px}
.input{flex:1;min-width:0;height:40px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface);display:flex;align-items:center;padding:0 14px;color:var(--c-ink-3);font-size:14px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--c-border);background:var(--c-surface);flex:none;font-size:17px;display:grid;place-items:center;cursor:pointer}

/* audience stack + popover */
.stack{display:flex;align-items:center;cursor:pointer;flex:none;border:0;background:none;padding:0;position:relative}
.stack .av{width:28px;height:28px;font-size:10.5px;border:2px solid var(--c-surface-2);margin-left:-9px}
.stack .av:first-child{margin-left:0}
.stack .more{width:28px;height:28px;border-radius:50%;margin-left:-9px;background:var(--c-surface);border:2px solid var(--c-surface-2);font-size:10.5px;font-weight:800;display:grid;place-items:center;color:var(--c-ink-2)}
.stack .live{position:absolute;left:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#e53935;border:2px solid var(--c-surface);z-index:2}
.stack-lbl{font-size:13px;color:var(--c-ink-2);font-weight:700;margin-left:8px}
.aud-pop{position:absolute;z-index:30;width:280px;padding:12px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-pop);display:none}
.screen[data-aud="1"] .aud-pop{display:block;animation:pop 180ms var(--ease-out) both}
.aud-pop h4{margin:0 0 8px;font-size:13px}
.aud-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px}
.aud-grid div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--c-ink-2)}
.aud-grid .av{width:34px;height:34px}

/* chat */
.msg{display:flex;gap:7px;align-items:flex-end;margin:7px 0;max-width:90%}
.msg .av{width:26px;height:26px;font-size:10px}
.msg .bub{padding:6px 11px;border-radius:14px 14px 14px 4px;background:var(--c-surface);font-size:14px;line-height:1.35}
.msg .who{display:block;font-size:11.5px;font-weight:800;color:var(--c-ink-3)}
.msg.pl .who::after{content:" · người chơi";font-weight:600}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{background:var(--c-brand);color:#fff;border-radius:14px 14px 4px 14px}
.msg.sys{max-width:100%;justify-content:center;font-size:12.5px;color:var(--c-ink-3);font-style:italic}

/* score */
.score-hero{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 0 10px}
.score-hero .num{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:2px}
.score-hero .p{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c-fill);border:1px solid var(--c-border)}
.dot.l{background:#d64545;border-color:#d64545}.dot.m{background:var(--c-brand);border-color:var(--c-brand)}
.games{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.games td{padding:7px 4px;border-top:1px solid var(--c-border)}
.games .w{font-weight:800;color:var(--c-brand-text)}
.mvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.mvgrid span{padding:3px 6px;border-radius:4px}
.mvgrid span.cur{background:var(--c-brand-light);color:var(--c-brand-text);font-weight:800}
.mvgrid em{font-style:normal;color:var(--c-ink-3);margin-right:4px}
.set-row{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--c-border);font-size:14px}
.set-row b{font-weight:700}

/* stage overlays on the board */
.fly{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:46%;pointer-events:none;z-index:5}
.fly .c{display:flex;gap:7px;align-items:center;padding:4px 12px 4px 4px;border-radius:999px;background:color-mix(in srgb,var(--c-surface) 90%,transparent);font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.16);animation:rise 360ms var(--ease-out) both}
.fly .c:nth-child(1){opacity:.5}.fly .c:nth-child(2){opacity:.8}
.fly .c .av{width:24px;height:24px;font-size:9.5px}
.fly .c b{font-weight:800;margin-right:3px}
.reacts{position:absolute;right:10px;bottom:0;width:70px;height:60%;pointer-events:none;z-index:5}
.reacts span{position:absolute;bottom:-10px;left:20px;font-size:26px;opacity:0}
.screen[data-burst="1"] .reacts span{animation:floatup 1.9s var(--ease-out) forwards}
.reacts span:nth-child(2){left:36px;animation-delay:.15s!important}.reacts span:nth-child(3){left:8px;animation-delay:.3s!important}.reacts span:nth-child(4){left:44px;animation-delay:.5s!important}.reacts span:nth-child(5){left:14px;animation-delay:.7s!important}
@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-240px) translateX(-10px) scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}
.speech{position:absolute;z-index:6;max-width:260px;padding:8px 13px;border-radius:14px;background:var(--c-surface);box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14.5px;line-height:1.35;pointer-events:none;animation:pop 300ms var(--ease-out) both;white-space:nowrap}
.speech::before{content:"";position:absolute;width:12px;height:12px;background:inherit;transform:rotate(45deg)}
.speech.me{background:var(--c-brand);color:#fff;display:none}
.screen[data-mine="1"] .speech.me{display:block}

/* ===== A: Live panel (2 columns, rail right) ===== */
.A .body{grid-template-columns:minmax(0,1fr) 380px;padding-right:0}
.A.narrow .body{grid-template-columns:minmax(0,1fr) 330px}
.A .rail{background:var(--c-surface);border-left:1px solid var(--c-border);margin:-14px 0;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative}
.A .panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:var(--c-surface-2);border-radius:var(--radius-xl);padding:10px}
.A .dock{padding-top:2px}
.A .speech.opp{right:24px;top:150px}
.A[data-tab="chat"] .fly{display:none}
.A .speech.opp::before{top:-5px;right:40px}
.A .speech.me{right:24px;bottom:84px}
.A .speech.me::before{bottom:-5px;right:40px}
.A .aud-pop{right:30px;bottom:200px}
.A .toggle{position:absolute;left:-21px;top:calc(50% - 40px);width:20px;height:80px;background:var(--c-surface);border:1px solid var(--c-border);border-right:0;border-radius:8px 0 0 8px;display:grid;place-items:center;color:var(--c-ink-3);font-size:12px}

/* ===== B: Stage (3 columns) ===== */
.B .body{grid-template-columns:270px minmax(0,1fr) 330px}
.B.narrow .body{grid-template-columns:230px minmax(0,1fr) 280px;gap:10px}
.B .left,.B .right{min-height:0;display:flex;flex-direction:column;gap:10px;position:relative}
.B .left .seat{background:var(--c-surface)}
.B .left .seat{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
.B .left .seat .clk{grid-column:1/-1;text-align:center;font-size:36px}
.B .scorecard{flex:1;min-height:0;background:var(--c-surface);border-radius:var(--radius-xl);padding:10px 12px;overflow:auto;cursor:pointer}
.B .scorecard h5{margin:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink-3)}
.B .scorecard .score-hero{padding:4px 0 6px}.B .scorecard .score-hero .num{font-size:34px}
.B .scorecard .games{font-size:12.5px}
.B.narrow .scorecard .games td:nth-child(4){display:none}
.B .ctrls{grid-template-columns:repeat(2,1fr)}
.B .ctrls .act{min-height:44px;flex-direction:row;gap:6px}
.B .right{background:var(--c-surface);border-radius:var(--radius-xl);padding:10px}
.B .audbar{display:flex;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--c-border)}
.B .audbar .sp{flex:1}
.B .audbar .stack .av,.B .audbar .stack .more{border-color:var(--c-surface)}
.B .right .tbody{background:var(--c-surface-2);border-radius:var(--radius-lg);padding:4px 8px}
.B .right .input{background:var(--c-surface-2)}
.B .speech.opp{left:calc(270px - 30px);top:96px}
.B.narrow .speech.opp{left:calc(230px - 40px)}
.B .speech.opp::before{left:-5px;top:13px}
.B .speech.me{left:calc(270px - 30px);bottom:200px}
.B.narrow .speech.me{left:calc(230px - 40px)}
.B .speech.me::before{left:-5px;bottom:13px}
.B .aud-pop{right:24px;top:118px}
.B .tbody .msg:not(.me) .bub{background:var(--c-surface)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="top">
  <h1>Bàn chơi · Desktop — 2 hướng theo Live stage (#368)</h1><span class="sp"></span>
  <div class="seg" id="dir"><button data-v="A" aria-pressed="true">A · Panel sống</button><button data-v="B" aria-pressed="false">B · Sân khấu</button></div>
  <div class="seg" id="size"><button data-v="1440x900" aria-pressed="true">1440×900</button><button data-v="1024x700" aria-pressed="false">1024×700</button></div>
  <div class="seg" id="theme"><button data-v="light" aria-pressed="true">Sáng</button><button data-v="dark" aria-pressed="false">Tối</button></div>
  <div class="seg" id="state"></div>
</div>
<p class="intro" id="intro"></p>
<div class="wrap"><div class="fit" id="fit"><div class="fit-inner" id="fitIn"></div></div><ul class="notes" id="notes"></ul></div>

<script>
const PEOPLE={long:{n:'Hoàng Long',i:'HL',c:'#b5542c'},minh:{n:'Minh',i:'M',c:'#4d7c1f'},thu:{n:'Thu',i:'T',c:'#7b4bb7'},bao:{n:'Bảo',i:'B',c:'#1f6fb2'},an:{n:'An',i:'A',c:'#c2185b'},khoa:{n:'Khoa',i:'K',c:'#00897b'},vy:{n:'Vy',i:'V',c:'#ef6c00'},duc:{n:'Đức',i:'Đ',c:'#5d4037'}};
const AUD=['thu','bao','an','khoa','vy','duc'];
const CHAT=[{w:'long',t:'Ván này căng đấy 😄',k:'pl'},{w:'thu',t:'H8 đẹp quá 👏'},{w:'minh',t:'Cảm ơn mọi người',k:'me'},{w:'bao',t:'Long phải chặn J10 ngay'},{w:'an',t:'kèo căng 🔥'},{w:'long',t:'Biết rồi mà 😅',k:'pl'}];
const COLS='ABCDEFGHIJKLMNOPQ';
const MOVES=['H9','I9','H8','H10','I8','G8','J7','G10','G9','I10','J10','F10','E10','J9','K8','I7','F8','H6','J8','K9','L9','G7','F6','E7','K10','L11','G6','H7','E9','D9','I11','J12','K7','L7'];
const av=(k,pc)=>{const p=PEOPLE[k];return `<span class="av" style="background:${p.c}">${p.i}${pc?`<span class="pc ${pc==='X'?'pcx':'pco'}">${pc==='X'?'✕':'○'}</span>`:''}</span>`};
const msg=m=>{const p=PEOPLE[m.w],me=m.k==='me';return `<div class="msg ${me?'me':''} ${m.k==='pl'?'pl':''}">${me?'':av(m.w)}<div class="bub">${me?'':`<span class="who">${p.n}</span>`}${m.t}</div></div>`};
const stack=lbl=>`<button class="stack" data-act="aud" aria-label="6 người xem"><span class="live"></span>${AUD.slice(0,3).map(k=>av(k)).join('')}<span class="more">+3</span></button>${lbl?'<span class="stack-lbl">6 đang xem</span>':''}`;
const audPop=()=>`<div class="aud-pop"><h4>👁 6 người đang xem</h4><div class="aud-grid">${AUD.map(k=>`<div>${av(k)}${PEOPLE[k].n}</div>`).join('')}</div></div>`;
function boardSVG(){const lab=26,n=17,cell=40,W=lab*2+n*cell;let s=`<svg class="board" viewBox="0 0 ${W} ${W}"><rect width="${W}" height="${W}" rx="4" fill="var(--board-bg)"/>`;
  for(let i=0;i<=n;i++){s+=`<line x1="${lab+i*cell}" y1="${lab}" x2="${lab+i*cell}" y2="${lab+n*cell}" stroke="var(--grid)"/><line x1="${lab}" y1="${lab+i*cell}" x2="${lab+n*cell}" y2="${lab+i*cell}" stroke="var(--grid)"/>`}
  for(let i=0;i<n;i++){s+=`<text x="${lab+i*cell+cell/2}" y="17" font-size="15" text-anchor="middle" fill="var(--lab)">${COLS[i]}</text><text x="13" y="${lab+(n-i-1)*cell+cell/2+5}" font-size="14" text-anchor="middle" fill="var(--lab)">${i+1}</text>`}
  MOVES.forEach((m,idx)=>{const c=COLS.indexOf(m[0]),r=+m.slice(1)-1,cx=lab+c*cell+cell/2,cy=lab+(n-r-1)*cell+cell/2,q=cell*.3;
    if(idx===MOVES.length-1)s+=`<rect x="${cx-cell/2+1}" y="${cy-cell/2+1}" width="${cell-2}" height="${cell-2}" fill="rgba(211,47,47,.15)"/>`;
    s+=idx%2===0?`<path d="M${cx-q} ${cy-q}L${cx+q} ${cy+q}M${cx+q} ${cy-q}L${cx-q} ${cy+q}" stroke="var(--x)" stroke-width="3.4" stroke-linecap="round"/>`:`<circle cx="${cx}" cy="${cy}" r="${q*1.15}" fill="none" stroke="var(--o)" stroke-width="3.4"/>`});
  return s+'</svg>'}
const nav=()=>`<div class="nav"><span class="brand">Play<b>3CR</b></span><a>Trang chủ</a><a>Phòng</a><a>Giải đấu</a><a>Xếp hạng</a><a>Hội nhóm</a><a>Học</a><span class="sp"></span><span>#5UX</span><span class="badge-m">🤝 Giao hữu</span><span>⇥ Rời phòng</span><span>⚙</span></div>`;
const seatOpp=()=>`<div class="seat">${av('long','O')}<div><div class="nm">Hoàng Long</div><div class="mt">1 642 · ● online</div></div><span class="clk">4:12</span></div>`;
const seatMe=()=>`<div class="seat turn">${av('minh','X')}<div><div class="nm">Minh (bạn)</div><div class="mt">1 608 · lượt bạn</div></div><span class="clk">3:47</span></div>`;
const ctrls=()=>`<div class="ctrls"><button class="act"><i>↶</i>Lùi</button><button class="act"><i>⏳</i>Xin time</button><button class="act"><i>🤝</i>Cầu hoà</button><button class="act"><i>⚑</i>Đầu hàng</button></div>`;
const games=()=>`<table class="games"><tr><td>Ván 1</td><td class="w">Minh</td><td>41 nước</td><td>8:12</td></tr><tr><td>Ván 2</td><td class="w">Long</td><td>27 nước</td><td>5:40</td></tr><tr><td>Ván 3</td><td class="w">Minh</td><td>55 nước</td><td>11:03</td></tr><tr><td>Ván 4</td><td>đang chơi</td><td>${MOVES.length} nước</td><td>—</td></tr></table>`;
const hero=()=>`<div class="score-hero"><div class="p">${av('long')}Long</div><span class="num">1–2</span><div class="p">${av('minh')}Minh</div></div><div class="dots"><span class="dot m"></span><span class="dot l"></span><span class="dot m"></span><span class="dot"></span><span class="dot"></span></div>`;
const BODY={chat:()=>`<div class="msg sys">Ván 4 bắt đầu · Minh cầm X</div>${CHAT.map(msg).join('')}`,score:()=>hero()+games(),
  moves:()=>`<div class="mvgrid">${MOVES.map((m,i)=>`<span class="${i===MOVES.length-1?'cur':''}"><em>${i+1}.</em><b style="color:${i%2?'var(--o)':'var(--x)'}">${i%2?'O':'X'}</b> ${m}</span>`).join('')}</div>`,
  set:()=>[['Bàn cờ','17×17'],['Thời gian','5 phút / người'],['Luật','Luật 1 · Ô khoá'],['Chế độ','Giao hữu'],['Khán giả chat','Cho phép']].map(([a,b])=>`<div class="set-row"><span>${a}</span><b>${b}</b></div>`).join('')};
const stageOver=()=>`<div class="fly">${['thu','bao','an'].map((k,i)=>`<div class="c">${av(k)}<span><b>${PEOPLE[k].n}</b>${['H8 đẹp quá 👏','Long phải chặn J10 ngay','kèo căng 🔥'][i]}</span></div>`).join('')}</div><div class="reacts"><span>👏</span><span>🔥</span><span>❤️</span><span>👏</span><span>😮</span></div>`;
const tabs=(list)=>`<div class="tabs">${list.map(([t,l])=>`<button data-act="tab:${t}" data-t="${t}" class="${t==='set'?'gear':''}" title="${t==='set'?'Cài đặt phòng':''}">${l}</button>`).join('')}</div><div class="tbody"></div>`;

const DIRS={
 A:{intro:'<b>A · Panel sống</b> — giữ bố cục 2 cột hiện tại (bàn cờ | rail phải, vẫn thu gọn được bằng nút ‹). Rail đổi sang ngôn ngữ phone: <b>thẻ đối thủ · tab pill Chat·Tỉ số·Nước đi·⚙ · hàng nút ván · dock (khán giả · ô nhập · 👏) · thẻ của bạn</b>. Bình luận khán giả nổi thành pill ở góc dưới-trái bàn cờ, emoji bay ở mép phải bàn cờ.',
  html:()=>`${nav()}<div class="body"><div class="boardbox">${boardSVG()}${stageOver()}</div>
    <aside class="rail"><span class="toggle">›</span>${seatOpp()}<div class="panel">${tabs([['chat','Chat'],['score','Tỉ số'],['moves','Nước đi'],['set','⚙']])}<div class="dock">${stack()}<div class="input">Bình luận…</div><button class="ibtn" data-act="burst" aria-label="Vỗ tay">👏</button></div></div>${ctrls()}${seatMe()}</aside></div>
    <div class="speech opp">Ván này căng đấy 😄</div><div class="speech me">Cảm ơn mọi người</div>${audPop()}`,
  states:[['Nghỉ · Chat','tab:chat'],['Tỉ số','tab:score'],['Nước đi','tab:moves'],['Cài đặt','tab:set'],['Thả 👏','burst'],['Bạn chat','mine'],['Khán giả','aud']],
  notes:['<b>Ưu:</b> thay đổi ít nhất, giữ thói quen người dùng desktop; tận dụng gần hết code #368 (stage, dock, room:react, gameLog).','Bong bóng của người chơi bật ra dưới thẻ của họ (che đầu tab ≤4s, không bắt chạm) — <b>không đè lên bàn cờ</b>.','Pill khán giả chỉ hiện khi tab Chat không mở hoặc rail đang thu gọn (đã thấy chat trong rail thì không lặp lại).','Tablet 769–1200: rail 330px, nav ẩn link, giữ nguyên cấu trúc.','<b>Rủi ro:</b> rail khá dày (5 tầng) — ở 700px cao, phần nội dung tab chỉ còn ~250px.']},
 B:{intro:'<b>B · Sân khấu</b> — 3 cột quanh bàn cờ. <b>Trái:</b> thẻ đối thủ, thẻ tỉ số (1–2, chấm, từng ván), nút ván, thẻ của bạn; bong bóng thoại chĩa thẳng vào bàn cờ. <b>Phải:</b> khán giả ở đầu cột (avatar + "6 đang xem"), tab pill Chat·Nước đi·⚙, ô nhập + 👏. Pill khán giả + emoji bay trên bàn cờ như livestream.',
  html:()=>`${nav()}<div class="body"><div class="left">${seatOpp()}<div class="scorecard" data-act="noop"><h5>Tỉ số · Bo5</h5>${hero()}${games()}</div>${ctrls()}${seatMe()}</div>
    <div class="boardbox">${boardSVG()}${stageOver()}</div>
    <aside class="right"><div class="audbar">${stack(true)}<span class="sp"></span></div>${tabs([['chat','Chat'],['moves','Nước đi'],['set','⚙']])}<div class="dock"><div class="input">Bình luận…</div><button class="ibtn" data-act="burst" aria-label="Vỗ tay">👏</button></div></aside></div>
    <div class="speech opp">Ván này căng đấy 😄</div><div class="speech me">Cảm ơn mọi người</div>${audPop()}`,
  states:[['Nghỉ · Chat','tab:chat'],['Nước đi','tab:moves'],['Cài đặt','tab:set'],['Thả 👏','burst'],['Bạn chat','mine'],['Khán giả','aud']],
  notes:['<b>Ưu:</b> giống "sân khấu" nhất — 2 người chơi một bên, khán giả một bên; tỉ số luôn thấy, không cần tab.','Thời gian dọc theo cạnh trái, gần bàn cờ; bong bóng chĩa vào bàn cờ (che mép trái ≤4s, không bắt chạm).','Tablet 1024: cột 230 | bàn cờ | 280 — bàn cờ nhỏ hơn A (~480px so với ~640px).','<b>Rủi ro:</b> bàn cờ hẹp hơn ở màn ≤1280; thay đổi DOM lớn hơn (rail tách 2 cột), bỏ nút thu gọn rail.']}
};

let cur={dir:'A',size:'1440x900',state:'tab:chat'};
const fitIn=document.getElementById('fitIn'),fit=document.getElementById('fit');
function render(){
  const d=DIRS[cur.dir],[w,h]=cur.size.split('x').map(Number);
  fit.style.setProperty('--sw',w);fit.style.setProperty('--sh',h);
  fitIn.innerHTML=`<div class="screen ${cur.dir} ${w<1200?'narrow':''}" id="scr">${d.html()}</div>`;
  document.getElementById('intro').innerHTML=d.intro;document.getElementById('notes').innerHTML=d.notes.map(n=>`<li>${n}</li>`).join('');
  document.getElementById('state').innerHTML=d.states.map(([l,v])=>`<button data-v="${v}" aria-pressed="false">${l}</button>`).join('');
  if(!d.states.some(s=>s[1]===cur.state))cur.state='tab:chat';
  setState(cur.state);scale();
}
function setState(v){
  const s=document.getElementById('scr');cur.state=v;
  s.removeAttribute('data-aud');s.removeAttribute('data-mine');s.removeAttribute('data-burst');
  let tab=s.dataset.tab||'chat';
  if(v.startsWith('tab:'))tab=v.slice(4);
  if(v==='aud')s.dataset.aud='1';
  if(v==='mine')s.dataset.mine='1';
  if(v==='burst'){void s.offsetWidth;s.dataset.burst='1'}
  s.dataset.tab=tab;
  s.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const tb=s.querySelector('.tbody');tb.innerHTML=BODY[tab]();if(tab==='chat')tb.scrollTop=tb.scrollHeight;
  document.querySelectorAll('#state button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
}
function scale(){const [w]=cur.size.split('x').map(Number);const k=Math.min(1,fit.clientWidth/w);fitIn.style.transform=`scale(${k})`;fit.style.height=(+cur.size.split('x')[1]*k)+'px'}
addEventListener('resize',scale);
fitIn.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&a.dataset.act!=='noop')setState(a.dataset.act)});
document.getElementById('state').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setState(b.dataset.v)});
function seg(id,fn){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)})}
seg('dir',v=>{cur.dir=v;render()});seg('size',v=>{cur.size=v;render()});seg('theme',v=>document.documentElement.dataset.theme=v);
const q=new URLSearchParams(location.search);
if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');
['dir','size'].forEach(k=>{if(q.get(k)){cur[k]=q.get(k);document.querySelectorAll('#'+k+' button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===cur[k]))}});
render();
window.setState=setState;
</script>
</body>
</html>
