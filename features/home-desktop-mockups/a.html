<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="mockup.css"><title>Bàn cờ dưới đèn · Play3CR</title><body class="lamp"><div class="shell"><header><span class="logo">Play<b>3CR</b></span><nav aria-label="Sảnh"><strong>Trang chủ</strong><span>Phòng chơi</span><span>Xếp hạng</span><span>Giải đấu</span></nav><span class="user"><span class="avatar">M</span>Minh</span></header><main><section class="hero"><div><p class="greeting">Chào Minh,</p><h1>Sẵn sàng<br><em>một ván?</em></h1><div class="settings"><label>Luật chơi<select><option>Luật 1 (Ô khoá)</option><option>Luật 2</option></select></label><label>Thời gian<select><option>Tự động</option><option>5 phút</option><option>10 phút</option></select></label><label>Thể thức<select><option>Xếp hạng</option><option>Tự do</option></select></label></div><div class="actions"><button data-play aria-pressed="false" class="primary"><span class="label">Chơi nhanh</span> <span class="arrow" aria-hidden="true">↗</span></button><span role="status"></span><span>Thách đấu</span></div></div></section><div class="hero-foot"><form class="join"><label for="code">Mã phòng</label><input name="code" id="code" maxlength="3" minlength="3" required pattern="[A-Za-z0-9]{3}" placeholder="– – –" autocomplete="off"><button class="secondary">Vào phòng <span class="arrow">→</span></button><output></output></form><dl class="stats"><div><dt>Trực tuyến</dt><dd>48</dd></div><div><dt>Đang tìm trận</dt><dd>06</dd></div><div><dt>Ván đang chơi</dt><dd>12</dd></div></dl></div></main><footer class="links"><strong>Bảng quán cờ</strong><span>Học</span><span>Diễn đàn</span><span>Giải đấu</span><span>Hội nhóm</span></footer></div><script src="mockup.js"></script></body></html>
