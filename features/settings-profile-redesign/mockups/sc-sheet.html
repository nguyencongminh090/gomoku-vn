<!doctype html><html lang="vi" data-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SC Tờ khai</title>
<link rel="stylesheet" href="../../../client/vendor/fonts/nunito/style.css"><link rel="stylesheet" href="../../../client/css/tokens.css"><link rel="stylesheet" href="../common.css">
<style>
/* SC — minimalism-swiss. One 720px column (same width as today), labelled rows on a single surface, numbered groups. */
.mk-wrap{max-width:720px}
.sheet{background:var(--c-surface);border-radius:20px;padding:4px 24px 8px}
.g{padding:20px 0;background:var(--c-surface)}.g+.g{border-top:1px solid var(--line)}
.g h2{margin:0 0 12px;display:flex;align-items:baseline;gap:12px;font-size:20px;font-weight:900}
.g h2 .no{font-size:13px;font-weight:900;color:var(--c-brand-text);background:var(--tint);border-radius:8px;padding:2px 8px}
.r{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 20px;align-items:center;padding:10px 0}
.r>.lab{align-self:start;padding-top:10px}
.r .sub{display:block;font-weight:600;font-size:13px;color:var(--c-ink-2);margin-top:2px}
.r.sw-r{align-items:center}.r.sw-r .ctl{display:flex;justify-content:flex-end}
.id{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.id .btns{display:flex;flex-wrap:wrap;gap:8px}
.bar{position:sticky;bottom:0;margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 24px;background:var(--c-surface);border-radius:20px;box-shadow:0 -6px 20px -10px rgba(0,0,0,.5)}
.bar .st{margin-left:auto;color:var(--c-ink-2);font-size:14px}
@media(max-width:620px){.r{grid-template-columns:1fr}.r>.lab{padding-top:0}.r.sw-r{grid-template-columns:1fr auto}.sheet{padding:4px 16px 8px}.bar{padding:12px 16px}}
</style></head><body class="mk"><main class="mk-wrap">
<div class="mk-top rv"><h1>Cài đặt</h1></div>
<div class="mk-tabs rv" style="--i:1" role="tablist"><button class="mk-tab" role="tab" aria-selected="true" data-i="user-circle">Hồ sơ</button><button class="mk-tab" role="tab" aria-selected="false" data-i="paint-brush">Giao diện</button><button class="mk-tab" role="tab" aria-selected="false" data-i="sliders-horizontal">Trò chơi</button><button class="mk-tab" role="tab" aria-selected="false" data-i="lock">Tài khoản</button></div>
<div class="sheet rv" style="--i:2">
 <section class="g"><h2><span class="no">1</span>Ảnh đại diện</h2>
  <div class="id"><span class="av av--xl" id="st-avatar">M</span><div><div class="btns"><label class="btn" for="st-file" data-i="camera"><span>Đổi ảnh đại diện</span></label><input type="file" id="st-file" hidden><button type="button" class="btn btn--danger" id="st-avatar-remove" data-i="trash"><span>Xoá ảnh</span></button></div><p class="hint" style="margin-top:8px">JPEG, PNG hoặc WebP, tối đa 2 MB. Ảnh được thu nhỏ còn 256×256.</p></div></div></section>
 <section class="g"><h2><span class="no">2</span>Về bạn</h2>
  <div class="r"><label class="lab" for="st-bio" data-i="quotes">Giới thiệu</label><div class="field"><textarea class="inp" id="st-bio" maxlength="280" rows="3" placeholder="Tối đa 280 ký tự">Chơi Caro từ năm 2019, thích khai cuộc chặn hai đầu.</textarea><span class="hint" id="bio-count" style="text-align:right">0/280</span></div></div>
  <div class="r"><label class="lab" for="st-country" data-i="globe">Quốc gia</label><select class="inp" id="st-country"><option>Việt Nam</option><option>Nhật Bản</option></select></div>
  <div class="r"><label class="lab" for="st-city" data-i="map-pin">Thành phố</label><input class="inp" id="st-city" maxlength="40" value="Hà Nội"></div></section>
 <section class="g"><h2><span class="no">3</span>Riêng tư</h2>
  <label class="r sw-r"><span class="lab" data-i="clock-counter-clockwise"><span>Ẩn lịch sử ván đấu<span class="sub">Với người khác</span></span></span><span class="ctl"><span class="sw"><input type="checkbox" id="st-hide-history"><i></i></span></span></label>
  <label class="r sw-r"><span class="lab" data-i="quotes"><span>Ẩn giới thiệu<span class="sub">Với người khác</span></span></span><span class="ctl"><span class="sw"><input type="checkbox" id="st-hide-bio"><i></i></span></span></label>
  <label class="r sw-r"><span class="lab" data-i="user-circle-dashed"><span>Ẩn trạng thái trực tuyến</span></span><span class="ctl"><span class="sw"><input type="checkbox" id="st-hide-online"><i></i></span></span></label></section>
 <section class="g"><h2><span class="no">4</span>Ai được liên hệ</h2>
  <div class="r"><span class="lab" data-i="chat-circle">Nhắn tin</span><div class="seg" role="radiogroup" aria-label="Ai được nhắn tin"><label><input type="radio" name="dm" checked><span>Mọi người</span></label><label><input type="radio" name="dm"><span>Chỉ bạn bè</span></label><label><input type="radio" name="dm"><span>Không ai</span></label></div></div>
  <div class="r"><span class="lab" data-i="boxing-glove">Thách đấu</span><div class="seg" role="radiogroup" aria-label="Ai được thách đấu"><label><input type="radio" name="ch" checked><span>Mọi người</span></label><label><input type="radio" name="ch"><span>Chỉ bạn bè</span></label><label><input type="radio" name="ch"><span>Không ai</span></label></div></div>
  <div class="r"><span class="lab" data-i="user-plus">Kết bạn</span><div class="seg" role="radiogroup" aria-label="Ai được kết bạn"><label><input type="radio" name="fr" checked><span>Mọi người</span></label><label><input type="radio" name="fr"><span>Không ai</span></label></div></div></section>
</div>
<div class="bar rv" style="--i:7"><button class="btn btn--pri" id="st-save" data-i="check"><span>Lưu</span></button><button type="button" class="btn" id="st-cancel" data-i="arrow-counter-clockwise"><span>Hoàn tác</span></button><a class="btn" id="st-profile-link" href="#" data-i="eye"><span>Xem hồ sơ</span></a><span class="st" id="st-saved" role="status"></span></div>
</main><script src="../icons.js"></script><script src="../common.js"></script></body></html>
