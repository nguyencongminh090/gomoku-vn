g.innerHTML=L.map(x=>`<div class="c"><a href="mockups/${x[0]}.html"><img src="shots/${x[0]}-dark-1280.png" alt=""></a><div class="b"><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')</script></body></html>
